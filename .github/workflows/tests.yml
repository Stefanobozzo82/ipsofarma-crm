name: Test — trading system

# Valida ogni modifica al sistema di trading prima che arrivi su main: la
# stessa suite (pytest, mock/dati sintetici, nessuna rete reale) che gira
# in locale. Non copre gli script demo/operativi (fanno rete o leggono il
# DB locale per design, vedi trading-system/README.md).
on:
  push:
    branches: [main]
    paths: ["trading-system/**"]
  pull_request:
    paths: ["trading-system/**"]

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trading-system
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: trading-system/requirements.txt

      - name: Installa le dipendenze
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Esegui la suite di test
        run: pytest -q

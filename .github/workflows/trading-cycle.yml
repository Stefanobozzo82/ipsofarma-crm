name: Ciclo di trading autonomo (paper)

# Fa girare il modulo 8 (trading-system/scripts/run_cycle_once.py) una volta
# al giorno, gratis, senza nessuna macchina da gestire. Esegue SEMPRE in
# paper trading (config/execution.yaml: mode: paper, non toccato da questo
# workflow): nessun ordine può mai raggiungere un broker/exchange reale da
# qui, a prescindere da quanto spesso o a lungo gira.
#
# NOTA: i trigger `schedule` di GitHub Actions partono solo per i workflow
# presenti sul branch di default del repository — finché questo file resta
# solo su un branch feature, il cron sotto non si attiva da solo (puoi
# comunque lanciarlo a mano con "Run workflow" nella tab Actions, che
# funziona su qualunque branch).
on:
  schedule:
    # 06:00 UTC, in linea con trading-system/config/scheduler.yaml (run_at_utc).
    # Se cambi l'orario lì, cambialo anche qui: sono due config indipendenti.
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write # per salvare lo stato aggiornato del conto paper sul branch paper-trading-state

# Non far mai sovrapporre due cicli: scriverebbero sullo stesso database
# SQLite concorrentemente. Non cancellare un run già partito: un ciclo a
# metà lascia il conto paper in uno stato incoerente.
concurrency:
  group: trading-cycle
  cancel-in-progress: false

jobs:
  run-cycle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codice
        uses: actions/checkout@v4
        with:
          path: code

      - name: Checkout stato del conto paper
        uses: actions/checkout@v4
        with:
          ref: paper-trading-state
          path: state

      - name: Ripristina il database del conto paper (se già esiste)
        run: |
          mkdir -p code/trading-system/data
          if [ -f state/trading-system/data/trading_system.db ]; then
            cp state/trading-system/data/trading_system.db code/trading-system/data/trading_system.db
            echo "Stato precedente ripristinato."
          else
            echo "Nessuno stato precedente: verrà creato un conto paper nuovo con la cassa iniziale di config/execution.yaml."
          fi

      - name: Imposta Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: code/trading-system/requirements.txt

      - name: Installa le dipendenze
        working-directory: code/trading-system
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Esegui il ciclo
        working-directory: code/trading-system
        run: python scripts/run_cycle_once.py

      - name: Salva lo stato aggiornato del conto paper
        if: always()
        run: |
          mkdir -p state/trading-system/data
          if [ -f code/trading-system/data/trading_system.db ]; then
            cp code/trading-system/data/trading_system.db state/trading-system/data/trading_system.db
          fi
          cd state
          git config user.name "trading-system-bot"
          git config user.email "actions@users.noreply.github.com"
          git add trading-system/data/trading_system.db
          if git diff --cached --quiet; then
            echo "Nessuna modifica allo stato del conto: niente da salvare."
          else
            git commit -m "Ciclo autonomo $(date -u +%Y-%m-%dT%H:%M:%SZ) (run ${{ github.run_id }})"
            git push origin HEAD:paper-trading-state
          fi

      - name: Carica i log come artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trading-cycle-logs-${{ github.run_id }}
          path: code/trading-system/logs/
          retention-days: 30
          if-no-files-found: ignore

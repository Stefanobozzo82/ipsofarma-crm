<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Dog Distance</title>
<style>
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    overflow:hidden; background:#000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    touch-action:none; user-select:none;
  }
  #stage{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    background:#000;
  }
  canvas{
    display:block;
    background:#0a1a3a;
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
    touch-action:none;
  }
  #hint{
    position:fixed; left:0; right:0; bottom:6px;
    text-align:center; color:rgba(255,255,255,0.45);
    font-size:11px; letter-spacing:.03em; pointer-events:none;
    text-shadow: 0 1px 2px rgba(0,0,0,0.9);
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>
</div>
<div id="hint">SPAZIO / TAP — M per audio — Dog Distance (bonus stage tribute)</div>

<script>
(function(){
"use strict";

/* ============================================================
   DOG DISTANCE — tributo pixel-art al minigioco bonus di
   Windjammers (Data East, 1994). Risoluzione nativa 304x224
   (la risoluzione video reale del Neo-Geo), scalata senza
   smoothing per un vero look a blocchi.

   Stati: MENU -> TITLE -> THROW -> GO -> RUN -> RESULT
   ============================================================ */

// ---------- Canvas nativo Neo-Geo + scaling pixelated ----------
const LOGICAL_W = 304;
const LOGICAL_H = 224;

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const stage = document.getElementById('stage');
ctx.imageSmoothingEnabled = false;

function resize(){
  const availW = window.innerWidth;
  const availH = window.innerHeight;
  const scale = Math.max(1, Math.floor(Math.min(availW / LOGICAL_W, availH / LOGICAL_H)));
  const fScale = Math.min(availW / LOGICAL_W, availH / LOGICAL_H);
  const useScale = fScale >= 2 ? scale : fScale; // interi sopra 2x per pixel puliti, altrimenti fit
  const cssW = Math.floor(LOGICAL_W * useScale);
  const cssH = Math.floor(LOGICAL_H * useScale);
  canvas.style.width = cssW + 'px';
  canvas.style.height = cssH + 'px';
  canvas.width = LOGICAL_W;
  canvas.height = LOGICAL_H;
  ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', resize);
resize();

// ---------- Utility ----------
function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }
function lerp(a, b, t){ return a + (b - a) * t; }
function rand(a, b){ return a + Math.random() * (b - a); }
function pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }

// ---------- Record persistente ----------
const STORAGE_KEY = 'dogDistance_bestMeters_v2';
let bestDistance = 0;
try { bestDistance = parseFloat(localStorage.getItem(STORAGE_KEY)) || 0; } catch(e){}
function saveRecord(m){
  if (m > bestDistance){
    bestDistance = m;
    try { localStorage.setItem(STORAGE_KEY, String(bestDistance)); } catch(e){}
    return true;
  }
  return false;
}

// ============================================================
// AUDIO — sintetizzato via Web Audio API, nessun file esterno.
// ============================================================
const Audio = (function(){
  let actx = null, muted = false;
  try { muted = localStorage.getItem('dogDistance_muted_v2') === '1'; } catch(e){}
  function ensure(){
    if (!actx){ try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ actx = null; } }
    if (actx && actx.state === 'suspended') actx.resume();
  }
  function toggleMute(){
    muted = !muted;
    try { localStorage.setItem('dogDistance_muted_v2', muted ? '1' : '0'); } catch(e){}
    if (!muted) ensure();
    return muted;
  }
  function tone(freq, dur, opts){
    if (muted || !actx) return;
    opts = opts || {};
    const t0 = actx.currentTime;
    const osc = actx.createOscillator(), gain = actx.createGain();
    osc.type = opts.type || 'square';
    osc.frequency.setValueAtTime(freq, t0);
    if (opts.sweepTo) osc.frequency.exponentialRampToValueAtTime(Math.max(20, opts.sweepTo), t0 + dur);
    const peak = opts.gain || 0.14;
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(peak, t0 + Math.min(0.02, dur * 0.3));
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain).connect(actx.destination);
    osc.start(t0); osc.stop(t0 + dur + 0.02);
  }
  function noise(dur, opts){
    if (muted || !actx) return;
    opts = opts || {};
    const t0 = actx.currentTime;
    const n = Math.max(1, Math.floor(actx.sampleRate * dur));
    const buf = actx.createBuffer(1, n, actx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i=0;i<n;i++) d[i] = (Math.random()*2-1) * (1 - i/n);
    const src = actx.createBufferSource(); src.buffer = buf;
    const filt = actx.createBiquadFilter(); filt.type = 'lowpass'; filt.frequency.value = opts.freq || 900;
    const gain = actx.createGain();
    gain.gain.setValueAtTime(opts.gain || 0.18, t0);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(filt).connect(gain).connect(actx.destination);
    src.start(t0);
  }
  return {
    ensure, toggleMute, get muted(){ return muted; },
    ui(){ tone(500, 0.05, { gain:0.09 }); },
    lock(){ noise(0.06,{freq:1400,gain:0.16}); tone(700,0.09,{type:'square',gain:0.12}); },
    go(){ [440,660,880].forEach((f,i)=>setTimeout(()=>tone(f,0.1,{type:'square',gain:0.13}), i*70)); },
    jump(){ tone(440,0.09,{type:'square',sweepTo:700,gain:0.11}); },
    land(){ noise(0.05,{freq:260,gain:0.1}); },
    trip(){ noise(0.16,{freq:180,gain:0.22}); tone(140,0.18,{type:'sawtooth',sweepTo:60,gain:0.1}); },
    clear(streak){ const f=560+Math.min(streak,8)*35; tone(f,0.08,{type:'triangle',sweepTo:f*1.3,gain:0.12}); },
    tick(){ tone(880,0.04,{type:'square',gain:0.07}); },
    timeup(){ [500,400,300].forEach((f,i)=>setTimeout(()=>tone(f,0.15,{type:'square',gain:0.1}), i*100)); },
    record(){ [660,880,1108,1318].forEach((f,i)=>setTimeout(()=>tone(f,0.14,{type:'triangle',gain:0.14}), i*90)); },
  };
})();

// ---------- Stati ----------
const STATE = { MENU:'MENU', TITLE:'TITLE', THROW:'THROW', GO:'GO', RUN:'RUN', RESULT:'RESULT' };
let state = STATE.MENU;
let stateT = 0; // tempo trascorso nello stato corrente

function setState(s){ state = s; stateT = 0; }

// ---------- Geometria spiaggia (vista ravvicinata da gioco) ----------
const WATER_H = 16;
const GROUND_Y = LOGICAL_H - WATER_H - 26; // linea dei piedi del cane
let worldScroll = 0; // offset texture sabbia/decorazioni

// ---------- Font pixel (monospace + niente smoothing = blocky) ----------
function ptext(text, x, y, size, color, align, outline){
  ctx.font = 'bold ' + size + 'px "Courier New", monospace';
  ctx.textAlign = align || 'left';
  ctx.textBaseline = 'top';
  if (outline !== false){
    ctx.strokeStyle = '#0a1020';
    ctx.lineWidth = Math.max(2, size * 0.22);
    ctx.lineJoin = 'round';
    ctx.strokeText(text, x, y);
  }
  ctx.fillStyle = color || '#ffffff';
  ctx.fillText(text, x, y);
}

// ============================================================
// THROW — barra di potenza (aggiunta fedele allo spirito arcade,
// il momento esatto del lancio non era visibile nei riferimenti)
// ============================================================
const throwBar = { value:0, dir:1, speed:150, locked:false, power:0 };
function resetThrowBar(){
  throwBar.value = 0; throwBar.dir = 1; throwBar.speed = rand(130,170); throwBar.locked = false; throwBar.power = 0;
}
function lockThrowBar(){
  if (throwBar.locked) return;
  throwBar.locked = true;
  Audio.lock();
  const d = Math.abs(50 - throwBar.value);
  throwBar.power = clamp(100 - d * 2.2, 0, 100);
  setTimeout(() => {
    if (state === STATE.THROW){
      startRun(throwBar.power);
      setState(STATE.GO);
    }
  }, 500);
}

// ============================================================
// RUN — corsa a tempo
// ============================================================
const DOG_X = 70;
const DOG_W = 22, DOG_H = 15;
const GRAVITY = 900;
const JUMP_VELOCITY = -340;
const RUN_TIME_START = 20; // il timer di gioco parte da 20, come nel riferimento

let run = null;

function startRun(power){
  const baseSpeed = 75 + (power/100) * 60; // 75..135 px/s
  run = {
    baseSpeed, speedMul: 1, tripT: 0,
    timeLeft: RUN_TIME_START,
    distance: 0,
    technical: 0,
    streak: 0, bestStreak: 0,
    hits: 0,
    obstacles: [], flags: [],
    spawnCd: rand(0.5, 0.9),
    nextFlagAt: 50,
    lastTickSec: RUN_TIME_START,
    dog: { y: GROUND_Y - DOG_H, vy:0, grounded:true, animT:0, squash:1 },
    dust: [],
    over: false,
  };
}

function dogRect(){
  const d = run.dog;
  return { x: DOG_X+4, y: d.y+3, w: DOG_W-8, h: DOG_H-4 };
}
function overlap(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }

function currentSpeed(){
  return run.baseSpeed * run.speedMul;
}

function spawnDust(x,y,n){
  for (let i=0;i<n;i++){
    run.dust.push({ x:x+rand(-2,2), y:y+rand(-1,1), vx:rand(-14,6), vy:rand(-24,-6), life:rand(0.2,0.4), maxLife:0.4 });
  }
}

const OBSTACLE_TYPES = ['sign','sunbather','sandcastle','hole'];
function spawnObstacle(){
  const type = pick(OBSTACLE_TYPES);
  const dims = { sign:{w:12,h:12}, sunbather:{w:18,h:9}, sandcastle:{w:12,h:9}, hole:{w:14,h:6} }[type];
  run.obstacles.push({
    type, x: LOGICAL_W+10, w:dims.w, h:dims.h,
    y: GROUND_Y - dims.h + (type==='hole' || type==='sunbather' ? dims.h-3 : 0),
    hit:false, counted:false,
  });
}

function updateThrow(dt){
  if (throwBar.locked) return;
  throwBar.value += throwBar.dir * throwBar.speed * dt;
  if (throwBar.value >= 100){ throwBar.value = 100; throwBar.dir = -1; }
  if (throwBar.value <= 0){ throwBar.value = 0; throwBar.dir = 1; }
}

function updateRun(dt){
  if (!run || run.over) return;

  if (run.tripT > 0){
    run.tripT = Math.max(0, run.tripT - dt);
    run.speedMul = lerp(0.4, 1, 1 - run.tripT/0.5);
  } else {
    run.speedMul = 1;
  }

  const speed = currentSpeed();
  worldScroll += speed * dt;

  run.timeLeft -= dt;
  const secLeft = Math.ceil(run.timeLeft);
  if (secLeft < run.lastTickSec && secLeft <= 5 && secLeft >= 0){
    Audio.tick();
  }
  run.lastTickSec = secLeft;
  if (run.timeLeft <= 0){
    run.timeLeft = 0;
    endRun();
    return;
  }

  run.distance += speed * dt * 0.09;

  // fisica cane
  const d = run.dog;
  d.animT += dt * (speed/70);
  if (!d.grounded){
    d.vy += GRAVITY*dt;
    d.y += d.vy*dt;
    if (d.y >= GROUND_Y - DOG_H){
      d.y = GROUND_Y - DOG_H; d.vy = 0; d.grounded = true; d.squash = 1.3;
      Audio.land();
      spawnDust(DOG_X+6, GROUND_Y-2, 4);
    }
  } else {
    d.squash = lerp(d.squash, 1, clamp(dt*10,0,1));
  }

  // spawn ostacoli
  run.spawnCd -= dt;
  if (run.spawnCd <= 0){
    spawnObstacle();
    const gap = rand(60, 115);
    run.spawnCd = gap / Math.max(speed, 60);
  }

  // bandierine distanza ogni 50m
  if (run.distance >= run.nextFlagAt){
    run.flags.push({ x: LOGICAL_W+10, meters: run.nextFlagAt });
    run.nextFlagAt += 50;
  }

  const dr = dogRect();

  for (let i=run.obstacles.length-1;i>=0;i--){
    const o = run.obstacles[i];
    o.x -= speed*dt;
    if (!o.hit && overlap(dr, o)){
      o.hit = true;
      run.hits++;
      run.streak = 0;
      run.tripT = 0.5;
      run.timeLeft = Math.max(0, run.timeLeft - 2);
      Audio.trip();
      spawnDust(o.x + o.w/2, o.y, 8);
    }
    if (!o.hit && !o.counted && (o.x+o.w) < dr.x){
      o.counted = true;
      run.streak++;
      run.bestStreak = Math.max(run.bestStreak, run.streak);
      const gained = 15 + Math.min(run.streak,8)*3;
      run.technical += gained;
      Audio.clear(run.streak);
    }
    if (o.x + o.w < -10) run.obstacles.splice(i,1);
  }

  for (let i=run.flags.length-1;i>=0;i--){
    const f = run.flags[i];
    f.x -= speed*dt;
    if (f.x < -20) run.flags.splice(i,1);
  }

  for (let i=run.dust.length-1;i>=0;i--){
    const p = run.dust[i];
    p.x += (p.vx - speed*0.5)*dt; p.y += p.vy*dt; p.vy += 160*dt; p.life -= dt;
    if (p.life<=0) run.dust.splice(i,1);
  }
}

function tryJump(){
  if (!run || run.over) return;
  const d = run.dog;
  if (d.grounded){ d.vy = JUMP_VELOCITY; d.grounded = false; d.squash = 1; Audio.jump(); }
}

function endRun(){
  if (!run || run.over) return;
  run.over = true;
  Audio.timeup();
  const isRecord = saveRecord(run.distance);
  run.isRecord = isRecord;
  setState(STATE.RESULT);
  if (isRecord) setTimeout(() => Audio.record(), 400);
}

// ---------- Input ----------
function handleAction(){
  if (state === STATE.MENU){ Audio.ui(); setState(STATE.TITLE); }
  else if (state === STATE.TITLE){ /* auto-avanza */ }
  else if (state === STATE.THROW){ lockThrowBar(); }
  else if (state === STATE.GO){ /* auto-avanza */ }
  else if (state === STATE.RUN){ tryJump(); }
  else if (state === STATE.RESULT){ Audio.ui(); setState(STATE.MENU); }
}

const MUTE_BTN = { x: LOGICAL_W-15, y: LOGICAL_H-15, w:11, h:10 };
function toLogical(clientX, clientY){
  const r = canvas.getBoundingClientRect();
  return { lx: (clientX-r.left)/r.width*LOGICAL_W, ly: (clientY-r.top)/r.height*LOGICAL_H };
}
function inMuteBtn(lx,ly){
  return lx>=MUTE_BTN.x-2 && lx<=MUTE_BTN.x+MUTE_BTN.w+2 && ly>=MUTE_BTN.y-2 && ly<=MUTE_BTN.y+MUTE_BTN.h+2;
}

window.addEventListener('keydown', (e) => {
  if (e.code === 'KeyM'){ Audio.toggleMute(); return; }
  if (e.code === 'Space' || e.code === 'ArrowUp'){
    e.preventDefault();
    if (e.repeat && state !== STATE.RUN) return;
    Audio.ensure();
    handleAction();
  }
}, { passive:false });

function onPointerDown(e){
  e.preventDefault();
  Audio.ensure();
  const cx = e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
  const cy = e.clientY !== undefined ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : 0);
  const { lx, ly } = toLogical(cx, cy);
  if (inMuteBtn(lx,ly)){ Audio.toggleMute(); return; }
  handleAction();
}
stage.addEventListener('pointerdown', onPointerDown, { passive:false });
stage.addEventListener('touchstart', (e) => e.preventDefault(), { passive:false });

// ============================================================
// RENDER — sfondi
// ============================================================
function drawStars(seedOffset){
  ctx.fillStyle = '#e8f0ff';
  for (let i=0;i<22;i++){
    const x = (i*37 + 13) % LOGICAL_W;
    const y = (i*19 + seedOffset) % 70;
    if ((i*7) % 5 === 0) ctx.fillRect(x, y, 1, 1);
  }
}

function drawPalmCorner(cx, cy, flip){
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(flip ? -1 : 1, 1);
  // tronco
  ctx.fillStyle = '#5b3a20';
  ctx.fillRect(-3, 0, 6, 26);
  // foglie
  ctx.fillStyle = '#1f6b2e';
  const fronds = [[-2,-2,-30,-10],[2,-2,26,-14],[-2,-6,-20,-26],[2,-6,18,-28],[0,-4,4,-34]];
  for (const f of fronds){
    ctx.beginPath();
    ctx.moveTo(f[0], f[1]);
    ctx.quadraticCurveTo(f[2]*0.5, f[3]*0.5, f[2], f[3]);
    ctx.lineTo(f[2]-4, f[3]+4);
    ctx.quadraticCurveTo(f[0]*0.5, f[1]*0.5+6, f[0], f[1]+6);
    ctx.closePath();
    ctx.fill();
  }
  ctx.fillStyle = '#2e8f3f';
  ctx.beginPath();
  ctx.ellipse(0, -4, 10, 6, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}

function drawWideBeach(t){
  // sfondo notturno da menu (vedi schermata "MINI-GAMES")
  const g = ctx.createLinearGradient(0,0,0,LOGICAL_H*0.6);
  g.addColorStop(0, '#0a1440');
  g.addColorStop(1, '#123a66');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,LOGICAL_W,LOGICAL_H*0.62);
  drawStars(Math.floor(t*2));
  // luna
  ctx.fillStyle = '#f2ecc8';
  ctx.beginPath(); ctx.arc(LOGICAL_W-46, 30, 12, 0, Math.PI*2); ctx.fill();
  // mare
  ctx.fillStyle = '#0f5f78';
  ctx.fillRect(0, LOGICAL_H*0.62, LOGICAL_W, LOGICAL_H*0.14);
  // sabbia
  ctx.fillStyle = '#caa15a';
  ctx.fillRect(0, LOGICAL_H*0.76, LOGICAL_W, LOGICAL_H*0.24);
  ctx.fillStyle = '#b98d47';
  for (let x=0;x<LOGICAL_W;x+=6){
    if ((x/6)%2===0) ctx.fillRect(x, LOGICAL_H*0.76, 3, 2);
  }
  // palme ai lati (sagome intere)
  ctx.fillStyle = '#123a1a';
  drawTree(18, LOGICAL_H*0.78, 1);
  drawTree(LOGICAL_W-18, LOGICAL_H*0.78, -1);
}

function drawTree(x, baseY, dir){
  ctx.save();
  ctx.translate(x, baseY);
  ctx.fillStyle = '#3a2414';
  ctx.fillRect(-2, -46, 4, 46);
  ctx.fillStyle = '#1a5c2a';
  for (let i=0;i<5;i++){
    const ang = (-0.4 + i*0.22) * dir;
    ctx.save();
    ctx.translate(0,-46);
    ctx.rotate(ang);
    ctx.beginPath();
    ctx.ellipse(14, 0, 16, 4, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}

function drawCloseBeach(){
  // sabbia piena con cornice di palme (vista da gioco)
  ctx.fillStyle = '#e8b463';
  ctx.fillRect(0,0,LOGICAL_W,LOGICAL_H-WATER_H);
  ctx.fillStyle = '#d69f4e';
  for (let i=0;i<40;i++){
    const x = (i*23 - worldScroll*0.6) % (LOGICAL_W+30);
    const xw = ((x % (LOGICAL_W+30)) + (LOGICAL_W+30)) % (LOGICAL_W+30) - 15;
    const y = 20 + (i*13)%(LOGICAL_H-WATER_H-30);
    ctx.fillRect(xw, y, 2, 1);
  }
  ctx.fillStyle = '#f6cf8c';
  for (let i=0;i<24;i++){
    const x = (i*31 - worldScroll*0.9 + 8) % (LOGICAL_W+30);
    const xw = ((x % (LOGICAL_W+30)) + (LOGICAL_W+30)) % (LOGICAL_W+30) - 15;
    const y = 30 + (i*17)%(LOGICAL_H-WATER_H-40);
    ctx.fillRect(xw, y, 3, 1);
  }
  // striscia d'acqua in basso
  ctx.fillStyle = '#1b8fa0';
  ctx.fillRect(0, LOGICAL_H-WATER_H, LOGICAL_W, WATER_H);
  ctx.fillStyle = '#bdf0f2';
  for (let x=0;x<LOGICAL_W;x+=8){
    const off = Math.floor(worldScroll*1.4) % 8;
    ctx.fillRect(x-off, LOGICAL_H-WATER_H, 4, 2);
  }
  // cornice palme fisse
  drawPalmCorner(-6, -4, false);
  drawPalmCorner(LOGICAL_W+6, -4, true);
}

// ============================================================
// RENDER — sprite
// ============================================================
function drawDog(x, y, animT, grounded, tripping, squash){
  ctx.save();
  const cx = x + DOG_W/2, cy = y + DOG_H;
  ctx.translate(cx, cy);
  ctx.scale(1/Math.sqrt(squash||1), squash||1);
  ctx.translate(-cx, -cy);

  const body = tripping ? '#e0a15a' : '#c8863f';
  const belly = '#f4dcb2';

  // zampe
  ctx.fillStyle = '#7a4d24';
  if (!grounded){
    ctx.fillRect(x+3, y+DOG_H-4, 3, 4);
    ctx.fillRect(x+DOG_W-8, y+DOG_H-6, 3, 5);
  } else if (tripping){
    ctx.fillRect(x+1, y+DOG_H-3, 4, 3);
    ctx.fillRect(x+DOG_W-6, y+DOG_H-5, 4, 5);
  } else {
    const phase = Math.floor(animT*8) % 2;
    if (phase === 0){
      ctx.fillRect(x+4, y+DOG_H-4, 2, 4);
      ctx.fillRect(x+DOG_W-9, y+DOG_H-6, 2, 6);
    } else {
      ctx.fillRect(x+2, y+DOG_H-6, 2, 6);
      ctx.fillRect(x+DOG_W-7, y+DOG_H-4, 2, 4);
    }
  }

  // coda
  ctx.strokeStyle = body; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x+2, y+DOG_H-9);
  ctx.lineTo(x-3, y+DOG_H-13 + Math.sin(animT*10)*1.5);
  ctx.stroke();

  // corpo
  ctx.fillStyle = body;
  ctx.beginPath();
  ctx.ellipse(x+DOG_W*0.5, y+DOG_H*0.55, DOG_W*0.42, DOG_H*0.32, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = belly;
  ctx.beginPath();
  ctx.ellipse(x+DOG_W*0.5, y+DOG_H*0.68, DOG_W*0.28, DOG_H*0.18, 0, 0, Math.PI*2);
  ctx.fill();

  // testa
  const hx = x+DOG_W*0.86, hy = y+DOG_H*0.34;
  ctx.fillStyle = body;
  ctx.beginPath(); ctx.ellipse(hx, hy, 5, 4.5, 0, 0, Math.PI*2); ctx.fill();
  // orecchio
  ctx.fillStyle = '#8a5a2b';
  ctx.beginPath();
  if (tripping){ ctx.ellipse(hx-3, hy+2, 3, 2, 0.7, 0, Math.PI*2); }
  else if (!grounded){ ctx.ellipse(hx-3, hy-4, 3, 2, -0.6, 0, Math.PI*2); }
  else { ctx.ellipse(hx-3, hy-1, 2.5, 3, 0, 0, Math.PI*2); }
  ctx.fill();
  // muso
  ctx.fillStyle = belly;
  ctx.beginPath(); ctx.ellipse(hx+4, hy+1, 2.5, 2, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#2a1a10';
  ctx.fillRect(hx+6, hy, 1, 1);
  ctx.fillRect(hx+1, hy-1, 1, 1);

  ctx.restore();
}

function drawObstacle(o){
  ctx.save();
  ctx.translate(o.x, o.y);
  switch(o.type){
    case 'sign': {
      ctx.fillStyle = '#2f6fd6';
      ctx.beginPath(); ctx.arc(o.w/2, o.h/2, o.w/2, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#eaf4ff'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(o.w/2, o.h/2, o.w/2-1.5, 0, Math.PI*2); ctx.stroke();
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(o.w*0.22,o.h*0.78); ctx.lineTo(o.w*0.78,o.h*0.22); ctx.stroke();
      break;
    }
    case 'sunbather': {
      ctx.fillStyle = '#d6453f';
      for (let i=0;i<o.w;i+=4) ctx.fillRect(i,0,2,o.h);
      ctx.fillStyle = '#e0a878';
      ctx.beginPath(); ctx.ellipse(o.w*0.5, o.h*0.4, o.w*0.42, o.h*0.32, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#f2c9a0';
      ctx.beginPath(); ctx.arc(o.w*0.86, o.h*0.35, 2.4, 0, Math.PI*2); ctx.fill();
      break;
    }
    case 'sandcastle': {
      ctx.fillStyle = '#a97a44';
      ctx.beginPath();
      ctx.moveTo(0,o.h); ctx.lineTo(1,o.h*0.3); ctx.lineTo(o.w*0.5,0);
      ctx.lineTo(o.w-1,o.h*0.3); ctx.lineTo(o.w,o.h); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#5c3d20';
      ctx.beginPath(); ctx.arc(o.w*0.35,o.h*0.7,1.6,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(o.w*0.65,o.h*0.7,1.6,0,Math.PI*2); ctx.fill();
      break;
    }
    case 'hole': {
      ctx.fillStyle = '#3a2a18';
      ctx.beginPath(); ctx.ellipse(o.w/2,o.h/2,o.w/2,o.h/2,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#1e140b';
      ctx.beginPath(); ctx.ellipse(o.w/2,o.h/2,o.w/2-2,o.h/2-1.5,0,0,Math.PI*2); ctx.fill();
      break;
    }
  }
  ctx.restore();
}

function drawFlag(f){
  ctx.save();
  ctx.translate(f.x, GROUND_Y - 2);
  ctx.fillStyle = '#4d3319';
  ctx.fillRect(-1, -22, 2, 22);
  ctx.fillStyle = '#2f6fd6';
  ctx.beginPath();
  ctx.moveTo(1,-22); ctx.lineTo(15,-18); ctx.lineTo(1,-14); ctx.closePath();
  ctx.fill();
  ptext(Math.round(f.meters)+'m', 1, -34, 6, '#ffffff', 'left');
  ctx.restore();
}

function drawDust(){
  for (const p of run.dust){
    const a = clamp(p.life/p.maxLife,0,1);
    ctx.globalAlpha = a*0.8;
    ctx.fillStyle = '#e8d3a0';
    ctx.fillRect(p.x, p.y, 2, 2);
  }
  ctx.globalAlpha = 1;
}

function drawPersonSilhouette(x,y){
  ctx.fillStyle = '#d6453f';
  ctx.fillRect(x-2, y-10, 4, 8); // busto
  ctx.fillStyle = '#e0a878';
  ctx.beginPath(); ctx.arc(x, y-13, 3, 0, Math.PI*2); ctx.fill(); // testa
  ctx.fillStyle = '#2a3a6a';
  ctx.fillRect(x-2, y-2, 2, 6); ctx.fillRect(x, y-2, 2, 6); // gambe
}

function drawMuteButton(){
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillRect(MUTE_BTN.x-2, MUTE_BTN.y-2, MUTE_BTN.w+4, MUTE_BTN.h+4);
  ctx.fillStyle = '#fff';
  ctx.fillRect(MUTE_BTN.x, MUTE_BTN.y+2, 3, 6);
  ctx.beginPath();
  ctx.moveTo(MUTE_BTN.x+3, MUTE_BTN.y+2); ctx.lineTo(MUTE_BTN.x+7, MUTE_BTN.y-1);
  ctx.lineTo(MUTE_BTN.x+7, MUTE_BTN.y+11); ctx.lineTo(MUTE_BTN.x+3, MUTE_BTN.y+8);
  ctx.closePath(); ctx.fill();
  if (Audio.muted){
    ctx.strokeStyle = '#ff5a5a'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(MUTE_BTN.x, MUTE_BTN.y); ctx.lineTo(MUTE_BTN.x+MUTE_BTN.w, MUTE_BTN.y+MUTE_BTN.h); ctx.stroke();
  }
  ctx.restore();
}

// ============================================================
// RENDER — schermate
// ============================================================
function drawMenu(t){
  drawWideBeach(t);
  ctx.fillStyle = '#ffd23f';
  ctx.fillRect(LOGICAL_W/2-70, 8, 140, 14);
  ptext('MINI-GAMES', LOGICAL_W/2, 11, 9, '#7a2e9e', 'center');

  ctx.fillStyle = 'rgba(10,20,40,0.72)';
  ctx.fillRect(20, 40, LOGICAL_W-40, 60);
  ctx.strokeStyle = '#2f6fd6'; ctx.lineWidth = 1;
  ctx.strokeRect(20, 40, LOGICAL_W-40, 60);

  ptext('◄ DOG DISTANCE ►', LOGICAL_W/2, 48, 8, '#ffd23f', 'center');
  drawDog(LOGICAL_W/2-40, 70, t*3, true, false, 1);
  ptext('RINCORRI IL FRISBEE', LOGICAL_W/2, 92, 6, '#eaf6ff', 'center');

  const pulse = 0.6 + Math.abs(Math.sin(t*3))*0.4;
  ctx.globalAlpha = pulse;
  ptext('PREMI SPAZIO O TOCCA', LOGICAL_W/2, 150, 7, '#ffffff', 'center');
  ctx.globalAlpha = 1;
  ptext('RECORD: ' + Math.floor(bestDistance) + 'm', LOGICAL_W/2, 168, 7, '#7CFC9A', 'center');
}

function drawTitleCard(t){
  drawCloseBeach();
  drawPersonSilhouette(DOG_X-10, GROUND_Y+2);
  drawDog(DOG_X+6, GROUND_Y-DOG_H, t*4, true, false, 1);
  ctx.fillStyle = 'rgba(10,15,25,0.35)';
  ctx.fillRect(0, LOGICAL_H/2-26, LOGICAL_W, 40);
  ptext('BONUS ROUND!', LOGICAL_W/2, LOGICAL_H/2-14, 13, '#ffd23f', 'center');
  ctx.fillStyle = '#ff6fae';
  ctx.font = 'italic bold 11px "Courier New", monospace';
  ctx.textAlign = 'center';
  ctx.fillText('"Dog"', LOGICAL_W/2, LOGICAL_H/2+4);
  if (t > 1.3){ resetThrowBar(); setState(STATE.THROW); }
}

function drawThrowBar(){
  const bx = 40, by = LOGICAL_H*0.36, bw = LOGICAL_W-80, bh = 10;
  ctx.fillStyle = 'rgba(10,15,25,0.6)';
  ctx.fillRect(bx-6, by-20, bw+12, bh+34);

  ptext('LANCIA IL FRISBEE', LOGICAL_W/2, by-18, 7, '#ffd23f', 'center');

  ctx.fillStyle = '#123'; ctx.fillRect(bx, by, bw, bh);
  const grad = ctx.createLinearGradient(bx,0,bx+bw,0);
  grad.addColorStop(0,'#d6453f'); grad.addColorStop(0.32,'#e0a13f');
  grad.addColorStop(0.5,'#7CFC9A'); grad.addColorStop(0.68,'#e0a13f'); grad.addColorStop(1,'#d6453f');
  ctx.fillStyle = grad; ctx.fillRect(bx+1, by+1, bw-2, bh-2);

  ctx.fillStyle = '#ffffff';
  ctx.fillRect(bx+bw/2-1, by-3, 2, bh+6);

  const ix = bx + (throwBar.value/100)*bw;
  ctx.fillStyle = throwBar.locked ? '#ffffff' : '#0a1020';
  ctx.beginPath();
  ctx.moveTo(ix, by-6); ctx.lineTo(ix-4, by-12); ctx.lineTo(ix+4, by-12);
  ctx.closePath(); ctx.fill();

  if (throwBar.locked){
    ptext('POTENZA ' + Math.round(throwBar.power) + '%', LOGICAL_W/2, by+bh+8, 8, '#ffd23f', 'center');
  } else {
    ptext('SPAZIO / TAP PER FERMARE', LOGICAL_W/2, by+bh+8, 6, '#eaf6ff', 'center');
  }
}

function drawThrow(t){
  drawCloseBeach();
  drawPersonSilhouette(DOG_X-10, GROUND_Y+2);
  drawDog(DOG_X+6, GROUND_Y-DOG_H, t*3, true, false, 1);
  drawThrowBar();
}

function drawGo(t){
  drawCloseBeach();
  drawPersonSilhouette(DOG_X-10, GROUND_Y+2);
  drawDog(DOG_X+6, GROUND_Y-DOG_H, t*6, true, false, 1);
  const pulse = t < 0.5 ? 1 : (0.5 + Math.abs(Math.sin(t*10))*0.5);
  ctx.globalAlpha = pulse;
  ptext('GO!', LOGICAL_W/2, LOGICAL_H*0.4, 22, '#ffd23f', 'center');
  ctx.globalAlpha = 1;
  drawHUDRun(); // timer già visibile durante il flash iniziale
  if (t > 0.7){ setState(STATE.RUN); Audio.go(); }
}

function drawHUDRun(){
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fillRect(0,0,LOGICAL_W,13);
  ptext('P1', 4, 3, 7, '#ffffff', 'left');
  ctx.fillStyle = '#2f6fd6';
  ctx.beginPath(); ctx.arc(20, 7, 3, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle='#fff'; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(20,7,3,0,Math.PI*2); ctx.stroke();

  ptext('HI ' + Math.floor(bestDistance) + 'm', LOGICAL_W/2, 3, 7, '#7CFC9A', 'center');

  const t = run ? Math.ceil(Math.max(0,run.timeLeft)) : RUN_TIME_START;
  const flashRed = t <= 5;
  ptext(String(t).padStart(2,'0'), LOGICAL_W-24, 2, 9, flashRed ? '#ff5a5a' : '#ffd23f', 'left');
}

function drawRun(){
  drawCloseBeach();
  drawDust();
  for (const f of run.flags) drawFlag(f);
  for (const o of run.obstacles) drawObstacle(o);
  const d = run.dog;
  drawDog(DOG_X, d.y, d.animT, d.grounded, run.tripT>0, d.squash);
  drawHUDRun();
  if (run.streak >= 3){
    ptext('STREAK x'+run.streak, LOGICAL_W/2, 16, 6, '#ffd23f', 'center');
  }
}

function drawResult(t){
  drawCloseBeach();
  drawPersonSilhouette(LOGICAL_W/2-2, GROUND_Y+2);

  const dist = Math.floor(run.distance);
  const distScore = dist * 100;
  const tech = run.technical;
  const total = distScore + tech;
  const rating = dist >= 180 ? 'EXCELLENT!' : dist >= 120 ? 'GREAT!' : dist >= 60 ? 'GOOD!' : 'OK!';

  ctx.fillStyle = 'rgba(6,12,22,0.72)';
  ctx.fillRect(14, 30, LOGICAL_W-28, 150);
  ctx.strokeStyle = '#2f6fd6'; ctx.strokeRect(14,30,LOGICAL_W-28,150);

  if (run.isRecord && t < 6){
    ptext('NUOVO RECORD!', LOGICAL_W/2, 36, 9, '#ffd23f', 'center');
  }

  let y = 52;
  const showAt = (delay) => t > delay;
  if (showAt(0.2)){ ptext('DISTANCE  '+dist+' x 100', LOGICAL_W/2, y, 8, '#ffffff', 'center'); y+=16; }
  if (showAt(0.6)){ ptext(distScore + ' !', LOGICAL_W/2, y, 9, '#ffd23f', 'center'); y+=18; }
  if (showAt(1.1)){ ptext('TECHNICAL POINT', LOGICAL_W/2, y, 8, '#ffffff', 'center'); y+=16; }
  if (showAt(1.5)){ ptext(tech + ' !', LOGICAL_W/2, y, 9, '#7CFC9A', 'center'); y+=20; }
  if (showAt(2.0)){ ptext('TOTALE '+total, LOGICAL_W/2, y, 8, '#ffffff', 'center'); y+=16; }
  if (showAt(2.4)){
    const pulse = 0.7+Math.abs(Math.sin(t*4))*0.3;
    ctx.globalAlpha = pulse;
    ptext(rating, LOGICAL_W/2, y+4, 12, '#ff9f3f', 'center');
    ctx.globalAlpha = 1;
  }

  if (t > 3.2){
    const pulse = 0.6+Math.abs(Math.sin(t*3))*0.4;
    ctx.globalAlpha = pulse;
    ptext('SPAZIO / TAP PER RIGIOCARE', LOGICAL_W/2, LOGICAL_H-14, 6, '#ffffff', 'center');
    ctx.globalAlpha = 1;
  }
}

// ============================================================
// MAIN LOOP
// ============================================================
let lastT = performance.now();
function frame(now){
  let dt = (now-lastT)/1000; lastT = now;
  dt = clamp(dt, 0, 0.05);
  stateT += dt;

  ctx.clearRect(0,0,LOGICAL_W,LOGICAL_H);

  switch(state){
    case STATE.MENU: drawMenu(stateT); break;
    case STATE.TITLE: drawTitleCard(stateT); break;
    case STATE.THROW: updateThrow(dt); drawThrow(stateT); break;
    case STATE.GO: drawGo(stateT); break;
    case STATE.RUN:
      updateRun(dt);
      if (state === STATE.RUN) drawRun();
      else drawResult(stateT);
      break;
    case STATE.RESULT: drawResult(stateT); break;
  }

  drawMuteButton();
  requestAnimationFrame(frame);
}

// inizializza il cane per gli schermi statici prima del primo RUN
run = { dog:{ y:GROUND_Y-DOG_H, vy:0, grounded:true, animT:0, squash:1 }, dust:[], obstacles:[], flags:[], tripT:0 };

requestAnimationFrame(frame);

if (location.search.indexOf('debug=1') >= 0){
  window.__debug = {
    getState(){ return { state, stateT, run, bestDistance }; },
    forceState(s){ setState(s); if (s===STATE.RUN) startRun(80); },
  };
}

})();
</script>

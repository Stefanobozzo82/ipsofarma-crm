<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#10241a" />
  <title>Piano Lago Valley</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #10241a;
      font-family: sans-serif;
      overflow: hidden;
      /* Niente pull-to-refresh / bounce su mobile mentre si gioca. */
      overscroll-behavior: none;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    #game-container {
      width: 100vw;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 0;
      touch-action: none;
      /* Rispetta notch/home-indicator sui telefoni con schermo "a isola". */
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      box-sizing: border-box;
    }
    canvas {
      image-rendering: pixelated;
      max-width: 100%;
      max-height: 100%;
      touch-action: none;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>

  <!-- Phaser 3 vendorizzato in locale (vendor/phaser.min.js): nessuna dipendenza da CDN esterni,
       nessun bundler richiesto, il resto del progetto usa moduli ES nativi. -->
  <script src="vendor/phaser.min.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>

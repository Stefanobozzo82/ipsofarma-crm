<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abbonamento — Gestionale</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0ea371">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<!--
  Fase 5: la pagina che mostra il piano corrente e permette a un admin di
  passare a un piano a pagamento. Non chiama mai Stripe direttamente — passa
  sempre da store.startCheckout(), che a sua volta passa dall'Edge Function
  stripe-checkout (chiave segreta Stripe lì, mai qui).

  NOTA: al momento nessun piano ha ancora un prezzo Stripe configurato (serve
  un account Stripe reale per crearli) — cliccando "Abbonati" su un piano a
  pagamento si vedrà quindi l'errore corretto e onesto invece di un
  pagamento vero: "questo piano non ha ancora un prezzo Stripe configurato".
-->
<script>(function(){try{if(localStorage.getItem('saas_theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<link rel="stylesheet" href="app/theme.css">
<style>
  /* Solo ciò che è specifico di questa pagina: il resto viene da theme.css */
  .stato{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .badge.accent{ background:var(--accent-soft); color:var(--accent-d); border:none; font-family:inherit; text-transform:capitalize; font-size:12px; padding:3px 10px; }
  .piani{ display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:14px; margin-top:16px; }
  .piano{ border:1px solid var(--border); border-radius:10px; padding:18px; display:flex; flex-direction:column; gap:8px; }
  .piano.corrente{ border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
  .piano h4{ margin:0; font-size:14.5px; font-weight:600; }
  .piano .prezzo{ font-size:22px; font-weight:600; font-variant-numeric:tabular-nums; font-family:var(--mono); }
  .piano .prezzo small{ font-size:13px; font-weight:400; color:var(--muted); font-family:inherit; }
  .piano ul{ margin:0; padding-left:18px; font-size:13px; color:var(--muted); flex:1; }
</style>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="app-main">
    <div class="page-head">
      <h2>Abbonamento</h2>
      <p class="sub">Piano attuale e cambio piano per la tua azienda.</p>
    </div>

    <div class="card">
      <h3 style="margin:0 0 12px">Piano attuale</h3>
      <div class="stato" id="stato-attuale"><p class="empty">Carico…</p></div>
    </div>

    <div class="card">
      <h3 style="margin:0 0 4px">Cambia piano</h3>
      <p class="empty" style="margin:0;padding:6px 0 0;text-align:left">Solo un amministratore dell'azienda può gestire l'abbonamento.</p>
      <div class="piani" id="piani-area"></div>
      <div class="msg" id="msg" hidden></div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
  window.SUPABASE_URL = 'https://rixvgmzedwdzgavjewbm.supabase.co';
  window.SUPABASE_ANON_KEY = 'sb_publishable_DFLcrBd6aiyyNGnCq41RQg_XrP0VR47';
</script>
<script src="app/store.js"></script>
<script src="app/theme-mode.js"></script>
<script src="app/nav.js"></script>
<script src="app/biometric-lock.js"></script>
<script src="app/tour.js"></script>
<script src="app/pwa.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const store = window.SaasStore;
  let companyId = null;
  let isAdmin = false;

  function esc(s){ return (s == null ? '' : String(s)).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function eur(n){ return (Number(n) || 0).toLocaleString('it-IT', { style:'currency', currency:'EUR' }); }
  function setMsg(text, kind){
    const el = $('msg');
    if(!text){ el.hidden = true; return; }
    el.textContent = text; el.className = 'msg ' + kind; el.hidden = false;
  }

  function limiteTesto(n){ return n == null ? 'illimitati' : n; }

  async function renderStatoAttuale(company){
    const area = $('stato-attuale');
    const statoTesto = company.subscription_status
      ? company.subscription_status
      : (company.piano === 'trial' ? 'prova gratuita' : '—');
    const scadenza = company.current_period_end
      ? ` · rinnova il ${new Date(company.current_period_end).toLocaleDateString('it-IT')}`
      : '';
    area.innerHTML = `
      <span class="badge accent">${esc(company.piano)}</span>
      <span>${esc(statoTesto)}${scadenza}</span>
    `;
  }

  // Tre motivi distinti per cui il pulsante può essere disabilitato, con un
  // messaggio diverso per ciascuno — non un generico "Non disponibile" che
  // confonderebbe "questo piano non si può ancora vendere" (manca il prezzo
  // Stripe: nessuno può abbonarsi) con "tu non puoi farlo" (serve un admin,
  // ma il piano di per sé è acquistabile). data-piano compare SOLO sul
  // pulsante davvero cliccabile.
  function pulsantePiano(p, corrente){
    if(corrente) return `<button class="primary" disabled>Piano attuale</button>`;
    if(!p.stripe_price_id) return `<button class="primary" disabled title="Questo piano non ha ancora un prezzo Stripe configurato">Non disponibile</button>`;
    if(!isAdmin) return `<button class="primary" disabled title="Solo un amministratore dell'azienda può cambiare piano">Passa a ${esc(p.nome)}</button>`;
    return `<button class="primary" data-piano="${p.id}">Passa a ${esc(p.nome)}</button>`;
  }

  async function renderPiani(plans, company){
    $('piani-area').innerHTML = plans.map(p => {
      const corrente = p.id === company.piano;
      return `<div class="piano ${corrente ? 'corrente' : ''}">
        <h4>${esc(p.nome)}</h4>
        <div class="prezzo">${p.prezzo_mensile > 0 ? eur(p.prezzo_mensile) : 'Gratis'}${p.prezzo_mensile > 0 ? '<small>/mese</small>' : ''}</div>
        <ul>
          <li>${limiteTesto(p.limite_utenti)} utenti</li>
          <li>${limiteTesto(p.limite_documenti_mese)} documenti/mese</li>
        </ul>
        ${pulsantePiano(p, corrente)}
      </div>`;
    }).join('');

    $('piani-area').querySelectorAll('[data-piano]').forEach(btn => {
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        setMsg('', '');
        try{
          const { url } = await store.startCheckout(
            companyId, btn.dataset.piano,
            location.origin + location.pathname + '?abbonamento=ok',
            location.origin + location.pathname + '?abbonamento=annullato',
          );
          location.href = url;
        }catch(err){
          setMsg(err.message || 'Errore imprevisto.', 'error');
          btn.disabled = false;
        }
      });
    });
  }

  async function doLogout(){
    await store.signOut();
    localStorage.removeItem('saas_company_id');
    localStorage.removeItem('saas_company_nome');
    location.href = 'index.html';
  }

  async function init(){
    const session = await store.getSession();
    if(!session){ location.href = 'index.html'; return; }
    companyId = localStorage.getItem('saas_company_id');
    if(!companyId){ location.href = 'index.html'; return; }
    window.SaasNav.render('abbonamento', {
      companyName: localStorage.getItem('saas_company_nome') || 'Azienda',
      email: session.user.email,
      onLogout: doLogout,
    });

    const params = new URLSearchParams(location.search);
    if(params.get('abbonamento') === 'ok') setMsg('Pagamento completato: l\'abbonamento si aggiornerà a breve.', 'ok');
    if(params.get('abbonamento') === 'annullato') setMsg('Operazione annullata, nessun addebito effettuato.', 'error');

    const [company, plans, memberships] = await Promise.all([
      store.getCompany(companyId),
      store.loadPlans(),
      store.myMemberships(),
    ]);
    isAdmin = memberships.some(m => m.company_id === companyId && m.role === 'admin');

    await renderStatoAttuale(company);
    await renderPiani(plans, company);
  }
  init();
</script>
</body>
</html>

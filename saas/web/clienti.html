<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clienti — Gestionale</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0ea371">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script>(function(){try{if(localStorage.getItem('saas_theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<link rel="stylesheet" href="app/theme.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="app-main">
    <div class="page-head">
      <h2>Clienti</h2>
      <p class="sub">Anagrafica clienti.</p>
    </div>

    <div class="card" id="form-card" hidden>
      <button type="button" class="linklike back-link" id="f-back">← Torna all'elenco</button>
      <h3 id="form-title">Nuovo cliente</h3>
      <label for="f-nome">Nome / ragione sociale</label>
      <input id="f-nome" type="text" placeholder="Farmacia Rossi Srl">
      <div class="grid2">
        <div><label for="f-tipo">Tipo soggetto</label>
          <select id="f-tipo"><option value="PG">Persona giuridica</option><option value="PF">Persona fisica</option><option value="PA">Pubblica amministrazione</option></select>
        </div>
        <div><label for="f-piva">Partita IVA</label><input id="f-piva" type="text"></div>
      </div>
      <label for="f-cf">Codice fiscale</label>
      <input id="f-cf" type="text">

      <div class="form-sec">Fatturazione elettronica</div>
      <div class="grid2">
        <div><label for="f-sdi">Codice destinatario SDI <span class="hint">7 caratteri, 6 per PA</span></label><input id="f-sdi" type="text" maxlength="7" placeholder="0000000"></div>
        <div><label for="f-pec">PEC</label><input id="f-pec" type="email"></div>
      </div>
      <div class="grid2">
        <div><label for="f-split">Scissione pagamenti (split)</label>
          <select id="f-split"><option value="no">No</option><option value="si">Sì</option></select>
        </div>
        <div><label for="f-esig">Esigibilità IVA</label>
          <select id="f-esig"><option value="I">Immediata</option><option value="D">Differita</option><option value="S">Scissione (split)</option></select>
        </div>
      </div>

      <div class="form-sec">Sede legale</div>
      <label for="f-via">Indirizzo</label>
      <input id="f-via" type="text" placeholder="Via e numero civico">
      <div class="grid3">
        <div><label for="f-cap">CAP</label><input id="f-cap" type="text" maxlength="5"></div>
        <div><label for="f-citta">Città</label><input id="f-citta" type="text"></div>
        <div><label for="f-prov">Prov.</label><input id="f-prov" type="text" maxlength="2"></div>
      </div>

      <div class="form-sec">Pagamento</div>
      <div class="grid3">
        <div><label for="f-pag">Modalità</label>
          <select id="f-pag"><option>Bonifico</option><option>RiBa</option><option>Contanti</option></select>
        </div>
        <div><label for="f-iban">IBAN</label><input id="f-iban" type="text"></div>
        <div><label for="f-term">Termini gg</label><input id="f-term" type="number"></div>
      </div>

      <div class="form-sec">Contatti</div>
      <div class="grid2">
        <div><label for="f-ref">Referente</label><input id="f-ref" type="text"></div>
        <div><label for="f-tel">Telefono</label><input id="f-tel" type="text"></div>
      </div>
      <label for="f-email">Email</label>
      <input id="f-email" type="email">
      <label for="f-note">Note</label>
      <textarea id="f-note" rows="2"></textarea>

      <div class="form-sec">Destinazioni di consegna <span class="hint">indirizzi di spedizione oltre alla sede legale (reparti, magazzini, farmacia…)</span></div>
      <div id="cdest"></div>
      <button type="button" class="linklike" id="add-dest" style="margin-top:2px">+ aggiungi destinazione</button>

      <div class="form-actions">
        <button class="primary" id="f-save">Salva</button>
        <button class="ghost" id="f-cancel">Annulla</button>
      </div>
      <div class="msg" id="form-msg" hidden></div>
    </div>

    <div class="card" id="list-card">
      <div class="toolbar">
        <h3>Elenco</h3>
        <div class="toolbar-right">
          <div class="search-box"><span class="si">⌕</span><input type="text" id="q" placeholder="Cerca per nome, P.IVA, città…"></div>
          <button class="primary" id="new-cliente">+ Nuovo cliente</button>
        </div>
      </div>
      <div id="list-area"><p class="empty">Carico…</p></div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
  window.SUPABASE_URL = 'https://rixvgmzedwdzgavjewbm.supabase.co';
  window.SUPABASE_ANON_KEY = 'sb_publishable_DFLcrBd6aiyyNGnCq41RQg_XrP0VR47';
</script>
<script src="app/store.js"></script>
<script src="app/theme-mode.js"></script>
<script src="app/nav.js"></script>
<script src="app/biometric-lock.js"></script>
<script src="app/tour.js"></script>
<script src="app/pwa.js"></script>
<script src="app/resize.js"></script>
<script src="app/elenco-cards.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const store = window.SaasStore;
  let companyId = null;
  let editingId = null; // null = sto creando, altrimenti sto modificando questo id
  let SORT = { key: 'nome', dir: 'asc' };
  let Q = ''; // ricerca testuale sull'elenco, come Q nel gestionale originale
  let CDEST = []; // destinazioni di consegna del cliente in editing, come CDEST nell'originale
  let destUid = 0;

  function setMsg(text, kind){
    const el = $('form-msg');
    if(!text){ el.hidden = true; return; }
    el.textContent = text; el.className = 'msg ' + kind; el.hidden = false;
  }
  function esc(s){ return (s == null ? '' : String(s)).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  // ---- ordinamento colonne: come nel gestionale originale — un clic
  // sull'intestazione ordina, un secondo clic inverte la direzione.
  function sortCmp(va, vb, dir){
    const mul = dir === 'asc' ? 1 : -1;
    if(typeof va === 'number' && typeof vb === 'number') return (va - vb) * mul;
    return String(va == null ? '' : va).localeCompare(String(vb == null ? '' : vb), 'it', { numeric:true }) * mul;
  }
  function sortVal(key, c){
    if(key === 'nome') return c.nome || '';
    if(key === 'piva') return c.piva || '';
    if(key === 'citta') return c.citta || '';
    if(key === 'tel') return c.tel || '';
    return '';
  }
  function th(key, label){
    const on = SORT.key === key, ar = on ? (SORT.dir === 'asc' ? ' ↑' : ' ↓') : '';
    return `<th class="thsort ${on ? 'on' : ''}" data-sort="${key}">${esc(label)}${ar}</th>`;
  }
  function setSort(key){
    if(SORT.key === key) SORT.dir = SORT.dir === 'asc' ? 'desc' : 'asc';
    else { SORT.key = key; SORT.dir = 'asc'; }
    renderList();
  }

  // Ricerca testuale: come Q nel gestionale originale (confronto case-insensitive
  // per sottostringa), qui su nome, P.IVA e città.
  function matchesQuery(c){
    if(!Q) return true;
    return (c.nome || '').toLowerCase().includes(Q)
      || (c.piva || '').toLowerCase().includes(Q)
      || (c.citta || '').toLowerCase().includes(Q);
  }
  let searchTimer = null;
  $('q').addEventListener('input', () => {
    Q = $('q').value.trim().toLowerCase();
    clearTimeout(searchTimer);
    searchTimer = setTimeout(renderList, 200);
  });

  // ---- destinazioni di consegna: elenco libero di indirizzi aggiuntivi
  // oltre alla sede legale, come dest[] nel gestionale originale — usati
  // da ddt.html e fatture.html per scegliere dove va consegnato/intestato
  // un singolo documento.
  function renderCDest(){
    const el = $('cdest');
    if(!CDEST.length){ el.innerHTML = '<div class="dest-empty">Nessuna destinazione aggiuntiva. Le consegne useranno la sede legale.</div>'; return; }
    el.innerHTML = CDEST.map((d, i) => `<div class="dest-card">
      <div class="dest-head">
        <input data-dest="${i}" data-f="nome" placeholder="Nome destinazione (es. Farmacia, Blocco operatorio, Reparto…)" value="${esc(d.nome)}">
        <button type="button" class="le-del" data-deldest="${i}" title="Rimuovi">×</button>
      </div>
      <input data-dest="${i}" data-f="via" placeholder="Indirizzo" value="${esc(d.via)}">
      <div class="grid3">
        <input data-dest="${i}" data-f="cap" placeholder="CAP" maxlength="5" value="${esc(d.cap)}">
        <input data-dest="${i}" data-f="citta" placeholder="Città" value="${esc(d.citta)}">
        <input data-dest="${i}" data-f="prov" placeholder="Prov" maxlength="2" value="${esc(d.prov)}">
      </div>
    </div>`).join('');
    el.querySelectorAll('[data-dest]').forEach(inp => inp.addEventListener('input', () => {
      CDEST[Number(inp.dataset.dest)][inp.dataset.f] = inp.value;
    }));
    el.querySelectorAll('[data-deldest]').forEach(btn => btn.addEventListener('click', () => {
      CDEST.splice(Number(btn.dataset.deldest), 1);
      renderCDest();
    }));
  }
  $('add-dest').addEventListener('click', () => {
    CDEST.push({ id: 'd' + (Date.now()) + '_' + (destUid++), nome:'', via:'', cap:'', citta:'', prov:'' });
    renderCDest();
  });

  function openForm(cliente){
    editingId = cliente ? cliente.id : null;
    $('form-title').textContent = cliente ? 'Modifica cliente' : 'Nuovo cliente';
    $('f-nome').value = cliente ? (cliente.nome || '') : '';
    $('f-tipo').value = cliente ? (cliente.tipo || 'PG') : 'PG';
    $('f-piva').value = cliente ? (cliente.piva || '') : '';
    $('f-cf').value = cliente ? (cliente.cf || '') : '';
    $('f-sdi').value = cliente ? (cliente.sdi || '') : '';
    $('f-pec').value = cliente ? (cliente.pec || '') : '';
    $('f-split').value = cliente ? (cliente.split || 'no') : 'no';
    $('f-esig').value = cliente ? (cliente.esig || 'I') : 'I';
    $('f-via').value = cliente ? (cliente.via || '') : '';
    $('f-cap').value = cliente ? (cliente.cap || '') : '';
    $('f-citta').value = cliente ? (cliente.citta || '') : '';
    $('f-prov').value = cliente ? (cliente.prov || '') : '';
    $('f-pag').value = cliente ? (cliente.pag || 'Bonifico') : 'Bonifico';
    $('f-iban').value = cliente ? (cliente.iban || '') : '';
    $('f-term').value = cliente ? (cliente.term || '') : '60';
    $('f-ref').value = cliente ? (cliente.ref || '') : '';
    $('f-tel').value = cliente ? (cliente.tel || '') : '';
    $('f-email').value = cliente ? (cliente.email || '') : '';
    $('f-note').value = cliente ? (cliente.note || '') : '';
    CDEST = (cliente && cliente.dest) ? cliente.dest.map(d => Object.assign({}, d)) : [];
    renderCDest();
    setMsg('', '');
    $('form-card').hidden = false;
    $('list-card').hidden = true;
    $('f-nome').focus();
  }
  function closeForm(){ $('form-card').hidden = true; $('list-card').hidden = false; editingId = null; }

  $('new-cliente').addEventListener('click', () => openForm(null));
  $('f-cancel').addEventListener('click', closeForm);
  $('f-back').addEventListener('click', closeForm);

  $('f-save').addEventListener('click', async () => {
    const nome = $('f-nome').value.trim();
    if(!nome){ setMsg('Il nome è obbligatorio.', 'error'); return; }
    const doc = {
      nome, tipo: $('f-tipo').value, piva: $('f-piva').value.trim() || null,
      cf: $('f-cf').value.trim() || null, sdi: $('f-sdi').value.trim() || null,
      pec: $('f-pec').value.trim() || null, split: $('f-split').value, esig: $('f-esig').value,
      via: $('f-via').value.trim() || null, cap: $('f-cap').value.trim() || null,
      citta: $('f-citta').value.trim() || null, prov: $('f-prov').value.trim().toUpperCase() || null,
      pag: $('f-pag').value, iban: $('f-iban').value.trim() || null,
      term: $('f-term').value.trim() || null, ref: $('f-ref').value.trim() || null,
      tel: $('f-tel').value.trim() || null,
      email: $('f-email').value.trim() || null, note: $('f-note').value.trim() || null,
      dest: CDEST.filter(d => d.nome || d.via || d.citta).map(d => ({
        id: d.id, nome: (d.nome || '').trim(), via: (d.via || '').trim(),
        cap: (d.cap || '').trim(), citta: (d.citta || '').trim(), prov: (d.prov || '').trim().toUpperCase(),
      })),
    };
    if(editingId) doc.id = editingId;
    $('f-save').disabled = true;
    try{
      await store.saveDoc('clienti', doc, companyId);
      closeForm();
      await renderList();
    }catch(err){
      setMsg(err.message || 'Errore imprevisto durante il salvataggio.', 'error');
    }finally{
      $('f-save').disabled = false;
    }
  });

  async function renderList(){
    const area = $('list-area');
    area.innerHTML = '<p class="empty">Carico…</p>';
    let clienti;
    try{
      clienti = await store.loadCollection('clienti', companyId);
    }catch(err){
      area.innerHTML = `<p class="empty">Errore nel caricamento: ${esc(err.message)}</p>`;
      return;
    }
    if(clienti.length === 0){
      area.innerHTML = '<p class="empty">Nessun cliente ancora. Aggiungine uno con "+ Nuovo cliente".</p>';
      return;
    }
    clienti = clienti.filter(matchesQuery);
    if(clienti.length === 0){
      area.innerHTML = '<p class="empty">Nessun cliente trovato per la ricerca.</p>';
      return;
    }
    clienti.sort((a, b) => sortCmp(sortVal(SORT.key, a), sortVal(SORT.key, b), SORT.dir));
    area.innerHTML = `<div class="table-scroll"><table class="elenco-table"><thead><tr>
        ${th('nome','Nome')}${th('piva','P.IVA')}${th('citta','Città')}${th('tel','Telefono')}<th></th>
      </tr></thead><tbody>${clienti.map(c => `
        <tr class="row-click" data-id="${c.id}">
          <td>${esc(c.nome)}</td>
          <td class="num-col">${esc(c.piva) || '—'}</td>
          <td>${esc(c.citta) || '—'}</td>
          <td>${esc(c.tel) || '—'}</td>
          <td class="actions">
            <button data-edit="${c.id}">Modifica</button>
            <button class="danger" data-del="${c.id}">Elimina</button>
          </td>
        </tr>`).join('')}</tbody></table></div>`;
    window.SaasResize.makeColsResizable(area.querySelector('table'), 'clienti-elenco');
    area.querySelectorAll('[data-sort]').forEach(th => th.addEventListener('click', () => setSort(th.dataset.sort)));
    area.querySelectorAll('[data-edit]').forEach(btn => btn.addEventListener('click', () => {
      const c = clienti.find(x => x.id === btn.dataset.edit);
      openForm(c);
    }));
    area.querySelectorAll('tbody tr[data-id]').forEach(tr => tr.addEventListener('click', e => {
      if(e.target.closest('button, input, a, select')) return; // non aprire se il clic è su un pulsante della riga
      openForm(clienti.find(x => x.id === tr.dataset.id));
    }));
    area.querySelectorAll('[data-del]').forEach(btn => btn.addEventListener('click', async () => {
      const c = clienti.find(x => x.id === btn.dataset.del);
      if(!confirm(`Eliminare "${c.nome}"? L'operazione non si può annullare.`)) return;
      try{
        await store.removeDoc('clienti', c.id);
        await renderList();
      }catch(err){
        alert('Errore durante l\'eliminazione: ' + err.message);
      }
    }));
  }

  async function doLogout(){
    await store.signOut();
    localStorage.removeItem('saas_company_id');
    localStorage.removeItem('saas_company_nome');
    location.href = 'index.html';
  }

  async function init(){
    const session = await store.getSession();
    if(!session){ location.href = 'index.html'; return; }
    companyId = localStorage.getItem('saas_company_id');
    if(!companyId){ location.href = 'index.html'; return; }
    window.SaasNav.render('clienti', {
      companyName: localStorage.getItem('saas_company_nome') || 'Azienda',
      email: session.user.email,
      onLogout: doLogout,
    });
    await renderList();
  }
  init();
</script>
</body>
</html>

<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard — Gestionale</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0ea371">

<!--
  Stesso quadro d'insieme del gestionale originale (index.html: funzione
  dashboard(), buildMonthly(), barChart()) — non un modulo nuovo, la stessa
  logica riportata qui: fatturato/acquisti dell'anno, quanto resta da
  incassare/pagare, quanto resta da evadere/ricevere, e l'andamento mensile
  in un grafico a barre con margine in linea.

  Lo sconto riga (anche a cascata "N+M") è ora un campo vero anche negli
  editor di ordini/fatture/note di credito, non solo qui: i totali di
  questa dashboard e quelli mostrati nell'elenco di ogni pagina documento
  usano la stessa identica aritmetica, coerenti tra loro.

  Una differenza onesta rimasta: la evasione parziale quantità per
  quantità (qtyEv) non ha ancora un editor in questo prodotto quando si
  crea un nuovo ordine da qui. I dati REALI importati da Ipsofarma la
  portano già con sé (fa parte del blob "righe", non filtrato da
  store.js) — quindi qui sotto il calcolo la usa comunque, correttamente,
  per i documenti storici; per i documenti creati da questo prodotto
  (senza qtyEv) il calcolo resta corretto, dà solo "niente ancora evaso"
  perché quel campo manca.
-->
<script>(function(){try{if(localStorage.getItem('saas_theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<link rel="stylesheet" href="app/theme.css">

<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="app-main">
  <div class="page-head" style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px">
      <div><h2 style="margin:0">Dashboard</h2><p class="sub">Quadro d'insieme di ordini, consegne e fatturato.</p></div>
      <div class="dash-period" id="anni"></div>
    </div>

    <div class="stats" id="stats-riga1"></div>
    <div class="stats" id="stats-riga2"></div>
    <div class="stats" id="stats-riga3"></div>

    <div class="panel">
      <div class="panel-h">
        <span id="panel-title">Andamento mensile (IVA inclusa)</span>
        <div class="legend">
          <span class="lg"><i style="background:#0ea371"></i>Fatturato</span>
          <span class="lg"><i style="background:#7c5cd6"></i>Acquisti</span>
          <span class="lg"><i style="background:#f59e0b"></i>Margine</span>
        </div>
      </div>
      <div class="chart-wrap" id="chart-wrap">
        <p class="empty">Carico…</p>
        <div class="chart-tip" id="chartTip"></div>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
  window.SUPABASE_URL = 'https://rixvgmzedwdzgavjewbm.supabase.co';

</script>
<script src="app/store.js"></script>

<script>
  const $ = id => document.getElementById(id);
  const store = window.SaasStore;
  let companyId = null;
  let DB = null;       // { ordiniCliente, ordiniFornitore, fattureCliente, fattureFornitore, noteCredito, noteCreditoFornitore }
  let DASHY = new Date().toISOString().slice(0, 4);
  let MONTHLY = [];

  function esc(s){ return (s == null ? '' : String(s)).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function eur(n){ return '€ ' + (Number(n) || 0).toLocaleString('it-IT', { minimumFractionDigits:2, maximumFractionDigits:2 }); }
  function eur0(n){ return '€ ' + Math.round(Number(n) || 0).toLocaleString('it-IT', { maximumFractionDigits:0 }); }

  // ---- stessa aritmetica del gestionale originale: sconto (anche a cascata
  // "N+M"), IVA, totale riga/documento — non una versione semplificata.
  function scParts(s){ return String(s == null ? '' : s).split('+').map(x => parseFloat(String(x).trim()) || 0); }
  function scFactor(s){ return scParts(s).reduce((f, p) => f * (1 - p / 100), 1); }
  function lineNet(x){ return (x.qty || 0) * (x.prezzo || 0) * scFactor(x.sconto); }
  function imp(righe){ return (righe || []).reduce((s, x) => s + lineNet(x), 0); }
  function ivaT(righe){ return (righe || []).reduce((s, x) => s + lineNet(x) * (x.iva || 0) / 100, 0); }
  function tot(righe){ return imp(righe) + ivaT(righe); }

  // Bug reale trovato confrontando con backup.json: su Supabase la colonna
  // "pagamenti" ha un default '[]'::jsonb, quindi per le fatture importate
  // dal vecchio gestionale (dove il campo "pagamenti" semplicemente non
  // esiste) arriva sempre un array VUOTO, mai null/undefined come nel
  // gestionale originale. Il controllo "== null" quindi non scattava mai e
  // il flag "paid" veniva ignorato per qualunque fattura senza incassi
  // parziali tracciati — ribaltando "Da incassare"/"Da pagare" su decine di
  // migliaia di euro. Un array vuoto va trattato come "nessun pagamento
  // tracciato", esattamente come l'assenza del campo.
  function payTot(it){
    if(it.pagamenti == null || it.pagamenti.length === 0) return it.paid ? tot(it.righe) : 0;
    return it.pagamenti.reduce((s, p) => s + (p.importo || 0), 0);
  }
  // Quanto di una nota di credito va imputato a una specifica fattura cliente.
  // Quanto di una nota di credito va imputato a UNA specifica fattura. Nel
  // caso normale (una sola fattura collegata) è l'intero importo della
  // nota. Quando invece copre un saldo complessivo su più fatture (ftIds
  // con più di un elemento, es. accordo transattivo), l'importo si
  // distribuisce sulle fatture collegate partendo dalla più vecchia — come
  // un incasso parziale applicato in sequenza — finché non si esaurisce.
  // Porta diretta di ncCreditoFor() in index.html: una prima versione qui
  // divideva l'importo in parti uguali tra tutte le fatture collegate,
  // invece di seguire questa cascata — corretto perché produceva un
  // residuo sbagliato sulle (rare) note di credito multi-fattura.
  function ncCreditoFor(nc, ftNum){
    const ids = (nc.ftIds && nc.ftIds.length) ? nc.ftIds : (nc.ftId ? [nc.ftId] : []);
    if(!ids.includes(ftNum)) return 0;
    if(ids.length <= 1) return tot(nc.righe);
    let remaining = tot(nc.righe);
    const ordered = ids.map(n => DB.fattureCliente.find(f => f.num === n)).filter(Boolean).sort((a, b) => (a.data || '').localeCompare(b.data || ''));
    for(const f of ordered){
      if(remaining <= 0) break;
      const alloc = Math.min(remaining, tot(f.righe));
      if(f.num === ftNum) return alloc;
      remaining -= alloc;
    }
    return 0;
  }
  function payState(it, noteCredito, noteCreditoFornitore, isFornitore){
    const totaleRaw = tot(it.righe);
    const sign = totaleRaw < 0 ? -1 : 1;
    const totale = totaleRaw * sign;
    const creditato = it.num
      ? (isFornitore
          ? (noteCreditoFornitore || []).filter(ncf => ncf.ftfId === it.num).reduce((s, ncf) => s + tot(ncf.righe), 0)
          : (noteCredito || []).reduce((s, nc) => s + ncCreditoFor(nc, it.num), 0))
      : 0;
    const pagato = (payTot(it) + creditato) * sign;
    const state = pagato <= 0.004 ? 'aperto' : pagato >= totale - 0.01 ? 'completo' : 'parziale';
    const residuo = Math.max(0, totale - pagato) * sign;
    return { state, residuo };
  }

  function evasione(o){
    const righe = o.righe || [];
    const totQ = righe.reduce((s, r) => s + (r.qty || 0), 0);
    const evQ = righe.reduce((s, r) => s + Math.min(r.qtyEv || 0, r.qty || 0), 0);
    const complete = righe.length > 0 && righe.every(r => (r.qtyEv || 0) >= (r.qty || 0));
    return { state: evQ <= 0 ? 'aperto' : complete ? 'completo' : 'parziale' };
  }
  function daEvaderePer(ordini){
    let importo = 0, n = 0;
    ordini.forEach(o => {
      if(evasione(o).state === 'completo') return;
      let ov = 0;
      (o.righe || []).forEach(r => {
        const res = Math.max(0, (r.qty || 0) - (r.qtyEv != null ? r.qtyEv : 0));
        if(res > 0) ov += tot([Object.assign({}, r, { qty: res })]);
      });
      if(ov > 0){ importo += ov; n++; }
    });
    return { importo, n };
  }

  function stat(label, valore, sotto, colore, href){
    const tag = href ? 'a' : 'div';
    const hrefAttr = href ? ` href="${href}"` : '';
    return `<${tag} class="stat"${hrefAttr}>
      <div class="sl">${esc(label)}</div>
      <div class="sv" style="color:${colore}">${valore}</div>
      <div class="sx">${esc(sotto)}</div>
    </${tag}>`;
  }

  function renderAnni(){
    const anni = [...new Set([...DB.fattureCliente, ...DB.fattureFornitore].map(f => (f.data || '').slice(0, 4)).filter(Boolean))].sort();
    $('anni').innerHTML = `<a class="${DASHY === '' ? 'on' : ''}" href="#" data-y="">Tutti</a>` +
      anni.map(y => `<a class="${DASHY === y ? 'on' : ''}" href="#" data-y="${y}">${y}</a>`).join('');
    $('anni').querySelectorAll('a').forEach(a => a.addEventListener('click', (e) => {
      e.preventDefault();
      DASHY = a.dataset.y;
      renderDashboard();
    }));
  }

  function renderDashboard(){
    renderAnni();
    const inY = f => !DASHY || (f.data || '').startsWith(DASHY);
    const fc = DB.fattureCliente.filter(inY), ff = DB.fattureFornitore.filter(inY);
    const nc = DB.noteCredito.filter(inY), ncf = DB.noteCreditoFornitore.filter(inY);
    const ncTot = nc.reduce((s, n) => s + tot(n.righe), 0);
    const ncfTot = ncf.reduce((s, n) => s + tot(n.righe), 0);
    const vendTot = fc.reduce((s, f) => s + tot(f.righe), 0) - ncTot;
    const acqTot = ff.reduce((s, f) => s + tot(f.righe), 0) - ncfTot;

    const ftOpen = fc.filter(f => payState(f, DB.noteCredito, DB.noteCreditoFornitore, false).state !== 'completo');
    const ftfOpen = ff.filter(f => payState(f, DB.noteCredito, DB.noteCreditoFornitore, true).state !== 'completo');
    const daInc = ftOpen.reduce((s, f) => s + payState(f, DB.noteCredito, DB.noteCreditoFornitore, false).residuo, 0);
    const daPag = ftfOpen.reduce((s, f) => s + payState(f, DB.noteCredito, DB.noteCreditoFornitore, true).residuo, 0);

    const oc = daEvaderePer(DB.ordiniCliente);
    const of = daEvaderePer(DB.ordiniFornitore);

    $('stats-riga1').innerHTML =
      stat('Totale fatturato', eur0(vendTot), fc.length + ' fatture cliente' + (nc.length ? ' − ' + nc.length + ' note di credito' : '') + ' · IVA incl.', 'var(--accent-d)', 'fatture.html') +
      stat('Totale acquisti', eur0(acqTot), ff.length + ' fatture fornitore' + (ncf.length ? ' − ' + ncf.length + ' note di credito' : '') + ' · IVA incl.', 'var(--violet)', 'fatture-fornitore.html');
    $('stats-riga2').innerHTML =
      stat('Da incassare dai clienti', eur0(daInc), ftOpen.length + ' fatture cliente aperte', 'var(--amber)', 'fatture.html') +
      stat('Da pagare ai fornitori', eur0(daPag), ftfOpen.length + ' fatture fornitore aperte', 'var(--red)', 'fatture-fornitore.html');
    $('stats-riga3').innerHTML =
      stat('Prodotti da evadere', eur0(oc.importo), oc.n + ' ordin' + (oc.n === 1 ? 'e' : 'i') + ' aperti o parziali · IVA incl.', 'var(--blue)', 'ordini.html') +
      stat('Da ricevere dai fornitori', eur0(of.importo), of.n + ' ordin' + (of.n === 1 ? 'e' : 'i') + ' fornitore aperti o parziali · IVA incl.', 'var(--violet)', 'ordini-fornitore.html');

    $('panel-title').textContent = 'Andamento mensile (IVA inclusa)' + (DASHY ? ' — ' + DASHY : '');
    renderChart();
  }

  const MESI = ['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
  function buildMonthly(){
    const map = {};
    const add = (ym, k, v) => { (map[ym] = map[ym] || { vend:0, acq:0 })[k] += v; };
    const inY = f => !DASHY || (f.data || '').startsWith(DASHY);
    DB.fattureCliente.filter(inY).forEach(f => add(f.data.slice(0, 7), 'vend', tot(f.righe)));
    DB.noteCredito.filter(inY).forEach(n => add(n.data.slice(0, 7), 'vend', -tot(n.righe)));
    DB.fattureFornitore.filter(inY).forEach(f => add(f.data.slice(0, 7), 'acq', tot(f.righe)));
    return Object.keys(map).sort().map(ym => { const [y, m] = ym.split('-'); return { label: MESI[+m - 1] + ' ' + y.slice(2), vend: map[ym].vend, acq: map[ym].acq }; });
  }
  function niceMax(v){ if(v <= 0) return 100; const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p; const m = n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10; return m * p; }
  // Griglia, assi ed etichette leggono i colori dal tema corrente (chiaro o
  // scuro — vedi le variabili --chart-* in app/theme.css): un SVG disegnato
  // a mano non eredita le variabili CSS come farebbe un elemento HTML, va
  // letto il valore calcolato al momento del disegno. I colori delle serie
  // (fatturato verde, acquisti viola, margine ambra) restano invece fissi
  // in entrambi i temi — sono già abbastanza saturi da leggersi su sfondo
  // sia chiaro che scuro.
  function cssVar(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
  function barChart(data){
    if(!data.length) return '<div class="chart-empty">Nessuna fattura registrata. Il grafico si popola man mano che emetti fatture cliente e registri fatture fornitore.</div>';
    const gridColor = cssVar('--chart-grid'), axisColor = cssVar('--chart-axis'), labelColor = cssVar('--chart-label'), dotColor = cssVar('--chart-dot');
    const W = 760, H = 280, padL = 60, padR = 18, padT = 16, padB = 34;
    const plotW = W - padL - padR, plotH = H - padT - padB, base = padT + plotH;
    const max = niceMax(Math.max(...data.flatMap(d => [d.vend, d.acq]), 1));
    const n = data.length, gw = plotW / n, bw = Math.min(36, gw * 0.30), gap = 6;
    const y = v => base - (v / max) * plotH;
    const fmt = val => val >= 1000 ? (val / 1000).toFixed(val % 1000 ? 1 : 0) + 'k' : Math.round(val);
    let g = '', hits = '';
    for(let i = 0; i <= 4; i++){ const val = max * i / 4, yy = base - (plotH * i / 4); g += `<line x1="${padL}" y1="${yy}" x2="${W - padR}" y2="${yy}" stroke="${gridColor}"/><text x="${padL - 8}" y="${yy + 4}" text-anchor="end" fill="${axisColor}" font-size="10" font-family="monospace">${fmt(val)}</text>`; }
    data.forEach((d, i) => {
      const cx = padL + gw * i + gw / 2, x1 = cx - bw - gap / 2, x2 = cx + gap / 2;
      g += `<rect class="cbar" style="animation-delay:${i * 30}ms" x="${x1}" y="${y(d.vend)}" width="${bw}" height="${base - y(d.vend)}" rx="3" fill="#0ea371"/>`;
      g += `<rect class="cbar" style="animation-delay:${i * 30 + 15}ms" x="${x2}" y="${y(d.acq)}" width="${bw}" height="${base - y(d.acq)}" rx="3" fill="#7c5cd6"/>`;
      g += `<text x="${cx}" y="${base + 18}" text-anchor="middle" fill="${labelColor}" font-size="11">${d.label}</text>`;
      hits += `<rect class="hit" id="hit${i}" x="${padL + gw * i}" y="${padT}" width="${gw}" height="${plotH}" data-i="${i}" onmousemove="chartTip(event,${i})" onmouseleave="chartHide()" onclick="chartTip(event,${i})"/>`;
    });
    const mY = i => Math.min(base, Math.max(padT, y(data[i].vend - data[i].acq)));
    const mpts = data.map((d, i) => (padL + gw * i + gw / 2) + ',' + mY(i)).join(' ');
    g += `<polyline fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="${mpts}"/>`;
    data.forEach((d, i) => { g += `<circle cx="${padL + gw * i + gw / 2}" cy="${mY(i)}" r="3.6" fill="${dotColor}" stroke="#f59e0b" stroke-width="2"/>`; });
    g += `<line x1="${padL}" y1="${base}" x2="${W - padR}" y2="${base}" stroke="${gridColor}"/>` + hits;
    return `<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet" font-family="system-ui">${g}</svg>`;
  }
  function renderChart(){
    const data = buildMonthly();
    MONTHLY = data;
    $('chart-wrap').innerHTML = barChart(data) + '<div class="chart-tip" id="chartTip"></div>';
  }
  window.chartTip = function(e, i){
    const wrap = document.getElementById('chart-wrap'), tip = document.getElementById('chartTip'), d = MONTHLY[i];
    if(!wrap || !tip || !d) return;
    const r = wrap.getBoundingClientRect();
    const px = ((e.touches && e.touches[0] ? e.touches[0].clientX : e.clientX) - r.left);
    const py = ((e.touches && e.touches[0] ? e.touches[0].clientY : e.clientY) - r.top);
    const wrapW = r.width;
    const mg = d.vend - d.acq;
    tip.innerHTML = `<div class="ct-m">${esc(d.label)}</div>
      <div class="ct-r"><span><i style="background:#0ea371"></i>Fatturato</span><b>${eur(d.vend)}</b></div>
      <div class="ct-r"><span><i style="background:#7c5cd6"></i>Acquisti</span><b>${eur(d.acq)}</b></div>
      <div class="ct-r ct-mg"><span>Margine</span><b style="color:${mg >= 0 ? '#5fe3ad' : '#ff9a9a'}">${eur(mg)}</b></div>`;
    tip.classList.add('show');
    const half = tip.offsetWidth / 2 + 8;
    tip.style.left = Math.max(half, Math.min(px, wrapW - half)) + 'px';
    tip.style.top = Math.max(tip.offsetHeight + 8, py - 16) + 'px';
    document.querySelectorAll('.hit.act').forEach(h => h.classList.remove('act'));
    const hit = document.getElementById('hit' + i); if(hit) hit.classList.add('act');
  };
  window.chartHide = function(){
    const t = document.getElementById('chartTip'); if(t) t.classList.remove('show');
    document.querySelectorAll('.hit.act').forEach(h => h.classList.remove('act'));
  };

  async function doLogout(){
    await store.signOut();
    localStorage.removeItem('saas_company_id');
    localStorage.removeItem('saas_company_nome');
    location.href = 'index.html';
  }

  async function init(){
    const session = await store.getSession();
    if(!session){ location.href = 'index.html'; return; }
    companyId = localStorage.getItem('saas_company_id');
    if(!companyId){ location.href = 'index.html'; return; }
    window.SaasNav.render('dashboard', {
      companyName: localStorage.getItem('saas_company_nome') || 'Azienda',
      email: session.user.email,
      onLogout: doLogout,
    });

    // Ora è la prima pagina che si apre dopo il login: un errore qui (rete,
    // RLS...) non deve lasciare la dashboard a metà senza spiegazione, come
    // ogni altra pagina del gestionale mostra un messaggio invece di un
    // errore silenzioso in console.
    try{
      const [ordiniCliente, ordiniFornitore, fattureCliente, fattureFornitore, noteCredito, noteCreditoFornitore] = await Promise.all([
        store.loadCollection('ordiniCliente', companyId),
        store.loadCollection('ordiniFornitore', companyId),
        store.loadCollection('fattureCliente', companyId),
        store.loadCollection('fattureFornitore', companyId),
        store.loadCollection('noteCredito', companyId),
        store.loadCollection('noteCreditoFornitore', companyId),
      ]);
      DB = { ordiniCliente, ordiniFornitore, fattureCliente, fattureFornitore, noteCredito, noteCreditoFornitore };
    }catch(err){
      $('chart-wrap').innerHTML = `<p class="empty">Errore nel caricamento: ${esc(err.message)}</p>`;
      return;
    }

    renderDashboard();
    // Il grafico è un SVG disegnato a mano: i suoi colori (griglia, assi,
    // etichette) sono letti dalle variabili CSS al momento del disegno,
    // non ereditati come farebbe un elemento HTML — cambiando tema da
    // Impostazioni va ridisegnato, altrimenti resterebbe coi colori del
    // tema precedente finché non si ricarica la pagina.
    window.addEventListener('saas-theme-change', renderChart);
  }
  init();
</script>
</body>
</html>

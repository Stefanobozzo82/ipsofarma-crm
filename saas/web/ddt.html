<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DDT — Gestionale</title>
<!--
  Terzo modulo reale del gestionale collegato a Supabase. Rispetto a
  ordini.html aggiunge il primo caso di documento che si collega a un
  ALTRO documento (ocId, oltre a clienteId) — non solo a un'anagrafica.
  Il campo ordine è facoltativo (un DDT può anche essere autonomo).
-->
<script>(function(){try{if(localStorage.getItem('saas_theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<link rel="stylesheet" href="app/theme.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="app-main">
  <div class="page-head">
      <h2>DDT</h2>
      <p class="sub">Documenti di trasporto, collegati facoltativamente a un ordine.</p>
    </div>

  <div class="card" id="form-card" hidden>
    <h3 id="form-title">Nuovo DDT</h3>
    <div class="grid2">
      <div><label for="f-cliente">Cliente</label><select id="f-cliente"></select></div>
      <div><label for="f-data">Data</label><input id="f-data" type="date"></div>
    </div>
    <label for="f-ordine">Ordine collegato (facoltativo)</label>
    <select id="f-ordine"><option value="">— nessuno —</option></select>
    <div id="f-dest-wrap"><label for="f-dest">Destinazione di consegna</label><select id="f-dest"></select></div>

    <div class="prod-pick"><input id="prodq" autocomplete="off" placeholder="Cerca per codice o descrizione…"><div class="prod-sugg" id="prodsugg"></div></div>
    <label>Righe</label>
    <div class="table-scroll"><table class="righe-table">
      <thead><tr><th>Codice</th><th>Descrizione</th><th>Lotto</th><th>Scadenza</th><th>Qtà</th><th></th></tr></thead>
      <tbody id="righe-body"></tbody>
    </table></div>
    <button class="linklike" id="add-riga" style="margin-top:8px">+ aggiungi riga</button>

    <div class="form-actions">
      <button class="primary" id="f-save">Salva</button>
      <button class="ghost" id="f-cancel">Annulla</button>
    </div>
    <div class="msg" id="form-msg" hidden></div>
  </div>

  <div class="card">
    <div class="toolbar">
      <h3>Elenco</h3>
      <div class="toolbar-right">
        <div class="search-box"><span class="si">⌕</span><input type="text" id="q" placeholder="Cerca per numero o cliente…"></div>
        <button class="primary" id="new-ddt">+ Nuovo DDT</button>
      </div>
    </div>
    <div id="list-area"><p class="empty">Carico…</p></div>
  </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
  window.SUPABASE_URL = 'https://rixvgmzedwdzgavjewbm.supabase.co';
  window.SUPABASE_ANON_KEY = 'sb_publishable_DFLcrBd6aiyyNGnCq41RQg_XrP0VR47';
</script>
<script src="app/store.js"></script>
<script src="app/theme-mode.js"></script>
<script src="app/nav.js"></script>
<script src="app/resize.js"></script>
<script src="app/print.js"></script>
<script src="app/prodpicker.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const store = window.SaasStore;
  let companyId = null;
  let company = {}; // dati azienda (companies), per l'intestazione di stampa/PDF
  let editingId = null;
  let clientiById = {};
  let ordiniPerCliente = {}; // clienteId -> [ordini]
  let allOrdiniById = {};
  let SORT = { key: 'num', dir: 'desc' };
  let Q = ''; // ricerca testuale sull'elenco, come Q nel gestionale originale
  let PICK = new Set(); // id selezionati con la spunta: i pulsanti azione di una riga compaiono solo se è spuntata

  function today(){ return new Date().toISOString().slice(0, 10); }
  function esc(s){ return (s == null ? '' : String(s)).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  // Sottotitolo "📍 destinazione" sotto il nome del cliente in elenco,
  // quando il documento indica una destinazione diversa dalla sede legale.
  function destSub(it){
    const cliente = clientiById[it.clienteId];
    const dest = (it.destId && cliente && cliente.dest) ? cliente.dest.find(d => d.id === it.destId) : null;
    return dest ? `<div style="font-size:11px;color:var(--faint);margin-top:1px">📍 ${esc(dest.nome || dest.citta || 'Sede')}</div>` : '';
  }
  function setMsg(text, kind){
    const el = $('form-msg');
    if(!text){ el.hidden = true; return; }
    el.textContent = text; el.className = 'msg ' + kind; el.hidden = false;
  }

  // ---- ordinamento colonne: come nel gestionale originale — un clic
  // sull'intestazione ordina, un secondo clic inverte la direzione.
  function sortCmp(va, vb, dir){
    const mul = dir === 'asc' ? 1 : -1;
    if(typeof va === 'number' && typeof vb === 'number') return (va - vb) * mul;
    return String(va == null ? '' : va).localeCompare(String(vb == null ? '' : vb), 'it', { numeric:true }) * mul;
  }
  function sortVal(key, d){
    if(key === 'num') return d.num || '';
    if(key === 'data') return d.data || '';
    if(key === 'cliente') return (clientiById[d.clienteId] || {}).nome || '';
    if(key === 'ordine') return d.ocId ? ((allOrdiniById[d.ocId] || {}).num || '') : '';
    return '';
  }
  function th(key, label){
    const on = SORT.key === key, ar = on ? (SORT.dir === 'asc' ? ' ↑' : ' ↓') : '';
    return `<th class="thsort ${on ? 'on' : ''}" data-sort="${key}">${esc(label)}${ar}</th>`;
  }
  function setSort(key){
    if(SORT.key === key) SORT.dir = SORT.dir === 'asc' ? 'desc' : 'asc';
    else { SORT.key = key; SORT.dir = key === 'num' || key === 'data' ? 'desc' : 'asc'; }
    renderList();
  }

  // Ricerca testuale: come Q nel gestionale originale (num + nome cliente).
  function matchesQuery(it){
    if(!Q) return true;
    const party = (clientiById[it.clienteId] || {}).nome || '';
    return (it.num || '').toLowerCase().includes(Q) || party.toLowerCase().includes(Q);
  }
  let searchTimer = null;
  $('q').addEventListener('input', () => {
    Q = $('q').value.trim().toLowerCase();
    clearTimeout(searchTimer);
    searchTimer = setTimeout(renderList, 200);
  });

  function rigaRowHtml(r){
    r = r || { cod:'', descr:'', qty:1, lotto:'', scad:'' };
    return `<tr>
      <td><div class="prod-pick"><input class="r-cod" value="${esc(r.cod)}" placeholder="cod." autocomplete="off"><div class="prod-sugg"></div></div></td>
      <td><input class="r-descr" value="${esc(r.descr)}" placeholder="descrizione"></td>
      <td style="width:90px"><input class="r-lotto" type="text" value="${esc(r.lotto || '')}" placeholder="lotto"></td>
      <td style="width:130px"><input class="r-scad" type="date" value="${esc(r.scad || '')}"></td>
      <td style="width:70px"><input class="r-qty" type="number" min="0" step="1" value="${r.qty}"></td>
      <td class="rm"><button type="button" class="rm-riga" title="rimuovi riga">✕</button></td>
    </tr>`;
  }
  function addRigaRow(r){
    $('righe-body').insertAdjacentHTML('beforeend', rigaRowHtml(r));
    const tr = $('righe-body').lastElementChild;
    tr.querySelector('.rm-riga').addEventListener('click', function(){ this.closest('tr').remove(); });
    // Stesso autocompletamento della barra di ricerca sopra la tabella, ma
    // dentro il campo "Codice" della riga stessa: scegliendo un prodotto
    // riempie questa riga invece di aggiungerne una nuova.
    window.SaasProdPicker.attach(tr.querySelector('.r-cod'), tr.querySelector('.prod-sugg'), {
      companyId, clearOnPick: false,
      onPick: p => {
        tr.querySelector('.r-cod').value = p.cod;
        tr.querySelector('.r-descr').value = p.descr;
        const qtyEl = tr.querySelector('.r-qty');
        if (!Number(qtyEl.value)) qtyEl.value = 1;
        qtyEl.focus(); qtyEl.select();
      },
    });
  }
  function readRighe(){
    return [...$('righe-body').querySelectorAll('tr')].map(tr => ({
      cod: tr.querySelector('.r-cod').value.trim(),
      descr: tr.querySelector('.r-descr').value.trim(),
      lotto: tr.querySelector('.r-lotto').value.trim(),
      scad: tr.querySelector('.r-scad').value,
      qty: Number(tr.querySelector('.r-qty').value) || 0,
    })).filter(r => r.descr || r.cod);
  }
  $('add-riga').addEventListener('click', () => addRigaRow(null));

  function refreshOrdineOptions(clienteId){
    const ordini = ordiniPerCliente[clienteId] || [];
    $('f-ordine').innerHTML = '<option value="">— nessuno —</option>' +
      ordini.map(o => `<option value="${o.id}">${esc(o.num)}</option>`).join('');
  }
  // Le destinazioni di consegna sono gestite in clienti.html (CDEST): qui
  // si sceglie solo quale usare per QUESTO documento, tra quelle già
  // registrate per il cliente selezionato — "Sede legale" resta il
  // default se il cliente non ne ha di aggiuntive.
  function refreshDestOptions(clienteId){
    const cliente = clientiById[clienteId];
    const dest = (cliente && cliente.dest) || [];
    $('f-dest-wrap').hidden = dest.length === 0;
    $('f-dest').innerHTML = '<option value="">Sede legale</option>' +
      dest.map(d => `<option value="${d.id}">${esc(d.nome || d.citta || 'Sede')}</option>`).join('');
  }
  $('f-cliente').addEventListener('change', () => { refreshOrdineOptions($('f-cliente').value); refreshDestOptions($('f-cliente').value); });
  $('f-ordine').addEventListener('change', () => {
    // comodità: se non sono ancora state scritte righe, precompila da quelle
    // dell'ordine selezionato (l'utente può comunque modificarle o svuotarle)
    const righeVuote = readRighe().length === 0;
    const ordine = allOrdiniById[$('f-ordine').value];
    if(ordine && righeVuote){
      $('righe-body').innerHTML = '';
      (ordine.righe || []).forEach(r => addRigaRow({ cod:r.cod, descr:r.descr, qty:r.qty }));
    }
  });

  function openForm(ddt){
    editingId = ddt ? ddt.id : null;
    $('form-title').textContent = ddt ? `Modifica ${ddt.num}` : 'Nuovo DDT';
    $('f-cliente').value = ddt ? ddt.clienteId : ($('f-cliente').options[0] ? $('f-cliente').options[0].value : '');
    refreshOrdineOptions($('f-cliente').value);
    refreshDestOptions($('f-cliente').value);
    $('f-ordine').value = ddt ? (ddt.ocId || '') : '';
    $('f-dest').value = ddt ? (ddt.destId || '') : '';
    $('f-data').value = ddt ? ddt.data : today();
    $('righe-body').innerHTML = '';
    (ddt ? ddt.righe : [null]).forEach(addRigaRow);
    setMsg('', '');
    $('form-card').hidden = false;
  }
  function closeForm(){ $('form-card').hidden = true; editingId = null; }
  $('new-ddt').addEventListener('click', () => {
    if(Object.keys(clientiById).length === 0){ alert('Crea prima almeno un cliente.'); return; }
    openForm(null);
  });
  $('f-cancel').addEventListener('click', closeForm);

  $('f-save').addEventListener('click', async () => {
    const clienteId = $('f-cliente').value;
    const ocId = $('f-ordine').value || null;
    const destId = $('f-dest').value || null;
    const data = $('f-data').value;
    const righe = readRighe();
    if(!clienteId){ setMsg('Seleziona un cliente.', 'error'); return; }
    if(!data){ setMsg('Inserisci una data.', 'error'); return; }
    if(righe.length === 0){ setMsg('Aggiungi almeno una riga con una descrizione.', 'error'); return; }

    $('f-save').disabled = true;
    setMsg('', '');
    try{
      const doc = { clienteId, ocId, destId, data, righe };
      if(editingId){
        doc.id = editingId;
      } else {
        const anno = Number(data.slice(0, 4));
        doc.num = await store.nextNumber(companyId, 'DDT', anno);
      }
      await store.saveDoc('ddt', doc, companyId);
      closeForm();
      await renderList();
    }catch(err){
      setMsg(err.message || 'Errore imprevisto durante il salvataggio.', 'error');
    }finally{
      $('f-save').disabled = false;
    }
  });

  async function renderList(){
    const area = $('list-area');
    area.innerHTML = '<p class="empty">Carico…</p>';
    let elenco;
    try{
      elenco = await store.loadCollection('ddt', companyId);
    }catch(err){
      area.innerHTML = `<p class="empty">Errore nel caricamento: ${esc(err.message)}</p>`;
      return;
    }
    if(elenco.length === 0){
      area.innerHTML = '<p class="empty">Nessun DDT ancora. Crea prima un cliente, poi aggiungi un DDT con "+ Nuovo DDT".</p>';
      return;
    }
    elenco = elenco.filter(matchesQuery);
    if(elenco.length === 0){
      area.innerHTML = '<p class="empty">Nessun DDT trovato per la ricerca.</p>';
      return;
    }
    elenco.sort((a, b) => sortCmp(sortVal(SORT.key, a), sortVal(SORT.key, b), SORT.dir));
    const allChecked = elenco.length > 0 && elenco.every(d => PICK.has(d.id));
    area.innerHTML = `<div class="table-scroll"><table><thead><tr>
        <th class="check-col"><input type="checkbox" id="check-all" ${allChecked ? 'checked' : ''}></th>
        ${th('num','Numero')}${th('data','Data')}${th('cliente','Cliente')}${th('ordine','Ordine')}<th></th>
      </tr></thead><tbody>${elenco.map(d => `
        <tr class="row-click" data-id="${d.id}">
          <td class="check-col"><input type="checkbox" class="row-check" data-id="${d.id}" ${PICK.has(d.id) ? 'checked' : ''}></td>
          <td class="num-col">${esc(d.num)}</td>
          <td>${d.data ? new Date(d.data).toLocaleDateString('it-IT') : '—'}</td>
          <td>${esc((clientiById[d.clienteId] || {}).nome) || '(cliente non trovato)'}${destSub(d)}</td>
          <td>${d.ocId ? `<span class="badge">${esc((allOrdiniById[d.ocId] || {}).num || '?')}</span>` : '—'}</td>
          <td class="actions">${PICK.has(d.id) ? `
            <button data-print="${d.id}" title="Stampa">🖨</button><button data-pdf="${d.id}" title="Scarica PDF">⬇ PDF</button><button data-edit="${d.id}">Modifica</button>
            <button class="danger" data-del="${d.id}">Elimina</button>` : ''}
          </td>
        </tr>`).join('')}</tbody></table></div>`;
    window.SaasResize.makeColsResizable(area.querySelector('table'), 'ddt-elenco');
    area.querySelectorAll('[data-sort]').forEach(th => th.addEventListener('click', () => setSort(th.dataset.sort)));
    $('check-all').addEventListener('click', e => {
      e.stopPropagation();
      if(e.target.checked) elenco.forEach(d => PICK.add(d.id));
      else elenco.forEach(d => PICK.delete(d.id));
      renderList();
    });
    area.querySelectorAll('.row-check').forEach(ch => ch.addEventListener('click', e => {
      e.stopPropagation();
      if(e.target.checked) PICK.add(ch.dataset.id); else PICK.delete(ch.dataset.id);
      renderList();
    }));
    area.querySelectorAll('[data-edit]').forEach(btn => btn.addEventListener('click', () => {
      openForm(elenco.find(x => x.id === btn.dataset.edit));
    }));
    area.querySelectorAll('tbody tr[data-id]').forEach(tr => tr.addEventListener('click', e => {
      if(e.target.closest('button, input, a, select')) return; // non aprire se il clic è su un pulsante/checkbox della riga
      openForm(elenco.find(x => x.id === tr.dataset.id));
    }));
    area.querySelectorAll('[data-print]').forEach(btn => btn.addEventListener('click', () => {
      const it = elenco.find(x => x.id === btn.dataset.print);
      window.SaasPrint.openPrintWindow('ddt', it, clientiById[it.clienteId], company);
    }));
    area.querySelectorAll('[data-pdf]').forEach(btn => btn.addEventListener('click', async () => {
      const it = elenco.find(x => x.id === btn.dataset.pdf);
      btn.disabled = true;
      try{
        await window.SaasPrint.downloadPDF('ddt', it, clientiById[it.clienteId], company);
      }catch(err){
        alert('Errore durante la generazione del PDF: ' + (err.message || err));
      }finally{
        btn.disabled = false;
      }
    }));
    area.querySelectorAll('[data-del]').forEach(btn => btn.addEventListener('click', async () => {
      const d = elenco.find(x => x.id === btn.dataset.del);
      if(!confirm(`Eliminare il DDT ${d.num}? L'operazione non si può annullare.`)) return;
      try{
        await store.removeDoc('ddt', d.id);
        await renderList();
      }catch(err){
        alert('Errore durante l\'eliminazione: ' + err.message);
      }
    }));
  }

  async function doLogout(){
    await store.signOut();
    localStorage.removeItem('saas_company_id');
    localStorage.removeItem('saas_company_nome');
    location.href = 'index.html';
  }

  async function init(){
    const session = await store.getSession();
    if(!session){ location.href = 'index.html'; return; }
    companyId = localStorage.getItem('saas_company_id');
    if(!companyId){ location.href = 'index.html'; return; }
    try{ company = await store.getCompany(companyId); }catch(e){ company = {}; } // niente PDF/stampa senza dati azienda? non deve comunque bloccare la pagina
    window.SaasNav.render('ddt', {
      companyName: localStorage.getItem('saas_company_nome') || 'Azienda',
      email: session.user.email,
      onLogout: doLogout,
    });

    const [clienti, ordini] = await Promise.all([
      store.loadCollection('clienti', companyId),
      store.loadCollection('ordiniCliente', companyId),
    ]);
    clientiById = Object.fromEntries(clienti.map(c => [c.id, c]));
    allOrdiniById = Object.fromEntries(ordini.map(o => [o.id, o]));
    ordiniPerCliente = {};
    ordini.forEach(o => { (ordiniPerCliente[o.clienteId] = ordiniPerCliente[o.clienteId] || []).push(o); });
    $('f-cliente').innerHTML = clienti.map(c => `<option value="${c.id}">${esc(c.nome)}</option>`).join('');

    window.SaasProdPicker.attach($('prodq'), $('prodsugg'), {
      companyId,
      onPick: p => addRigaRow({ cod: p.cod, descr: p.descr, qty: 1 }),
    });

    await renderList();
  }
  init();
</script>
</body>
</html>

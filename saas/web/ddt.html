<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DDT — Gestionale</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0ea371">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<!--
  Terzo modulo reale del gestionale collegato a Supabase. Rispetto a
  ordini.html aggiunge il primo caso di documento che si collega a un
  ALTRO documento (ocId, oltre a clienteId) — non solo a un'anagrafica.
  Il campo ordine è facoltativo (un DDT può anche essere autonomo).
-->
<script>(function(){try{if(localStorage.getItem('saas_theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<link rel="stylesheet" href="app/theme.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="app-main">
  <div class="page-head">
      <h2>DDT</h2>
      <p class="sub">Documenti di trasporto, collegati a un ordine.</p>
    </div>

  <div class="card" id="form-card" hidden>
    <button type="button" class="linklike back-link" id="f-back">← Torna all'elenco</button>
    <h3 id="form-title">Nuovo DDT</h3>
    <!-- Riga sotto il titolo: "Genera fattura" a sinistra, Stampa/Scarica
         a destra sulla stessa riga — stesso trattamento già fatto in
         ordini.html (richiesta reale: "voglio il pulsante genera fattura
         in alto sotto la scritta modifica come abbiamo fatto in
         precedenza"). Due <div> a sé perché si nascondono
         indipendentemente (un DDT nuovo non ha ancora né l'uno né
         l'altro). -->
    <div class="form-actions" id="ddt-toolbar" style="justify-content:space-between;flex-wrap:wrap;margin:0 0 14px">
      <div class="form-actions" id="ddt-cascade-actions" hidden style="margin:0">
        <button type="button" class="primary" id="ddt-btn-ft">→ Genera fattura</button>
      </div>
      <!-- Stampa/PDF qui, non solo nell'elenco (dove servivano prima spuntare
           la riga) — vedi lo stesso commento in ordini.html. Nascosto per un
           DDT nuovo non ancora salvato. -->
      <div class="form-actions" id="f-print-actions" hidden style="margin:0">
        <button type="button" class="ghost" id="f-btn-print">🖨 Stampa</button>
        <div class="dl-menu">
          <button type="button" class="ghost" id="f-btn-download">⬇ Scarica</button>
          <div class="dl-list" id="f-download-list" hidden>
            <button type="button" id="f-dl-pdf">📄 PDF</button>
            <button type="button" id="f-dl-excel">📊 Excel</button>
          </div>
        </div>
      </div>
    </div>
    <label for="f-cliente">Cliente</label>
    <select id="f-cliente"></select>
    <div class="grid2">
      <div><label for="f-num">Numero DDT</label><input id="f-num" type="text" placeholder="es. DDT/2026/0001"></div>
      <div><label for="f-data">Data</label><input id="f-data" type="date"></div>
    </div>
    <label for="f-ordine">Ordine collegato</label>
    <select id="f-ordine"><option value="">— nessuno —</option></select>
    <div id="f-dest-wrap"><label for="f-dest">Destinazione di consegna</label><select id="f-dest"></select></div>

    <label>Righe</label>
    <div class="table-scroll"><table class="righe-table">
      <thead><tr><th class="drag-col"></th><th>Codice</th><th>Descrizione</th><th>Lotto</th><th>Scadenza</th><th>Qtà</th><th>Prezzo</th><th>Sconto %</th><th>IVA %</th><th></th></tr></thead>
      <tbody id="righe-body"></tbody>
    </table></div>
    <button class="linklike" id="add-riga" style="margin-top:8px">+ aggiungi riga</button>
    <p class="righe-total">Totale: <b id="righe-totale">0,00 €</b></p>

    <div class="panel" id="f-lineage-panel" hidden style="margin:16px 0"><div class="panel-h">Documenti collegati</div><div id="f-lineage"></div></div>

    <div class="form-actions">
      <button class="primary" id="f-save">Salva</button>
      <button class="ghost" id="f-cancel">Annulla</button>
    </div>
    <div class="msg" id="form-msg" hidden></div>
  </div>

  <div class="card" id="list-card">
    <div class="toolbar">
      <h3>Elenco</h3>
      <div class="toolbar-right">
        <div class="search-box"><span class="si">⌕</span><input type="text" id="q" placeholder="Cerca per numero o cliente…"></div>
        <button class="primary" id="new-ddt">+ Nuovo DDT</button>
      </div>
    </div>
    <div id="filter-area"></div>
    <div id="list-area"><p class="empty">Carico…</p></div>
  </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
  window.SUPABASE_URL = 'https://rixvgmzedwdzgavjewbm.supabase.co';
  window.SUPABASE_ANON_KEY = 'sb_publishable_DFLcrBd6aiyyNGnCq41RQg_XrP0VR47';
</script>
<script src="app/store.js"></script>
<script src="app/doc-page.js"></script>
<script src="app/theme-mode.js"></script>
<script src="app/nav.js"></script>
<script src="app/biometric-lock.js"></script>
<script src="app/tour.js"></script>
<script src="app/pwa.js"></script>
<script src="app/resize.js"></script>
<script src="app/elenco-cards.js"></script>
<script src="app/list-cap.js"></script>
<script src="app/print.js"></script>
<script src="app/prodpicker.js"></script>
<script src="app/cascade.js"></script>
<script src="app/lineage.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const store = window.SaasStore;
  let companyId = null;
  let company = {}; // dati azienda (companies), per l'intestazione di stampa/PDF
  let editingId = null;
  let editingDdt = null; // il DDT in modifica, per non perdere ftId (extra) al salvataggio — vedi f-save
  let numberPreview = ''; // unchanged preview means automatic number inside the transaction
  let clientiById = {};
  let ordiniPerCliente = {}; // clienteId -> [ordini]
  let allOrdiniById = {};
  // Storico prezzi per lastClientPrice() qui sotto — caricato una volta
  // all'apertura della pagina (init), non ad ogni ricerca prodotto.
  let STORICO_PREZZI = { fattureCliente: [], ddt: [], ordiniCliente: [] };
  let SORT = { key: 'num', dir: 'desc' };
  let Q = ''; // ricerca testuale sull'elenco, come Q nel gestionale originale
  let PICK = new Set(); // id selezionati con la spunta: i pulsanti azione di una riga compaiono solo se è spuntata
  // Ultimo elenco scaricato da renderList() — usato da renderResults() per
  // ridisegnare senza rifare la query di rete quando cambia solo COME viene
  // mostrato (spunta, ordinamento, filtri, ricerca), non cosa contiene.
  let DDT_ALL = [];
  // Apertura sull'anno corrente; i link con anno esplicito conservano lo storico.
  const requestedDocumentYear = new URLSearchParams(location.search).get('anno');
  const initialDocumentYear = /^[1-9]\d{3}$/.test(requestedDocumentYear || '')
    ? requestedDocumentYear : String(new Date().getFullYear());
  let FFILT = { cliente: '', from: `${initialDocumentYear}-01-01`, to: `${initialDocumentYear}-12-31` }; // filtri sopra l'elenco, come FFILT nel gestionale originale

  // Funzioni comuni a tutte le pagine documento — vedi app/doc-page.js.
  const { today, esc, eur, sortCmp, docTotale } = window.SaasDocPage;
  // Sottotitolo "📍 destinazione" sotto il nome del cliente in elenco.
  function destSub(it){ return window.SaasDocPage.destSubHtml(clientiById[it.clienteId], it); }
  function setMsg(text, kind){ window.SaasDocPage.showMsg($('form-msg'), text, kind); }

  function sortVal(key, d){
    if(key === 'num') return d.num || '';
    if(key === 'data') return d.data || '';
    if(key === 'cliente') return (clientiById[d.clienteId] || {}).nome || '';
    if(key === 'ordine') return d.ocId ? ((allOrdiniById[d.ocId] || {}).num || '') : '';
    return '';
  }
  function th(key, label){ return window.SaasDocPage.thHtml(SORT, key, label); }
  function setSort(key){ window.SaasDocPage.toggleSort(SORT, key); renderResults(); }

  // Ricerca testuale: numero + nome cliente.
  function matchesQuery(it){ return window.SaasDocPage.matchesText(Q, it, (clientiById[it.clienteId] || {}).nome); }
  window.SaasDocPage.bindSearch($('q'), q => { Q = q; renderResults(); });

  // ---- filtri: cliente, intervallo date ----------------------------------
  function matchesFilter(d){
    if(FFILT.cliente && d.clienteId !== FFILT.cliente) return false;
    if(FFILT.from && (d.data || '') < FFILT.from) return false;
    if(FFILT.to && (d.data || '') > FFILT.to) return false;
    return true;
  }
  function setFFilt(k, v){ FFILT[k] = v; renderResults(); }
  function clearFFilt(){ FFILT = { cliente:'', from:'', to:'' }; renderResults(); }
  function renderFilterbar(){
    const active = FFILT.cliente || FFILT.from || FFILT.to;
    const clientiArr = window.SaasDocPage.sortByNome(Object.values(clientiById));
    const copts = '<option value="">Tutti i clienti</option>' +
      clientiArr.map(c => `<option value="${c.id}" ${FFILT.cliente === c.id ? 'selected' : ''}>${esc(c.nome)}</option>`).join('');
    $('filter-area').innerHTML = `<div class="filterbar">
      <select id="ff-cliente">${copts}</select>
      <div class="fdate-group">
        <label class="fdate">Dal <input type="date" id="ff-from" value="${FFILT.from}"></label>
        <label class="fdate">Al <input type="date" id="ff-to" value="${FFILT.to}"></label>
      </div>
      ${active ? '<button type="button" class="ffclear" id="ff-clear">✕ Azzera filtri</button>' : ''}
    </div>`;
    $('ff-cliente').addEventListener('change', () => setFFilt('cliente', $('ff-cliente').value));
    $('ff-from').addEventListener('change', () => setFFilt('from', $('ff-from').value));
    $('ff-to').addEventListener('change', () => setFFilt('to', $('ff-to').value));
    if(active) $('ff-clear').addEventListener('click', clearFFilt);
  }

  // Prezzo/sconto/iva sono nel form (come in fatture.html) anche se il DDT
  // stampato non li mostra (print.js li esclude apposta, come nel vecchio
  // gestionale): servono per portarli intatti nella fattura generata dal
  // DDT — senza di questi campi qui, la fattura doveva essere riscritta a
  // mano riga per riga (vedi $('f-ddt') in fatture.html).
  function rigaRowHtml(r){
    r = r || { cod:'', descr:'', qty:1, prezzo:0, sconto:'', iva:22, lotto:'', scad:'' };
    return `<tr ${r._last ? 'data-last="1"' : ''}>
      <td class="drag-col"><span class="drag-handle" draggable="true" title="Trascina per riordinare la riga">⠿</span></td>
      <td><div class="prod-pick"><input class="r-cod" value="${esc(r.cod)}" placeholder="cod." autocomplete="off"><div class="prod-sugg"></div></div>${r._last ? '<span class="lastp">ultimo prezzo</span>' : ''}</td>
      <td><input class="r-descr" value="${esc(r.descr)}" placeholder="descrizione"></td>
      <td style="min-width:90px"><input class="r-lotto" type="text" value="${esc(r.lotto || '')}" placeholder="lotto"></td>
      <td style="min-width:130px"><input class="r-scad" type="date" value="${esc(r.scad || '')}"></td>
      <td style="min-width:70px"><input class="r-qty" type="number" min="0" step="1" value="${r.qty}"></td>
      <td style="min-width:90px"><input class="r-prezzo" type="number" min="0" step="0.01" value="${r.prezzo}"></td>
      <td style="min-width:70px"><input class="r-sconto" type="text" inputmode="decimal" value="${esc(r.sconto || '')}" placeholder="0"></td>
      <td style="min-width:70px"><input class="r-iva" type="number" min="0" step="1" value="${r.iva}"></td>
      <td class="rm"><button type="button" class="rm-riga" title="rimuovi riga">✕</button></td>
    </tr>`;
  }
  // Riordino righe per trascinamento: SaasDocPage.bindRowDrag() qui sotto.
  function addRigaRow(r){
    $('righe-body').insertAdjacentHTML('beforeend', rigaRowHtml(r));
    const tr = $('righe-body').lastElementChild;
    if(r && Number.isInteger(r.source_order_index)) tr.dataset.sourceOrderIndex = String(r.source_order_index);
    tr.querySelector('.r-cod').addEventListener('input', () => { delete tr.dataset.sourceOrderIndex; });
    tr.querySelector('.rm-riga').addEventListener('click', function(){ this.closest('tr').remove(); updateTotale(); });
    tr.querySelectorAll('input').forEach(inp => inp.addEventListener('input', updateTotale));
    // Modificare prezzo o sconto a mano toglie il badge "ultimo prezzo" —
    // vedi clearLastBadge() più sopra.
    tr.querySelector('.r-prezzo').addEventListener('input', () => clearLastBadge(tr));
    tr.querySelector('.r-sconto').addEventListener('input', () => clearLastBadge(tr));
    window.SaasDocPage.bindRowDrag(tr);
    // Stesso autocompletamento della barra di ricerca sopra la tabella, ma
    // dentro il campo "Codice" della riga stessa: scegliendo un prodotto
    // riempie questa riga invece di aggiungerne una nuova.
    window.SaasProdPicker.attach(tr.querySelector('.r-cod'), tr.querySelector('.prod-sugg'), {
      companyId, priceField: 'listinoVen', clearOnPick: false, priceHistory: priceHistoryForForm,
      onPick: p => {
        delete tr.dataset.sourceOrderIndex;
        const last = lastClientPrice($('f-cliente').value, p.cod);
        tr.querySelector('.r-cod').value = p.cod;
        tr.querySelector('.r-descr').value = p.descr;
        tr.querySelector('.r-prezzo').value = last ? last.prezzo : (p.listinoVen || 0);
        tr.querySelector('.r-sconto').value = last ? (last.sconto || '') : '';
        tr.querySelector('.r-iva').value = p.iva ?? 22;
        const qtyEl = tr.querySelector('.r-qty');
        if (!Number(qtyEl.value)) qtyEl.value = 1;
        if(last) window.SaasDocPage.markLastBadge(tr); else clearLastBadge(tr);
        updateTotale();
        qtyEl.focus(); qtyEl.select();
      },
    });
    updateTotale();
  }
  function readRighe(){
    return [...$('righe-body').querySelectorAll('tr')].map(tr => ({
      ...(tr.dataset.sourceOrderIndex !== undefined ? { source_order_index: Number(tr.dataset.sourceOrderIndex) } : {}),
      cod: tr.querySelector('.r-cod').value.trim(),
      descr: tr.querySelector('.r-descr').value.trim(),
      lotto: tr.querySelector('.r-lotto').value.trim(),
      scad: tr.querySelector('.r-scad').value,
      qty: Number(tr.querySelector('.r-qty').value) || 0,
      prezzo: Number(tr.querySelector('.r-prezzo').value) || 0,
      sconto: tr.querySelector('.r-sconto').value.trim(),
      iva: Number(tr.querySelector('.r-iva').value) || 0,
    })).filter(r => r.descr || r.cod);
  }
  // Stessa aritmetica dello sconto per tutte le pagine documento: vedi app/doc-page.js.
  function updateTotale(){ $('righe-totale').textContent = eur(docTotale(readRighe())); }
  // Scroll sulla nuova riga al click manuale — vedi lo stesso commento in
  // ordini.html.
  $('add-riga').addEventListener('click', () => {
    addRigaRow(null);
    $('righe-body').lastElementChild.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  });

  function refreshOrdineOptions(clienteId){
    const ordini = ordiniPerCliente[clienteId] || [];
    $('f-ordine').innerHTML = '<option value="">— nessuno —</option>' +
      ordini.map(o => `<option value="${o.id}">${esc(o.num)}</option>`).join('');
  }
  // Destinazione di consegna tra quelle registrate sul cliente (clienti.html).
  function refreshDestOptions(clienteId){ window.SaasDocPage.fillDestOptions($('f-dest'), $('f-dest-wrap'), clientiById[clienteId]); }
  // Ultimo prezzo VENDUTO A QUESTO CLIENTE per un prodotto (e lo storico
  // per il tooltip di app/prodpicker.js) — vedi app/doc-page.js.
  const STORICO_COLLS = ['fattureCliente', 'ddt', 'ordiniCliente'];
  function lastClientPrice(clienteId, cod){ return clienteId ? window.SaasDocPage.lastLinePrice(STORICO_PREZZI, STORICO_COLLS, cod, d => d.clienteId === clienteId) : null; }
  function clientPriceHistory(clienteId, cod, limit){ return clienteId ? window.SaasDocPage.linePriceHistory(STORICO_PREZZI, STORICO_COLLS, cod, d => d.clienteId === clienteId, limit) : []; }
  // priceHistory(cod) per SaasProdPicker.attach() in addRigaRow() (autocompletamento riga).
  function priceHistoryForForm(cod){
    const cliId = $('f-cliente').value;
    const cli = clientiById[cliId];
    return {
      title: cli && cli.nome ? 'Ultimi prezzi a ' + cli.nome : 'Ultimi prezzi al cliente',
      rows: cliId ? clientPriceHistory(cliId, cod, 5) : [],
    };
  }
  const clearLastBadge = window.SaasDocPage.clearLastBadge;
  // Cambiare cliente a form già aperto riprezza le righe ancora col badge.
  async function repriceForClient(clienteId){
    await window.SaasDocPage.repriceRows($('righe-body'), cod => lastClientPrice(clienteId, cod), store, companyId, 'listinoVen');
    updateTotale();
  }
  // Precompila le righe dal RESIDUO dell'ordine (quanto non ancora
  // consegnato: qty - qtyEv), non dalle righe intere — un ordine può
  // essere evaso in più DDT (cascata, vedi ordini.html/generaDDT()). Un
  // ordine mai toccato dalla cascata ha qtyEv assente su ogni riga,
  // equivalente a 0: il comportamento per un ordine "vergine" resta
  // identico a prima (tutte le righe, per intero).
  async function precompileFromOrdine(ordine){
    $('righe-body').innerHTML = '';
    // prezzo/sconto/iva vengono dalla riga dell'ordine (residuoRighe() li
    // conserva già, spreadando {...r}): senza riportarli qui, il DDT (e la
    // fattura generata da esso) partiva sempre da prezzo 0.
    const residuo = window.SaasCascade.residuoRighe(ordine)
      .map((r, source_order_index) => ({ ...r, source_order_index }))
      .filter(r => r.residuo > 0)
      .map(r => ({ cod:r.cod, descr:r.descr, qty:r.residuo, prezzo:r.prezzo, sconto:r.sconto, iva:r.iva, source_order_index:r.source_order_index }));
    // Lotto/scadenza VERI, dalle fatture fornitore che hanno portato la
    // merce (se l'ordine ha ordini fornitore collegati) — come nel
    // vecchio gestionale, invece di lasciarli sempre vuoti da scrivere a
    // mano. Una riga può diventare più righe se il prodotto è arrivato
    // in più lotti (FIFO) — vedi cascade.js:righeConLotti().
    let righe = residuo;
    try{ righe = await window.SaasCascade.righeConLotti(store, companyId, ordine, residuo); }
    catch(e){ /* niente lotti tracciati, o un problema di rete: le righe restano senza lotto/scadenza, comunque scrivibili a mano */ }
    (righe.length ? righe : [null]).forEach(addRigaRow);
  }
  $('f-cliente').addEventListener('change', () => {
    $('righe-body').querySelectorAll('tr').forEach(tr => { delete tr.dataset.sourceOrderIndex; });
    refreshOrdineOptions($('f-cliente').value);
    refreshDestOptions($('f-cliente').value);
    repriceForClient($('f-cliente').value);
  });
  $('f-ordine').addEventListener('change', async () => {
    $('righe-body').querySelectorAll('tr').forEach(tr => { delete tr.dataset.sourceOrderIndex; });
    // comodità: se non sono ancora state scritte righe, precompila dal
    // residuo dell'ordine selezionato (l'utente può comunque modificarle o svuotarle)
    const righeVuote = readRighe().length === 0;
    const ordine = allOrdiniById[$('f-ordine').value];
    if(!ordine) return;
    // La destinazione dell'ordine si propaga qui, non solo quando il DDT
    // viene aperto dal bottone "📦 DDT" (vedi genFromOc più sotto) — scegliere
    // un ordine già esistente dal menu deve avere lo stesso effetto.
    $('f-dest').value = ordine.destId || '';
    if(righeVuote) await precompileFromOrdine(ordine);
  });

  async function openForm(ddt){
    numberPreview = '';
    editingId = ddt ? ddt.id : null;
    editingDdt = ddt;
    $('form-title').textContent = ddt ? `Modifica ${ddt.num}` : 'Nuovo DDT';
    $('f-cliente').value = ddt ? ddt.clienteId : ($('f-cliente').options[0] ? $('f-cliente').options[0].value : '');
    refreshOrdineOptions($('f-cliente').value);
    refreshDestOptions($('f-cliente').value);
    $('f-ordine').value = ddt ? (ddt.ocId || '') : '';
    $('f-dest').value = ddt ? (ddt.destId || '') : '';
    $('f-data').value = ddt ? ddt.data : today();
    if(ddt){
      $('f-num').value = ddt.num;
    }else{
      // Anteprima del prossimo numero, non un numero già assegnato: resta
      // modificabile — vedi la stessa idea in ordini.html.
      $('f-num').value = '';
      try{ numberPreview = await store.peekNumber(companyId, 'DDT', Number($('f-data').value.slice(0, 4))); $('f-num').value = numberPreview; }
      catch(e){ /* l'anteprima non è essenziale: il campo resta vuoto, comunque modificabile a mano */ }
    }
    $('righe-body').innerHTML = '';
    (ddt ? ddt.righe : [null]).forEach(addRigaRow);
    // Bottone "Genera fattura" — lo stesso passo successivo del bottone
    // per-riga nell'elenco (sotto, visibile solo con la spunta), ma qui
    // sempre a vista quando si apre un DDT esistente: la stessa richiesta
    // già vista per l'ordine cliente ("non ho trovato il pulsante"), qui
    // un passo più avanti nella cascata (DDT -> fattura).
    const ftBox = $('ddt-cascade-actions');
    if(ddt){
      ftBox.hidden = false;
      const ftBtn = $('ddt-btn-ft');
      ftBtn.textContent = ddt.annullato ? 'DDT annullato' : ddt.ftId ? '✓ Fatturato' : '→ Genera fattura';
      ftBtn.disabled = !!ddt.ftId || !!ddt.annullato;
      ftBtn.className = ddt.ftId ? 'ghost' : 'primary';
    }else{
      ftBox.hidden = true;
    }
    renderLineage(ddt);
    $('f-save').disabled = !!(ddt && (ddt.annullato || ddt.ftId));
    $('f-num').readOnly = !!ddt;
    $('f-print-actions').hidden = !ddt;
    setMsg('', '');
    $('form-card').hidden = false;
    $('list-card').hidden = true;
  }
  // Box "Documenti collegati" (vedi app/lineage.js).
  function renderLineage(doc){ return window.SaasDocPage.renderLineagePanel(store, companyId, $('f-lineage-panel'), $('f-lineage'), 'ddt', doc); }
  function closeForm(){ $('form-card').hidden = true; $('list-card').hidden = false; editingId = null; editingDdt = null; }
  $('ddt-btn-ft').addEventListener('click', () => {
    if(!editingDdt) return;
    localStorage.setItem('saas_gen_ft_from_ddt', editingDdt.id);
    location.href = 'fatture.html';
  });
  $('new-ddt').addEventListener('click', async () => {
    if(Object.keys(clientiById).length === 0){ alert('Crea prima almeno un cliente.'); return; }
    const lim = await store.checkDocLimit(companyId);
    if(!lim.ok){ alert(`Hai raggiunto il limite di ${lim.limite} documenti/mese del piano "${lim.piano}". Passa a un piano superiore in Impostazioni → Abbonamento per continuare.`); return; }
    await openForm(null);
  });
  $('f-cancel').addEventListener('click', closeForm);
  $('f-back').addEventListener('click', closeForm);
  window.SaasDocPage.bindPrintActions($, 'ddt', () => editingDdt, d => clientiById[d.clienteId], () => company);

  $('f-save').addEventListener('click', async () => {
    if($('f-save').disabled) return;
    const clienteId = $('f-cliente').value;
    const ocId = $('f-ordine').value || null;
    const destId = $('f-dest').value || null;
    const data = $('f-data').value;
    const righe = readRighe();
    if(!clienteId){ setMsg('Seleziona un cliente.', 'error'); return; }
    if(!data){ setMsg('Inserisci una data.', 'error'); return; }
    if(righe.length === 0){ setMsg('Aggiungi almeno una riga con una descrizione.', 'error'); return; }
    $('f-save').disabled = true;
    setMsg('', '');
    try{
      if(!editingId){
        const lim = await store.checkDocLimit(companyId);
        if(!lim.ok){ setMsg(`Hai raggiunto il limite di ${lim.limite} documenti/mese del piano "${lim.piano}". Passa a un piano superiore in Impostazioni → Abbonamento per continuare.`, 'error'); return; }
      }
      // Si parte dal DDT esistente (se in modifica) invece che da un
      // oggetto vuoto: senza questo, salvare una modifica a un DDT già
      // fatturato ne cancellerebbe silenziosamente ftId (vive in "extra",
      // sempre ricalcolato per intero da store.js a ogni salvataggio) —
      // stesso bug già trovato e corretto in ordini.html/qtyEv.
      const doc = editingDdt ? Object.assign({}, editingDdt, { clienteId, ocId, destId, data, righe }) : { clienteId, ocId, destId, data, righe };
      const isNew = !editingId;
      const numInput = $('f-num').value.trim();
      let saved;
      if(isNew && ocId){
        const ordine = allOrdiniById[ocId];
        if(!ordine) throw new Error('Ordine non disponibile. Ricarica la pagina prima di creare il DDT.');
        doc.num = numInput && numInput !== numberPreview ? numInput : null;
        const result = await store.createCustomerDdt(companyId, ordine, doc);
        saved = result.ddt;
        allOrdiniById[ocId] = result.ordine;
      }else if(editingId){
        doc.num = numInput;
        const result = await store.changeCustomerDdt(companyId, editingDdt, doc, 'update', '');
        saved = result.ddt;
        if(result.ordine) allOrdiniById[result.ordine.id] = result.ordine;
      }else{
        if(numInput){
          // L'utente ha lasciato o modificato l'anteprima proposta (vedi
          // store.peekNumber() in openForm()): usata direttamente, non
          // tramite nextNumber() — stesso compromesso già discusso in
          // ordini.html (un duplicato è raro e comunque intercettato sotto).
          await store.bumpCounterPast(companyId, 'DDT', numInput);
          doc.num = numInput;
        } else {
          const anno = Number(data.slice(0, 4));
          doc.num = await store.nextNumber(companyId, 'DDT', anno);
        }
        saved = await store.saveDoc('ddt', doc, companyId);
      }
      // Un DDT appena creato resta aperto (invece di tornare all'elenco)
      // — richiesta reale: "quando premo genera ddt voglio che mi apra
      // direttamente il ddt e mi dia la possibilità di premere il pulsante
      // genera fattura [...] il pulsante compare soltanto se salvo e
      // riapro il documento". Senza questo, "→ Genera fattura" restava
      // nascosto finché non si tornava all'elenco e si riapriva a mano lo
      // stesso DDT appena salvato (openForm() lo mostra solo per un DDT
      // che esiste già, vedi sopra). Un DDT già esistente (in modifica)
      // torna invece all'elenco come sempre: qui non c'è nulla di nuovo da
      // mostrare.
      await renderList();
      if(isNew) await openForm(saved);
      else closeForm();
    }catch(err){
      const dup = err && err.code === '23505';
      setMsg(dup ? 'Esiste già un DDT con questo numero: scegline un altro.' : (err.message || 'Errore imprevisto durante il salvataggio.'), 'error');
    }finally{
      $('f-save').disabled = false;
    }
  });

  // Scarica l'elenco da Supabase — SOLO quando i dati potrebbero davvero
  // essere cambiati (apertura pagina, dopo salvataggio/eliminazione...): fa
  // sempre passare dalla schermata "Carico…", quindi svuota per un istante
  // la tabella già a video. Chi cambia solo COME viene mostrato l'elenco
  // già scaricato (spunta una riga, ordina, filtra, cerca) deve chiamare
  // renderResults() qui sotto, non questa.
  async function renderList(){
    const rows = await window.SaasDocPage.loadList(store, 'ddt', companyId, $('list-area'));
    if(!rows) return;
    DDT_ALL = rows;
    renderResults();
  }
  // Ridisegna l'elenco dai dati già in DDT_ALL, senza rifare la query di
  // rete — vedi il commento in ordini.html (stessa correzione): prima
  // bastava spuntare una riga per far ripartire l'intera lista da capo
  // (svuotata in "Carico…", riscaricata, ridisegnata).
  function renderResults(){
    renderFilterbar();
    const area = $('list-area');
    if(DDT_ALL.length === 0){
      area.innerHTML = '<p class="empty">Nessun DDT ancora. Crea prima un cliente, poi aggiungi un DDT con "+ Nuovo DDT".</p>';
      return;
    }
    let elenco = DDT_ALL.filter(matchesQuery).filter(matchesFilter);
    if(elenco.length === 0){
      area.innerHTML = '<p class="empty">Nessun DDT trovato con questi criteri.</p>';
      return;
    }
    elenco.sort((a, b) => sortCmp(sortVal(SORT.key, a), sortVal(SORT.key, b), SORT.dir));
    const allChecked = elenco.length > 0 && elenco.every(d => PICK.has(d.id));
    // Limita solo il DISEGNO della tabella, non l'elenco vero (usato sopra
    // e sotto per conteggi, check-all e azioni) — vedi app/list-cap.js.
    const { shown: elencoShown, hidden: elencoHidden } = window.SaasListCap.capForRender(elenco);
    area.innerHTML = window.SaasListCap.capNoticeHtml(elencoHidden) + `<div class="table-scroll"><table class="elenco-table"><thead><tr>
        <th class="check-col"><input type="checkbox" id="check-all" ${allChecked ? 'checked' : ''}></th>
        ${th('num','Numero')}${th('data','Data')}${th('cliente','Cliente')}${th('ordine','Ordine')}<th></th>
      </tr></thead><tbody>${elencoShown.map(d => `
        <tr class="row-click" data-id="${d.id}">
          <td class="check-col"><input type="checkbox" class="row-check" data-id="${d.id}" ${PICK.has(d.id) ? 'checked' : ''}></td>
          <td class="num-col">${esc(d.num)}</td>
          <td>${d.data ? new Date(d.data).toLocaleDateString('it-IT') : '—'}</td>
          <td>${esc((clientiById[d.clienteId] || {}).nome) || '(cliente non trovato)'}${destSub(d)}</td>
          <td>${d.annullato ? '<span class="badge">Annullato</span> ' : ''}${d.ocId ? `<span class="badge">${esc((allOrdiniById[d.ocId] || {}).num || '?')}</span>` : '—'}</td>
          <td class="actions">${PICK.has(d.id) ? `
            ${!d.ftId && !d.annullato ? `<button data-gen-ft="${d.id}" title="Genera la fattura da questo DDT">🧾 Fattura</button>` : ''}
            <button data-edit="${d.id}">${d.annullato || d.ftId ? 'Apri' : 'Modifica'}</button>
            ${!d.annullato && !d.ftId ? `<button class="danger" data-del="${d.id}">Annulla DDT</button>` : ''}` : ''}
          </td>
        </tr>`).join('')}</tbody></table></div>`;
    window.SaasResize.makeColsResizable(area.querySelector('table'), 'ddt-elenco');
    window.SaasDocPage.bindElenco(area, { elenco, pick: PICK, rerender: renderResults, setSort, openForm });
    area.querySelectorAll('[data-gen-ft]').forEach(btn => btn.addEventListener('click', () => {
      localStorage.setItem('saas_gen_ft_from_ddt', btn.dataset.genFt);
      location.href = 'fatture.html';
    }));
    area.querySelectorAll('[data-del]').forEach(btn => btn.addEventListener('click', async () => {
      const d = elenco.find(x => x.id === btn.dataset.del);
      if(btn.disabled) return;
      const motivo = prompt(`Motivo dell'annullamento del DDT ${d.num}. Il documento resterà nello storico e le quantità tracciate saranno rettificate.`);
      if(motivo === null) return;
      if(motivo.trim().length < 3){ alert('Inserisci un motivo di almeno 3 caratteri.'); return; }
      btn.disabled = true;
      try{
        const result = await store.changeCustomerDdt(companyId, d, null, 'cancel', motivo.trim());
        if(result.ordine) allOrdiniById[result.ordine.id] = result.ordine;
        await renderList();
      }catch(err){
        alert('Annullamento non eseguito: ' + err.message);
      }finally{ btn.disabled = false; }
    }));
  }

  async function init(){
    const ctx = await window.SaasDocPage.initPage(store, 'ddt');
    if(!ctx) return;
    companyId = ctx.companyId; company = ctx.company;

    const [clienti, ordini, fattureCliente, ddtTutti] = await Promise.all([
      store.loadCollection('clienti', companyId),
      store.loadCollection('ordiniCliente', companyId),
      store.loadCollection('fattureCliente', companyId),
      store.loadCollection('ddt', companyId),
    ]);
    clientiById = Object.fromEntries(clienti.map(c => [c.id, c]));
    allOrdiniById = Object.fromEntries(ordini.map(o => [o.id, o]));
    ordiniPerCliente = {};
    ordini.forEach(o => { (ordiniPerCliente[o.clienteId] = ordiniPerCliente[o.clienteId] || []).push(o); });
    // Per lastClientPrice() qui sopra — caricate una volta, non ad ogni
    // ricerca prodotto.
    STORICO_PREZZI = { fattureCliente, ddt: ddtTutti, ordiniCliente: ordini };
    // Ordine alfabetico, non quello di caricamento — come il menu "Tutti i
    // clienti" della filterbar qui sopra (clientiArr).
    $('f-cliente').innerHTML = window.SaasDocPage.partyOptionsHtml(clienti);

    await renderList();

    // Cascata: apertura diretta da "📦 DDT" in ordini.html, con l'ordine
    // già selezionato e le righe precompilate dal residuo.
    const genFromOc = localStorage.getItem('saas_gen_ddt_from_oc');
    if(genFromOc){
      localStorage.removeItem('saas_gen_ddt_from_oc');
      const ordine = allOrdiniById[genFromOc];
      if(ordine){
        await openForm(null);
        $('f-cliente').value = ordine.clienteId;
        refreshOrdineOptions(ordine.clienteId);
        refreshDestOptions(ordine.clienteId);
        $('f-ordine').value = ordine.id;
        $('f-dest').value = ordine.destId || '';
        await precompileFromOrdine(ordine);
      }
    }

    // Apertura diretta da un nodo del box "Documenti collegati" cliccato in un altro modulo (app/lineage.js).
    await window.SaasDocPage.openPendingFromLineage(store, companyId, 'ddt', openForm);
  }
  init();
</script>
</body>

<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fatture fornitore — Gestionale</title>
<!--
  Speculare a fatture.html: qui lo stato non è "incassata" ma "pagata" (il
  denaro esce, non entra) — stessa forma di dati (paid/paidDate/pagamenti),
  stessa tabella fatture_fornitore. Il collegamento è solo a un ordine
  fornitore (of_id): non esiste un DDT fornitore in questo schema.
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="app/theme.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="app-main">
  <div class="page-head">
      <p class="eyebrow">Documento</p>
      <h2>Fatture fornitore</h2>
    </div>

  <div class="card" id="form-card" hidden>
    <h3 id="form-title">Nuova fattura</h3>
    <div class="grid2">
      <div><label for="f-fornitore">Fornitore</label><select id="f-fornitore"></select></div>
      <div><label for="f-data">Data</label><input id="f-data" type="date"></div>
    </div>
    <label for="f-ordine">Ordine collegato (facoltativo)</label>
    <select id="f-ordine"><option value="">— nessuno —</option></select>

    <label>Righe</label>
    <div class="table-scroll"><table class="righe-table">
      <thead><tr><th>Codice</th><th>Descrizione</th><th>Qtà</th><th>Prezzo</th><th>IVA %</th><th></th></tr></thead>
      <tbody id="righe-body"></tbody>
    </table></div>
    <button class="linklike" id="add-riga" style="margin-top:8px">+ aggiungi riga</button>
    <p class="righe-total">Totale: <b id="righe-totale">0,00 €</b></p>

    <div class="form-actions">
      <button class="primary" id="f-save">Salva</button>
      <button class="ghost" id="f-cancel">Annulla</button>
    </div>
    <div class="msg" id="form-msg" hidden></div>
  </div>

  <div class="card">
    <div class="toolbar">
      <h3>Elenco</h3>
      <button class="primary" id="new-fattura">+ Nuova fattura</button>
    </div>
    <div id="list-area"><p class="empty">Carico…</p></div>
  </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
  window.SUPABASE_URL = 'https://rixvgmzedwdzgavjewbm.supabase.co';
  window.SUPABASE_ANON_KEY = 'sb_publishable_DFLcrBd6aiyyNGnCq41RQg_XrP0VR47';
</script>
<script src="app/store.js"></script>
<script src="app/nav.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const store = window.SaasStore;
  let companyId = null;
  let editingId = null;
  let fornitoriById = {};
  let ordiniPerFornitore = {};

  function today(){ return new Date().toISOString().slice(0, 10); }
  function esc(s){ return (s == null ? '' : String(s)).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function eur(n){ return (Number(n) || 0).toLocaleString('it-IT', { style:'currency', currency:'EUR' }); }
  function setMsg(text, kind){
    const el = $('form-msg');
    if(!text){ el.hidden = true; return; }
    el.textContent = text; el.className = 'msg ' + kind; el.hidden = false;
  }

  function rigaRowHtml(r){
    r = r || { cod:'', descr:'', qty:1, prezzo:0, iva:22 };
    return `<tr>
      <td><input class="r-cod" value="${esc(r.cod)}" placeholder="cod."></td>
      <td><input class="r-descr" value="${esc(r.descr)}" placeholder="descrizione"></td>
      <td style="width:70px"><input class="r-qty" type="number" min="0" step="1" value="${r.qty}"></td>
      <td style="width:90px"><input class="r-prezzo" type="number" min="0" step="0.01" value="${r.prezzo}"></td>
      <td style="width:70px"><input class="r-iva" type="number" min="0" step="1" value="${r.iva}"></td>
      <td class="rm"><button type="button" class="rm-riga" title="rimuovi riga">✕</button></td>
    </tr>`;
  }
  function addRigaRow(r){
    $('righe-body').insertAdjacentHTML('beforeend', rigaRowHtml(r));
    bindRigaRow($('righe-body').lastElementChild);
    updateTotale();
  }
  function bindRigaRow(tr){
    tr.querySelector('.rm-riga').addEventListener('click', () => { tr.remove(); updateTotale(); });
    tr.querySelectorAll('input').forEach(inp => inp.addEventListener('input', updateTotale));
  }
  function readRighe(){
    return [...$('righe-body').querySelectorAll('tr')].map(tr => ({
      cod: tr.querySelector('.r-cod').value.trim(),
      descr: tr.querySelector('.r-descr').value.trim(),
      qty: Number(tr.querySelector('.r-qty').value) || 0,
      prezzo: Number(tr.querySelector('.r-prezzo').value) || 0,
      iva: Number(tr.querySelector('.r-iva').value) || 0,
    })).filter(r => r.descr || r.cod);
  }
  function rigaTotale(r){ const imp = r.qty * r.prezzo; return imp + imp * r.iva / 100; }
  function docTotale(righe){ return (righe || []).reduce((s, r) => s + rigaTotale(r), 0); }
  function updateTotale(){ $('righe-totale').textContent = eur(docTotale(readRighe())); }
  $('add-riga').addEventListener('click', () => addRigaRow(null));

  function refreshOrdineOptions(fornitoreId){
    const ordini = ordiniPerFornitore[fornitoreId] || [];
    $('f-ordine').innerHTML = '<option value="">— nessuno —</option>' +
      ordini.map(o => `<option value="${o.id}">${esc(o.num)}</option>`).join('');
  }
  $('f-fornitore').addEventListener('change', () => refreshOrdineOptions($('f-fornitore').value));
  $('f-ordine').addEventListener('change', () => {
    const righeVuote = readRighe().length === 0;
    const ordine = (ordiniPerFornitore[$('f-fornitore').value] || []).find(o => o.id === $('f-ordine').value);
    if(ordine && righeVuote){
      $('righe-body').innerHTML = '';
      (ordine.righe || []).forEach(r => addRigaRow({ cod:r.cod, descr:r.descr, qty:r.qty, prezzo:r.prezzo || 0, iva:r.iva || 22 }));
    }
  });

  function openForm(fattura){
    editingId = fattura ? fattura.id : null;
    $('form-title').textContent = fattura ? `Modifica ${fattura.num}` : 'Nuova fattura';
    $('f-fornitore').value = fattura ? fattura.fornitoreId : ($('f-fornitore').options[0] ? $('f-fornitore').options[0].value : '');
    refreshOrdineOptions($('f-fornitore').value);
    $('f-ordine').value = fattura ? (fattura.ofId || '') : '';
    $('f-data').value = fattura ? fattura.data : today();
    $('righe-body').innerHTML = '';
    (fattura ? fattura.righe : [null]).forEach(addRigaRow);
    setMsg('', '');
    $('form-card').hidden = false;
  }
  function closeForm(){ $('form-card').hidden = true; editingId = null; }
  $('new-fattura').addEventListener('click', () => {
    if($('f-fornitore').options.length === 0){ alert('Crea prima almeno un fornitore.'); return; }
    openForm(null);
  });
  $('f-cancel').addEventListener('click', closeForm);

  $('f-save').addEventListener('click', async () => {
    const fornitoreId = $('f-fornitore').value;
    const ofId = $('f-ordine').value || null;
    const data = $('f-data').value;
    const righe = readRighe();
    if(!fornitoreId){ setMsg('Seleziona un fornitore.', 'error'); return; }
    if(!data){ setMsg('Inserisci una data.', 'error'); return; }
    if(righe.length === 0){ setMsg('Aggiungi almeno una riga con una descrizione.', 'error'); return; }

    $('f-save').disabled = true;
    setMsg('', '');
    try{
      const doc = { fornitoreId, ofId, data, righe };
      if(editingId){
        doc.id = editingId; // numero e stato di pagamento restano quelli esistenti
      } else {
        const anno = Number(data.slice(0, 4));
        doc.num = await store.nextNumber(companyId, 'FTF', anno);
        doc.paid = false; doc.paidDate = null; doc.pagamenti = [];
      }
      await store.saveDoc('fattureFornitore', doc, companyId);
      closeForm();
      await renderList();
    }catch(err){
      setMsg(err.message || 'Errore imprevisto durante il salvataggio.', 'error');
    }finally{
      $('f-save').disabled = false;
    }
  });

  // Stesso schema di fatture.html, ma qui "pagata" invece di "incassata":
  // il denaro esce dall'azienda, non entra.
  async function togglePaid(fattura){
    const paid = !fattura.paid;
    const doc = {
      id: fattura.id,
      paid,
      paidDate: paid ? today() : null,
      pagamenti: paid ? [{ data: today(), importo: docTotale(fattura.righe) }] : [],
    };
    await store.saveDoc('fattureFornitore', doc, companyId);
    await renderList();
  }

  async function renderList(){
    const area = $('list-area');
    area.innerHTML = '<p class="empty">Carico…</p>';
    let elenco;
    try{
      elenco = await store.loadCollection('fattureFornitore', companyId);
    }catch(err){
      area.innerHTML = `<p class="empty">Errore nel caricamento: ${esc(err.message)}</p>`;
      return;
    }
    if(elenco.length === 0){
      area.innerHTML = '<p class="empty">Nessuna fattura ancora. Crea prima un fornitore, poi aggiungi una fattura con "+ Nuova fattura".</p>';
      return;
    }
    elenco.sort((a, b) => (b.num || '').localeCompare(a.num || '', 'it', { numeric:true }));
    area.innerHTML = `<div class="table-scroll"><table><thead><tr>
        <th>Numero</th><th>Data</th><th>Fornitore</th><th>Totale</th><th>Pagamento</th><th></th>
      </tr></thead><tbody>${elenco.map(f => `
        <tr>
          <td class="num-col">${esc(f.num)}</td>
          <td>${f.data ? new Date(f.data).toLocaleDateString('it-IT') : '—'}</td>
          <td>${esc((fornitoriById[f.fornitoreId] || {}).nome) || '(fornitore non trovato)'}</td>
          <td class="num-col">${eur(docTotale(f.righe))}</td>
          <td><button class="pill ${f.paid ? 'paid' : 'unpaid'}" data-toggle="${f.id}">${f.paid ? ('pagata' + (f.paidDate ? ' · ' + new Date(f.paidDate).toLocaleDateString('it-IT') : '')) : 'da pagare'}</button></td>
          <td class="actions">
            <button data-edit="${f.id}">Modifica</button>
            <button class="danger" data-del="${f.id}">Elimina</button>
          </td>
        </tr>`).join('')}</tbody></table></div>`;
    area.querySelectorAll('[data-edit]').forEach(btn => btn.addEventListener('click', () => {
      openForm(elenco.find(x => x.id === btn.dataset.edit));
    }));
    area.querySelectorAll('[data-toggle]').forEach(btn => btn.addEventListener('click', () => {
      togglePaid(elenco.find(x => x.id === btn.dataset.toggle));
    }));
    area.querySelectorAll('[data-del]').forEach(btn => btn.addEventListener('click', async () => {
      const f = elenco.find(x => x.id === btn.dataset.del);
      if(!confirm(`Eliminare la fattura ${f.num}? L'operazione non si può annullare.`)) return;
      try{
        await store.removeDoc('fattureFornitore', f.id);
        await renderList();
      }catch(err){
        alert('Errore durante l\'eliminazione: ' + err.message);
      }
    }));
  }

  async function doLogout(){
    await store.signOut();
    localStorage.removeItem('saas_company_id');
    localStorage.removeItem('saas_company_nome');
    location.href = 'index.html';
  }

  async function init(){
    const session = await store.getSession();
    if(!session){ location.href = 'index.html'; return; }
    companyId = localStorage.getItem('saas_company_id');
    if(!companyId){ location.href = 'index.html'; return; }
    window.SaasNav.render('fatture-fornitore', {
      companyName: localStorage.getItem('saas_company_nome') || 'Azienda',
      email: session.user.email,
      onLogout: doLogout,
    });

    const [fornitori, ordini] = await Promise.all([
      store.loadCollection('fornitori', companyId),
      store.loadCollection('ordiniFornitore', companyId),
    ]);
    fornitoriById = Object.fromEntries(fornitori.map(f => [f.id, f]));
    ordiniPerFornitore = {};
    ordini.forEach(o => { (ordiniPerFornitore[o.fornitoreId] = ordiniPerFornitore[o.fornitoreId] || []).push(o); });
    $('f-fornitore').innerHTML = fornitori.map(f => `<option value="${f.id}">${esc(f.nome)}</option>`).join('');

    await renderList();
  }
  init();
</script>
</body>
</html>

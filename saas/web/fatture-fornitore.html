<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fatture fornitore — Gestionale</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0ea371">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<!--
  Speculare a fatture.html: qui lo stato non è "incassata" ma "pagata" (il
  denaro esce, non entra) — stessa forma di dati (paid/paidDate/pagamenti),
  stessa tabella fatture_fornitore. Il collegamento è solo a un ordine
  fornitore (of_id): non esiste un DDT fornitore in questo schema.
-->
<script>(function(){try{if(localStorage.getItem('saas_theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<link rel="stylesheet" href="app/theme.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="app-main">
  <div class="page-head">
      <h2>Fatture fornitore</h2>
      <p class="sub">Fatture fornitore, con stato di pagamento.</p>
    </div>

  <div class="card" id="form-card" hidden>
    <button type="button" class="linklike back-link" id="f-back">← Torna all'elenco</button>
    <h3 id="form-title">Nuova fattura</h3>
    <!-- Stampa/PDF qui, non solo nell'elenco (dove servivano prima spuntare
         la riga) — vedi lo stesso commento in ordini.html. Nascosto per una
         fattura nuova non ancora salvata. -->
    <div class="form-actions" id="f-print-actions" hidden style="margin:0 0 14px;justify-content:flex-end">
      <button type="button" class="ghost" id="f-btn-print">🖨 Stampa</button>
      <div class="dl-menu">
        <button type="button" class="ghost" id="f-btn-download">⬇ Scarica</button>
        <div class="dl-list" id="f-download-list" hidden>
          <button type="button" id="f-dl-pdf">📄 PDF</button>
          <button type="button" id="f-dl-excel">📊 Excel</button>
        </div>
      </div>
    </div>
    <div class="grid2">
      <div><label for="f-fornitore">Fornitore</label><select id="f-fornitore"></select></div>
      <div><label for="f-data">Data</label><input id="f-data" type="date"></div>
    </div>
    <!-- A differenza di una fattura cliente (numerata da noi), una fattura
         fornitore porta il numero che il FORNITORE le ha dato: qui si
         digita, non si genera — coerente con come funziona una fattura
         d'acquisto nella realtà (e con come il gestionale attuale la
         registra: vedi i numeri reali importati, es. "5718067132"). -->
    <label for="f-num">Numero fattura del fornitore</label>
    <input id="f-num" type="text" placeholder="es. 5718067132">
    <!-- DDT fornitore collegato (0016_ddt_fornitore.sql): un fornitore che
         manda anche il DDT cartaceo col pacco può collegare la fattura a
         QUELLO invece che direttamente all'ordine — le quantità ricevute
         sono già state segnate quando il DDT è stato registrato (vedi
         ddt-fornitore.html), qui la fattura eredita anche l'ordine (per la
         filiera "Documenti collegati") senza doverlo scegliere a mano.
         "Ordine collegato" resta comunque scegliibile da solo, per chi non
         manda DDT — comportamento di sempre, invariato. Stesso schema di
         fatture.html ("Ordine collegato"/"DDT collegato" affiancati). -->
    <div class="grid2">
      <div><label for="f-ordine">Ordine collegato</label>
        <select id="f-ordine"><option value="">— nessuno —</option></select>
      </div>
      <div><label for="f-ddtf">DDT fornitore collegato</label>
        <select id="f-ddtf"><option value="">— nessuno —</option></select>
      </div>
    </div>

    <label>Righe</label>
    <div class="table-scroll"><table class="righe-table">
      <thead><tr><th class="drag-col"></th><th>Codice</th><th>Descrizione</th><th>Lotto</th><th>Scadenza</th><th>Qtà</th><th>Prezzo</th><th>Sconto %</th><th>IVA %</th><th></th></tr></thead>
      <tbody id="righe-body"></tbody>
    </table></div>
    <button class="linklike" id="add-riga" style="margin-top:8px">+ aggiungi riga</button>
    <p class="righe-total">Totale: <b id="righe-totale">0,00 €</b></p>

    <div class="panel" id="f-lineage-panel" hidden style="margin:16px 0"><div class="panel-h">Documenti collegati</div><div id="f-lineage"></div></div>

    <div class="form-actions">
      <button class="primary" id="f-save">Salva</button>
      <button class="ghost" id="f-cancel">Annulla</button>
    </div>
    <div class="msg" id="form-msg" hidden></div>
  </div>

  <div class="stats" id="stats-riga" style="grid-template-columns:1fr"></div>

  <div class="card" id="list-card">
    <div class="toolbar">
      <h3>Elenco</h3>
      <div class="toolbar-right">
        <div class="search-box"><span class="si">⌕</span><input type="text" id="q" placeholder="Cerca per numero o fornitore…"></div>
        <button class="ghost" id="ai-import-btn">Importa</button>
        <input type="file" id="ai-import-file" accept="application/pdf,image/*,.xml,text/xml,application/xml" hidden>
        <button class="primary" id="new-fattura">+ Nuova fattura</button>
      </div>
    </div>
    <p class="msg" id="ai-import-status" hidden></p>
    <div id="filter-area"></div>
    <div id="list-area"><p class="empty">Carico…</p></div>
  </div>
  </main>
</div>

<script>
  const $ = id => document.getElementById(id);
  const store = window.SaasStore;
  let companyId = null;
  let company = {}; // dati azienda (companies), per l'intestazione di stampa/PDF
  let editingId = null;
  let pendingInvoice = null;
  function invoiceRequestId(key){
    if(!pendingInvoice || pendingInvoice.key !== key) pendingInvoice = {key, id:crypto.randomUUID()};
    return pendingInvoice.id;
  }
  let editingFattura = null; // la fattura in modifica — solo per Stampa/Scarica dal form, vedi f-btn-print/f-btn-download
  let fornitoriById = {};
  let fornitoriArr = [];
  let ordiniPerFornitore = {};
  let allDdtfById = {};
  let ddtfPerFornitore = {}; // per il menu "DDT fornitore collegato" — vedi refreshLinkedOptions()
  let noteCreditoFornitoreArr = []; // per sottrarle dal "Totale acquisti", vedi renderStats()
  // Ordinamento iniziale per data (discendente) — richiesta reale: "le
  // fatture fornitore le voglio ordinate in ordine di date". Era stato
  // messo "numero" (vedi fatture.html, pagina gemella, rimasta a
  // "numero") su una richiesta precedente, ma per questa pagina si torna
  // a "data", come il vecchio gestionale. Resta un clic sull'intestazione
  // "Numero" per ordinare per numero quando serve.
  let SORT = { key: 'data', dir: 'desc' };
  let Q = ''; // ricerca testuale sull'elenco, come Q nel gestionale originale
  // Filtri sopra l'elenco: stessa idea di FFILT nel gestionale originale
  // (filterbar sui moduli documento) — qui applicata a fatture fornitore,
  // dove filtrare per fornitore/stato/intervallo di date è particolarmente
  // utile (è il modulo con più righe, e con più fornitori diversi).
  // Apertura sull'anno corrente; i link con anno esplicito conservano lo storico.
  const requestedDocumentYear = new URLSearchParams(location.search).get('anno');
  const initialDocumentYear = /^[1-9]\d{3}$/.test(requestedDocumentYear || '')
    ? requestedDocumentYear : String(new Date().getFullYear());
  let FFILT = { forn: '', paid: '', from: `${initialDocumentYear}-01-01`, to: `${initialDocumentYear}-12-31` };
  let PICK = new Set(); // id selezionati per le azioni collettive (bulkbar), come PICK nell'originale
  // Ultimo elenco scaricato da renderList() — usato da renderResults() per
  // ridisegnare senza rifare la query di rete quando cambia solo COME viene
  // mostrato (spunta, ordinamento, filtri, ricerca), non cosa contiene.
  let FATTURE_ALL = [];

  // Funzioni comuni a tutte le pagine documento — vedi app/doc-page.js.
  const { today, esc, eur, sortCmp, docTotale, impTot, ivaTot, findOrdineByRiferimento } = window.SaasDocPage;
  function sortVal(key, f){
    if(key === 'num') return f.num || '';
    if(key === 'data') return f.data || '';
    if(key === 'fornitore') return (fornitoriById[f.fornitoreId] || {}).nome || '';
    if(key === 'imponibile') return impTot(f.righe || []);
    if(key === 'iva') return ivaTot(f.righe || []);
    if(key === 'totale') return docTotale(f.righe || []);
    if(key === 'pagamento') return f.paid ? 1 : 0;
    return '';
  }
  function th(key, label){ return window.SaasDocPage.thHtml(SORT, key, label); }
  function setSort(key){ window.SaasDocPage.toggleSort(SORT, key); renderResults(); }

  // Ricerca testuale: numero + nome fornitore.
  function matchesQuery(it){ return window.SaasDocPage.matchesText(Q, it, (fornitoriById[it.fornitoreId] || {}).nome); }
  window.SaasDocPage.bindSearch($('q'), q => { Q = q; renderResults(); });

  // ---- filtri: fornitore, stato pagamento, intervallo date --------------
  function matchesFilter(f){
    if(FFILT.forn && f.fornitoreId !== FFILT.forn) return false;
    if(FFILT.paid === 'paid' && !f.paid) return false;
    if(FFILT.paid === 'unpaid' && f.paid) return false;
    if(FFILT.from && (f.data || '') < FFILT.from) return false;
    if(FFILT.to && (f.data || '') > FFILT.to) return false;
    return true;
  }
  function setFFilt(k, v){ FFILT[k] = v; renderResults(); }
  function clearFFilt(){ FFILT = { forn:'', paid:'', from:'', to:'' }; renderResults(); }

  // Una nota di credito fornitore riduce quanto acquistato dal fornitore
  // (uno storno, non un nuovo acquisto): va sottratta dal "Totale
  // acquisti", non ignorata — come nel gestionale originale ("acqTot =
  // ff.reduce(...) - ncfTot", vedi il commento più sotto). Stessi filtri
  // fornitore/ricerca/intervallo date della fattura, ma NON lo stato di
  // pagamento (una nota di credito non ha uno stato "pagata/da pagare":
  // esclusa quando quel filtro è attivo, come faceva il gestionale
  // originale togliendo le righe nota di credito dall'elenco filtrato per
  // stato).
  function matchesQueryNC(n){
    if(!Q) return true;
    const party = (fornitoriById[n.fornitoreId] || {}).nome || '';
    return (n.num || '').toLowerCase().includes(Q) || party.toLowerCase().includes(Q);
  }
  function matchesFilterNC(n){
    if(FFILT.forn && n.fornitoreId !== FFILT.forn) return false;
    if(FFILT.paid) return false;
    if(FFILT.from && (n.data || '') < FFILT.from) return false;
    if(FFILT.to && (n.data || '') > FFILT.to) return false;
    return true;
  }
  // "Totale acquisti", ricalcolato sull'elenco GIÀ filtrato (ricerca +
  // fornitore/stato/intervallo date) — richiesta esplicita: selezionando
  // un fornitore mostra il totale di quel fornitore, selezionando un
  // arco di date il totale di quell'arco, combinabili tra loro come ogni
  // altro filtro di questa pagina (non un pannello separato da capire a
  // parte: è sempre "il totale di quello che vedi sotto").
  //
  // Bug reale segnalato: qui sommava solo le fatture, senza sottrarre le
  // note di credito fornitore collegate — mentre nel gestionale originale
  // il "Totale acquisti" le sottrae sempre ("acqTot = ff.reduce((s,f)=>
  // s+tot(f.righe),0)-ncfTot"). Corretto riportando la stessa logica.
  function renderStats(elencoFiltrato){
    const totFatture = elencoFiltrato.reduce((s, f) => s + docTotale(f.righe), 0);
    const ncFiltrate = noteCreditoFornitoreArr.filter(nc => !nc.annullato).filter(matchesQueryNC).filter(matchesFilterNC);
    const totNC = ncFiltrate.reduce((s, n) => s + docTotale(n.righe), 0);
    const forn = FFILT.forn ? (fornitoriById[FFILT.forn] || {}).nome : '';
    const periodo = FFILT.from || FFILT.to
      ? ` dal ${FFILT.from ? new Date(FFILT.from).toLocaleDateString('it-IT') : '…'} al ${FFILT.to ? new Date(FFILT.to).toLocaleDateString('it-IT') : '…'}`
      : '';
    const sub = elencoFiltrato.length + ' fattur' + (elencoFiltrato.length === 1 ? 'a' : 'e')
      + (ncFiltrate.length ? ' − ' + ncFiltrate.length + ' nota' + (ncFiltrate.length === 1 ? '' : 'e') + ' di credito' : '')
      + (forn ? ' di ' + forn : '') + periodo + ' · IVA incl.';
    $('stats-riga').innerHTML = `<div class="stat"><div class="sl">Totale acquisti</div><div class="sv" style="color:var(--violet)">${eur(totFatture - totNC)}</div><div class="sx">${esc(sub)}</div></div>`;
  }
  function renderFilterbar(){
    const active = FFILT.forn || FFILT.paid || FFILT.from || FFILT.to;
    const fopts = '<option value="">Tutti i fornitori</option>' +
      fornitoriArr.map(f => `<option value="${f.id}" ${FFILT.forn === f.id ? 'selected' : ''}>${esc(f.nome)}</option>`).join('');
    $('filter-area').innerHTML = `<div class="filterbar">
      <select id="ff-forn">${fopts}</select>
      <select id="ff-paid">
        <option value="">Tutti gli stati</option>
        <option value="paid" ${FFILT.paid === 'paid' ? 'selected' : ''}>Pagate</option>
        <option value="unpaid" ${FFILT.paid === 'unpaid' ? 'selected' : ''}>Da pagare</option>
      </select>
      <div class="fdate-group">
        <label class="fdate">Dal <input type="date" id="ff-from" value="${FFILT.from}"></label>
        <label class="fdate">Al <input type="date" id="ff-to" value="${FFILT.to}"></label>
      </div>
      ${active ? '<button type="button" class="ffclear" id="ff-clear">✕ Azzera filtri</button>' : ''}
    </div>`;
    $('ff-forn').addEventListener('change', () => setFFilt('forn', $('ff-forn').value));
    $('ff-paid').addEventListener('change', () => setFFilt('paid', $('ff-paid').value));
    $('ff-from').addEventListener('change', () => setFFilt('from', $('ff-from').value));
    $('ff-to').addEventListener('change', () => setFFilt('to', $('ff-to').value));
    if(active) $('ff-clear').addEventListener('click', clearFFilt);
  }

  function setMsg(text, kind){ window.SaasDocPage.showMsg($('form-msg'), text, kind); }

  function rigaRowHtml(r){
    r = r || { cod:'', descr:'', qty:1, prezzo:0, sconto:'', iva:22, lotto:'', scad:'' };
    return `<tr>
      <td class="drag-col"><span class="drag-handle" draggable="true" title="Trascina per riordinare la riga">⠿</span></td>
      <td><div class="prod-pick"><input class="r-cod" value="${esc(r.cod)}" placeholder="cod." autocomplete="off"><div class="prod-sugg"></div></div>${r.catalogMatch ? window.SaasAiImport.catalogBadgeHtml(r.catalogMatch) : ''}</td>
      <td><input class="r-descr" value="${esc(r.descr)}" placeholder="descrizione"></td>
      <td style="min-width:90px"><input class="r-lotto" type="text" value="${esc(r.lotto || '')}" placeholder="lotto"></td>
      <td style="min-width:130px"><input class="r-scad" type="date" value="${esc(r.scad || '')}"></td>
      <td style="min-width:70px"><input class="r-qty" type="number" min="0" step="1" value="${r.qty}"></td>
      <td style="min-width:90px"><input class="r-prezzo" type="number" min="0" step="0.01" value="${r.prezzo}"></td>
      <td style="min-width:70px"><input class="r-sconto" type="text" inputmode="decimal" value="${esc(r.sconto || '')}" placeholder="0"></td>
      <td style="min-width:70px"><input class="r-iva" type="number" min="0" step="1" value="${r.iva}"></td>
      <td class="rm"><button type="button" class="rm-riga" title="rimuovi riga">✕</button></td>
    </tr>`;
  }
  function addRigaRow(r){
    $('righe-body').insertAdjacentHTML('beforeend', rigaRowHtml(r));
    if(r && Number.isInteger(r.source_ddt_index)) $('righe-body').lastElementChild.dataset.sourceDdtIndex = r.source_ddt_index;
    bindRigaRow($('righe-body').lastElementChild);
    updateTotale();
    refreshCmpOrdine();
  }
  // Riordino righe per trascinamento: SaasDocPage.bindRowDrag() qui sotto.
  function bindRigaRow(tr){
    tr.querySelector('.rm-riga').addEventListener('click', () => { tr.remove(); updateTotale(); });
    tr.querySelectorAll('input').forEach(inp => inp.addEventListener('input', () => { updateTotale(); refreshCmpOrdine(); }));
    window.SaasDocPage.bindRowDrag(tr);
    // Stesso autocompletamento della barra di ricerca sopra la tabella, ma
    // dentro il campo "Codice" della riga stessa: scegliendo un prodotto
    // riempie questa riga invece di aggiungerne una nuova.
    window.SaasProdPicker.attach(tr.querySelector('.r-cod'), tr.querySelector('.prod-sugg'), {
      companyId, priceField: 'listinoAcq', clearOnPick: false,
      onPick: p => {
        tr.querySelector('.r-cod').value = p.cod;
        tr.querySelector('.r-descr').value = p.descr;
        tr.querySelector('.r-prezzo').value = p.listinoAcq || 0;
        tr.querySelector('.r-iva').value = p.iva ?? 22;
        const qtyEl = tr.querySelector('.r-qty');
        if (!Number(qtyEl.value)) qtyEl.value = 1;
        updateTotale();
        refreshCmpOrdine();
        qtyEl.focus(); qtyEl.select();
      },
    });
  }
  function readRighe(){
    return [...$('righe-body').querySelectorAll('tr')].map(tr => ({
      ...(tr.dataset.sourceDdtIndex !== undefined ? {source_ddt_index:Number(tr.dataset.sourceDdtIndex)} : {}),
      cod: tr.querySelector('.r-cod').value.trim(),
      descr: tr.querySelector('.r-descr').value.trim(),
      lotto: tr.querySelector('.r-lotto').value.trim(),
      scad: tr.querySelector('.r-scad').value,
      qty: Number(tr.querySelector('.r-qty').value) || 0,
      prezzo: Number(tr.querySelector('.r-prezzo').value) || 0,
      sconto: tr.querySelector('.r-sconto').value.trim(),
      iva: Number(tr.querySelector('.r-iva').value) || 0,
    })).filter(r => r.descr || r.cod);
  }
  // Stessa aritmetica dello sconto per tutte le pagine documento: vedi app/doc-page.js.
  function updateTotale(){ $('righe-totale').textContent = eur(docTotale(readRighe())); }

  // Confronto col prezzo dell'ordine fornitore collegato — porta di una
  // funzione reale del gestionale originale (in detailView() e nel
  // riepilogo di importazione XML/PDF, index.html): un fornitore può
  // fatturare a un prezzo diverso da quello pattuito sull'ordine, e senza
  // un confronto esplicito l'unico modo di accorgersene era rileggere
  // l'ordine a mano riga per riga. Richiesta reale: "quando carico una
  // fattura fornitori nel vecchio gestionale mi avvisava se il prezzo era
  // uguale a quello che era presente nell'ordine. voglio che quella
  // funzione sia riportata anche nel nuovo gestionale".
  //
  // Solo qui, non in fatture.html/ddt.html lato cliente: il prezzo di un
  // documento verso un cliente lo decide l'azienda stessa, non c'è
  // nessuna controparte esterna da verificare — stessa scelta già fatta
  // nell'originale (il confronto esisteva solo per fattureFornitore).
  // Stessa tolleranza (0.005) e stesse classi CSS (cat-badge/cat-ok/
  // cat-warn) già usate per il badge "✓ a catalogo" qui sopra, per
  // restare coerenti visivamente invece di introdurne di nuove.
  function cmpOrdineBadgeHtml(prezzoFatt, ordineRiga){
    const stessoPrezzo = Math.abs((ordineRiga.prezzo || 0) - (prezzoFatt || 0)) < 0.005;
    return stessoPrezzo
      ? `<span class="cat-badge cat-ok" title="Stesso prezzo dell'ordine collegato">= ordine</span>`
      : `<span class="cat-badge cat-warn" title="Nell'ordine collegato il prezzo era ${eur(ordineRiga.prezzo)}">⚠ ordine ${eur(ordineRiga.prezzo)}</span>`;
  }
  // Ricalcola il confronto per OGNI riga a video, cercando per codice
  // dentro le righe dell'ordine collegato (se ce n'è uno) — chiamata dopo
  // ogni cambiamento che può renderlo non più valido: ordine selezionato/
  // cambiato, fornitore cambiato (l'elenco ordini è per fornitore),
  // qualunque modifica a una riga (codice o prezzo, ma richiamarla su
  // ogni campo è più semplice che filtrare quali contano davvero — la
  // tabella ha poche righe, il ricalcolo è a costo zero), e ogni riga
  // aggiunta (manualmente o in blocco da un ordine/import).
  function refreshCmpOrdine(){
    const ordine = (ordiniPerFornitore[$('f-fornitore').value] || []).find(o => o.id === $('f-ordine').value);
    $('righe-body').querySelectorAll('tr').forEach(tr => {
      const cell = tr.querySelector('.r-prezzo').closest('td');
      const old = cell.querySelector('.cat-badge, .cmp-none');
      if(old) old.remove();
      if(!ordine) return;
      const cod = tr.querySelector('.r-cod').value.trim();
      if(!cod) return;
      const ordineRiga = (ordine.righe || []).find(r => r.cod === cod);
      if(!ordineRiga){
        cell.insertAdjacentHTML('beforeend', '<span class="cmp-none" style="display:inline-block;margin-top:4px;font-size:10.5px;color:var(--faint)">non in ordine</span>');
        return;
      }
      cell.insertAdjacentHTML('beforeend', cmpOrdineBadgeHtml(Number(tr.querySelector('.r-prezzo').value) || 0, ordineRiga));
    });
  }
  // Scroll sulla nuova riga al click manuale — vedi lo stesso commento in
  // ordini.html.
  $('add-riga').addEventListener('click', () => {
    addRigaRow(null);
    $('righe-body').lastElementChild.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  });

  function refreshLinkedOptions(fornitoreId){

  // Scegliere un DDT fornitore imposta anche "Ordine collegato" da solo
  // (a differenza di fatture.html/f-ddt, che non lo fa): qui serve per
  // forza, altrimenti applicaFatturazioneFornitore() più sotto (che

  // il box "Documenti collegati" (app/lineage.js) non risalirebbe la
  // filiera fino all'ordine cliente radice.
  $('f-ddtf').addEventListener('change', () => {
    $('righe-body').querySelectorAll('tr').forEach(tr => delete tr.dataset.sourceDdtIndex);
    const righeVuote = readRighe().length === 0;
    const ddtf = allDdtfById[$('f-ddtf').value];
    if(!ddtf) return;
    $('f-ordine').value = ddtf.ofId || '';
    if(righeVuote){
      $('righe-body').innerHTML = '';
      // Il DDT fornitore non porta prezzo/sconto/iva (un DDT cartaceo non
      // li riporta mai — vedi ddt-fornitore.html): si riprendono qui, per
      // codice, dall'ordine collegato — stesso identico dato che
      // mostrerebbe scegliendo direttamente quell'ordine in "Ordine
      // collegato" qui sopra. Un codice del DDT assente nell'ordine
      // (merce non ordinata, o ordine non collegato) resta a 0, da
      // inserire a mano.
      const ordine = (ordiniPerFornitore[$('f-fornitore').value] || []).find(o => o.id === ddtf.ofId);
      (ddtf.righe || []).forEach((r,sourceIndex) => {
        const candidates = ordine ? (ordine.righe || []).filter(x => x.cod === r.cod) : [];
        const indexed = ordine && Number.isInteger(r.source_order_index) ? ordine.righe[r.source_order_index] : null;
        const ordineRiga = indexed && indexed.cod === r.cod ? indexed : candidates.length === 1 ? candidates[0] : null;
        addRigaRow({
          source_ddt_index:sourceIndex,
          cod:r.cod, descr:r.descr, qty:r.qty,
          prezzo: ordineRiga ? (ordineRiga.prezzo || 0) : 0,
          sconto: ordineRiga ? (ordineRiga.sconto || '') : '',
          iva: ordineRiga ? (ordineRiga.iva ?? 22) : 22,
          lotto: r.lotto || '', scad: r.scad || '',
        });
      });
    }
    refreshCmpOrdine();
  });

  // ---- importa fattura da PDF/foto con l'AI ------------------------------
  // Porta di pdfExtractSupplierInvoice()/openXmlImport() nel gestionale
  // originale, semplificata: qui i dati letti dall'AI precompilano
  // direttamente il form "Nuova fattura" già esistente (stessa validazione,
  // stesso controllo di numero duplicato al salvataggio) invece di un
  // percorso di importazione a sé con anteprima/confronto ordine dedicati —
  // quelli restano un possibile giro successivo. Niente ancora lettura
  // diretta di XML/P7M della fattura elettronica (percorso deterministico,
  // separato da questo): qui si legge sempre tramite AI, PDF o foto che sia.
  function aiImportStatus(text, kind){ window.SaasDocPage.showMsg($('ai-import-status'), text, kind || 'info'); }
  // riferimentoOrdine: il NOSTRO numero d'ordine così come lo riporta il
  // fornitore in fattura (tipicamente etichettato "Vs. ordine"/"Vs.ord."/
  // "Rif. cliente"/"Ordine cliente"/"PO") — MAI il numero d'ordine INTERNO
  // del fornitore stesso (spesso vicino a "Numero d'ordine" senza
  // riferimento al cliente) né il numero di un DDT. Usato subito sotto per
  // proporre il collegamento automatico all'ordine fornitore giusto —
  // scoperto con un caso reale: un utente aveva dovuto collegare a mano
  // l'ordine dopo un import AI, pur essendo il riferimento scritto chiaro
  // in fattura ("Rif.cliente Vs.ord. 201 del 31.08.2026" → il nostro
  // OF/2026/0201, stesse identiche righe).
  const AI_IMPORT_INSTR = "Nel documento allegato c'è una FATTURA di un FORNITORE. Restituisci SOLO un oggetto JSON (nient'altro, niente backtick), con questi campi: fornitore (ragione sociale del fornitore emittente), numero (numero della fattura), data (formato AAAA-MM-GG), riferimentoOrdine (il NOSTRO numero d'ordine come lo riporta il fornitore, es. dopo un'etichetta \"Vs. ordine\"/\"Vs.ord.\"/\"Rif. cliente\"/\"Ordine cliente\"/\"PO\" — SOLO il numero, niente date o altro testo attorno; MAI il numero d'ordine interno del fornitore né un numero di DDT; stringa vuota se non chiaramente presente), righe: un array, per ogni riga cod (codice articolo alfanumerico, se presente altrimenti stringa vuota), descr (descrizione), qty (quantità fatturata, numero), prezzo (prezzo unitario PIENO prima di eventuali sconti, numero), sconto (percentuali di sconto a cascata unite da '+', es. \"50+15\", oppure stringa vuota se non c'è sconto), iva (aliquota IVA, numero), lotto (il numero di lotto/partita indicato vicino alla riga articolo, es. \"Partita\" o \"Lotto\"; stringa vuota se assente), scad (la data di scadenza del lotto indicata vicino alla riga articolo, formato AAAA-MM-GG; stringa vuota se assente).";
    $('ai-import-file').addEventListener('change', async () => {
    const file = $('ai-import-file').files[0];
    $('ai-import-file').value = '';
    if(!file) return;
    // Un file .xml è una fattura elettronica FatturaPA: i dati sono già
    // strutturati nel file stesso (il fornitore l'ha già "compilato" per
    // noi), leggerlo con un parser deterministico (app/fatturapa-xml.js) è
    // più affidabile E gratuito rispetto a passarlo comunque all'AI — un
    // PDF/foto invece resta il caso per cui l'AI serve davvero, qui non
    // cambia nulla. Richiesta reale: un file .xml caricato non compariva
    // nemmeno nella finestra di scelta ("accept" dell'input limitato a
    // PDF/immagini) — vedi anche il nuovo "accept" qui sopra nell'HTML.
    const isXml = window.SaasFatturaPA.looksLikeXmlFile(file);
    const fonte = isXml ? 'XML' : 'AI';
    aiImportStatus('Sto leggendo ' + file.name + (isXml ? '…' : ' con l\'AI…'), 'info');
    try{
      const p = isXml
        ? await window.SaasFatturaPA.parseFatturaPAFile(file)
        : await window.SaasAiImport.extractFromFile(store, file, {
            systemPrompt: "Sei l'assistente di un gestionale per la distribuzione di dispositivi medici. Rispondi sempre e solo con JSON valido, mai testo libero, mai backtick.",
            instr: AI_IMPORT_INSTR,
            companyId,
          });
      if(!p.numero && !(p.righe && p.righe.length)){ throw new Error((isXml ? 'il file XML' : 'l\'AI') + ' non ha riconosciuto una fattura fornitore in questo file'); }
      // Solo per l'XML (contiene la P.IVA di chi emette, l'AI su un
      // PDF/foto no): se il CedentePrestatore (chi ha EMESSO il documento)
      // ha la nostra stessa P.IVA, questa è una NOSTRA fattura di vendita
      // caricata per sbaglio — importarla come fattura fornitore
      // scambierebbe acquisti e vendite. Stesso controllo di
      // parseFatturaXML() in index.html ("dir" acquisto/vendita).
      if(isXml && p.fornitorePiva && company.piva && p.fornitorePiva.replace(/\D/g, '') === String(company.piva).replace(/\D/g, '')){
        throw new Error('questo XML è una TUA fattura di vendita (l\'hai emessa tu), non una fattura ricevuta da un fornitore: qui si importano solo fatture fornitore');
      }

      openForm(null);
      const match = window.SaasAiImport.findPartyByNome(fornitoriArr, p.fornitore);
      if(match){ $('f-fornitore').value = match.id; refreshLinkedOptions(match.id); }
      $('f-num').value = String(p.numero || '').trim();
      $('f-data').value = /^\d{4}-\d{2}-\d{2}$/.test(p.data || '') ? p.data : today();
      $('righe-body').innerHTML = '';
      const righeGrezze = (Array.isArray(p.righe) ? p.righe : []).map(r => ({
        cod: String(r.cod || '').trim(), descr: String(r.descr || '').trim(),
        qty: Math.max(1, parseInt(r.qty) || 1),
        prezzo: r.prezzo != null && r.prezzo !== '' ? parseFloat(r.prezzo) || 0 : 0,
        sconto: String(r.sconto || '').replace(/\s/g, ''),
        iva: r.iva != null && r.iva !== '' ? parseFloat(r.iva) : 22,
        lotto: String(r.lotto || '').trim(),
        scad: /^\d{4}-\d{2}-\d{2}$/.test(r.scad || '') ? r.scad : '',
      }));
      // Punto 5: verifica incrociata col catalogo prima di mostrare le righe
      // (corregge/completa cod e descr quando possibile, marca quelle senza
      // riscontro perché l'utente le controlli prima di salvare).
      const righe = await window.SaasAiImport.crossCheckRighe(store, companyId, righeGrezze);
      (righe.length ? righe : [null]).forEach(addRigaRow);
      const daVerificare = righe.filter(r => r.catalogMatch === 'unmatched').length;

      // Collegamento automatico all'ordine fornitore, dal riferimento letto
      // in fattura (p.riferimentoOrdine) — solo se il fornitore è stato
      // riconosciuto (altrimenti $('f-ordine') non ha ancora le opzioni
      // giuste) e c'è UN SOLO ordine di quel fornitore col numero
      // corrispondente. Impostare .value non fa scattare 'change' (quello
      // scatta solo su un'interazione dell'utente), quindi le righe già
      // riempite dall'AI qui sopra non vengono toccate.
      let ordineLink = null;
      if(match) ordineLink = findOrdineByRiferimento(ordiniPerFornitore[match.id], p.riferimentoOrdine);
      if(ordineLink){ $('f-ordine').value = ordineLink.id; refreshCmpOrdine(); }

      // Richiesta reale: "dopo che importo una fattura esce un avviso [...]
      // voglio che non deve uscire niente" — riferito esattamente a questo
      // messaggio quando l'import è andato bene su tutta la linea (fornitore
      // riconosciuto, ordine collegato o non pertinente, righe a catalogo):
      // a quel punto l'utente ha già rivisto tutto a mano nel form appena
      // aperto (le stesse informazioni sono già lì, nei menu Fornitore/
      // Ordine collegato), quindi il messaggio non gli diceva niente di
      // nuovo — restava solo lì ad attenderlo al ritorno all'elenco (questo
      // paragrafo vive dentro #list-card, nascosto finché il form è aperto:
      // ecco perché sembrava comparire "dopo", non subito). Un problema
      // REALE da controllare continua invece a essere segnalato — lì
      // l'avviso serve davvero, non è rumore: fornitore non riconosciuto,
      // righe non a catalogo, O un riferimento d'ordine c'era in fattura ma
      // non si è riusciti a collegarlo con certezza (ambiguo o non
      // trovato) — quest'ultimo caso non era già "ok" per caso: senza
      // questo controllo esplicito sarebbe finito silenziato pure lui,
      // nascondendo un caso in cui invece serve intervenire a mano.
      const ordineDaVerificare = !!(match && p.riferimentoOrdine && !ordineLink);
      const kind = !match ? 'error' : (daVerificare || ordineDaVerificare ? 'info' : 'ok');
      if(kind !== 'ok'){
        aiImportStatus(
          (match
            ? `Letto dal ${fonte}: fornitore riconosciuto come "${match.nome}".`
            : `Letto dal ${fonte}, ma nessun fornitore corrisponde a "${p.fornitore || '?'}": scegline uno dall'elenco prima di salvare (o creane uno nuovo in Fornitori).`)
          + (ordineLink ? ` Collegato automaticamente all'ordine ${esc(ordineLink.num)} (rif. "${esc(p.riferimentoOrdine)}" in fattura).`
            : (match && p.riferimentoOrdine ? ` Riferimento "${esc(p.riferimentoOrdine)}" in fattura, ma nessun ordine di questo fornitore corrisponde con certezza: collegalo a mano se serve.` : ''))
          + (daVerificare ? ` ${daVerificare} riga/e non trovate a catalogo, da controllare.` : ''),
          kind
        );
      }else{
        aiImportStatus('', '');
      }
    }catch(err){
      aiImportStatus('Lettura non riuscita: ' + (err.message || err), 'error');
    }
  });

  $('f-save').addEventListener('click', async () => {
    const fornitoreId = $('f-fornitore').value;
    const ofId = $('f-ordine').value || null;
    const ddtfId = $('f-ddtf').value || null;
    const num = $('f-num').value.trim();

    const righe = readRighe();
    if(!fornitoreId){ setMsg('Seleziona un fornitore.', 'error'); return; }

    if(righe.length === 0){ setMsg('Aggiungi almeno una riga con una descrizione.', 'error'); return; }
    if(!editingId){
      const lim = await store.checkDocLimit(companyId);
      if(!lim.ok){ setMsg(`Hai raggiunto il limite di ${lim.limite} documenti/mese del piano "${lim.piano}". Passa a un piano superiore in Impostazioni → Abbonamento per continuare.`, 'error'); return; }
    }

    $('f-save').disabled = true;
    setMsg('', '');
    try{
      const doc = { fornitoreId, ofId, ddtfId, num, data, righe };
      const isNew = !editingId;

  // Stesso schema di fatture.html, ma qui "pagata" invece di "incassata":
  // il denaro esce dall'azienda, non entra.
  //
  // Si parte SEMPRE dalla fattura esistente (Object.assign), non da un
  // oggetto con solo i campi da cambiare: num/data/fornitoreId/righe sono
  // colonne "not null" — un payload parziale fa fallire l'upsert con
  // "null value in column ... violates not-null constraint" invece di
  // limitarsi ad aggiornare i campi indicati. Bug reale, verificato in
  // produzione: "segna pagata" non ha mai funzionato, stesso identico
  // problema di fatture.html/togglePaid().
  async function setSupplierPaid(fattura, paid){
    const action = paid ? 'settle' : 'clear';
    const payload = paid ? {data:today()} : {
      expected_payments:fattura.pagamenti || [], expected_paid:!!fattura.paid,
      expected_paid_date:fattura.paidDate || null,
    };
    return store.mutateInvoicePayment(companyId, 'supplier', fattura, action, payload);
  }
  async function togglePaid(fattura){
    await setSupplierPaid(fattura, !fattura.paid);
    await renderList();
  }

  async function bulkMarkPaid(paid, docsPerId){
    await Promise.all([...PICK].map(id => docsPerId[id] ? setSupplierPaid(docsPerId[id], paid) : Promise.resolve()));
    PICK.clear();
    await renderList();

  function deselectAll(){ PICK.clear(); renderResults(); }

  // Naviga alla scheda della nota di credito nel suo modulo dedicato —
  // stesso meccanismo del box "Documenti collegati" (vedi app/lineage.js,
  // PAGE_FOR_COLL/saas_open_doc): qui non c'è una SPA, quindi cliccare
  // una riga nota di credito nell'elenco fatture salva {coll,num} e
  // naviga a note-credito-fornitore.html, che la trova e la apre.
  function openNCInOwnPage(num){
    localStorage.setItem('saas_open_doc', JSON.stringify({ coll: 'noteCreditoFornitore', num }));
    location.href = 'note-credito-fornitore.html';
  }

  // Scarica l'elenco da Supabase — SOLO quando i dati potrebbero davvero
  // essere cambiati (apertura pagina, dopo salvataggio/eliminazione...): fa
  // sempre passare dalla schermata "Carico…", quindi svuota per un istante
  // la tabella già a video. Chi cambia solo COME viene mostrato l'elenco
  // già scaricato (spunta una riga, ordina, filtra, cerca) deve chiamare
  // renderResults() qui sotto, non questa.
  async function renderList(){
    const rows = await window.SaasDocPage.loadList(store, 'fattureFornitore', companyId, $('list-area'));
    if(!rows) return;
    FATTURE_ALL = rows;
    renderResults();
  }
  // Ridisegna l'elenco dai dati già in FATTURE_ALL, senza rifare la query
  // di rete — vedi il commento in ordini.html (stessa correzione): prima
  // bastava spuntare una riga per far ripartire l'intera lista da capo
  // (svuotata in "Carico…", riscaricata, ridisegnata).
  function renderResults(){
    renderFilterbar();
    const area = $('list-area');
    if(FATTURE_ALL.length === 0 && noteCreditoFornitoreArr.length === 0){
      renderStats([]);
      area.innerHTML = '<p class="empty">Nessuna fattura ancora. Crea prima un fornitore, poi aggiungi una fattura con "+ Nuova fattura".</p>';
      return;
    }
    let elenco = FATTURE_ALL.filter(matchesQuery).filter(matchesFilter);
    renderStats(elenco);
    // Le note di credito fornitore compaiono anche loro nell'elenco, come
    // righe a sé (segno negativo) — come nel gestionale originale
    // (filteredDocRows(): "if(MOD==='ftf')rows=rows.concat(...noteCreditoFornitore...)").
    // Stessi filtri fornitore/ricerca/intervallo date della fattura, ma
    // NON lo stato di pagamento (matchesFilterNC le esclude già quando
    // quel filtro è attivo — una nota di credito non ha uno stato
    // "pagata/da pagare").
    const ncRows = noteCreditoFornitoreArr.filter(nc => !nc.annullato).filter(matchesQueryNC).filter(matchesFilterNC);
    if(elenco.length === 0 && ncRows.length === 0){
      area.innerHTML = '<p class="empty">Nessuna fattura trovata con questi criteri.</p>';
      return;
    }
    // Righe unificate per la tabella (fatture + note di credito), ordinate
    // insieme come nel gestionale originale — non due liste separate.
    // sortVal/docTotale/impTot/ivaTot funzionano identiche su entrambe:
    // stessi nomi di campo (num/data/fornitoreId/righe).
    const combined = elenco.map(f => Object.assign({}, f, { isNC: false }))
      .concat(ncRows.map(n => Object.assign({}, n, { isNC: true })));
    combined.sort((a, b) => sortCmp(sortVal(SORT.key, a), sortVal(SORT.key, b), SORT.dir));
    // Limita solo il DISEGNO della tabella, non l'elenco vero (usato sopra
    // e sotto per conteggi e azioni di massa) — vedi app/list-cap.js.
    const { shown: combinedShown, hidden: combinedHidden } = window.SaasListCap.capForRender(combined);

    const selRows = elenco.filter(f => PICK.has(f.id));
    let bulkHtml = '';
    if(selRows.length){
      const anyUnpaid = selRows.some(f => !f.paid), anyPaid = selRows.some(f => f.paid);
      const selTot = selRows.reduce((s, f) => s + docTotale(f.righe), 0);
      bulkHtml = `<div class="bulkbar"><span>${selRows.length} selezionat${selRows.length === 1 ? 'a' : 'e'} · Totale ${eur(selTot)}</span><div class="sp"></div>
        ${anyUnpaid ? `<button type="button" class="primary" id="bulk-paid">✓ Segna pagate</button>` : ''}
        ${anyPaid ? `<button type="button" id="bulk-unpaid">↺ Segna da pagare</button>` : ''}
        <button type="button" id="bulk-deselect">✕ Deseleziona</button></div>`;
    }
    const allChecked = elenco.length > 0 && elenco.every(f => PICK.has(f.id));

    area.innerHTML = bulkHtml + window.SaasListCap.capNoticeHtml(combinedHidden) + `<div class="table-scroll"><table class="elenco-table"><thead><tr>
        <th class="check-col"><input type="checkbox" id="check-all" ${allChecked ? 'checked' : ''}></th>
        ${th('num','Numero')}${th('data','Data')}${th('fornitore','Fornitore')}${th('imponibile','Imponibile')}${th('iva','IVA')}${th('totale','Totale')}${th('pagamento','Pagamento')}<th></th>
      </tr></thead><tbody>${combinedShown.map(f => f.isNC ? `
        <tr class="row-click" data-id="${f.id}" data-nc="1" data-num="${esc(f.num)}">
          <td class="check-col"></td>
          <td class="num-col">${esc(f.num)}</td>
          <td>${f.data ? new Date(f.data).toLocaleDateString('it-IT') : '—'}</td>
          <td>${esc((fornitoriById[f.fornitoreId] || {}).nome) || '(fornitore non trovato)'}</td>
          <td class="num-col">${eur(-impTot(f.righe))}</td>
          <td class="num-col">${eur(-ivaTot(f.righe))}</td>
          <td class="num-col">${eur(-docTotale(f.righe))}</td>
          <td><span class="pill nc">Nota di credito</span></td>
          <td class="actions"></td>
        </tr>` : `
        <tr class="row-click" data-id="${f.id}">
          <td class="check-col"><input type="checkbox" class="row-check" data-id="${f.id}" ${PICK.has(f.id) ? 'checked' : ''}></td>
          <td class="num-col">${esc(f.num)}</td>
          <td>${f.data ? new Date(f.data).toLocaleDateString('it-IT') : '—'}</td>
          <td>${esc((fornitoriById[f.fornitoreId] || {}).nome) || '(fornitore non trovato)'}</td>
          <td class="num-col">${eur(impTot(f.righe))}</td>
          <td class="num-col">${eur(ivaTot(f.righe))}</td>
          <td class="num-col">${eur(docTotale(f.righe))}</td>
          <td><button class="pill ${f.paid ? 'paid' : 'unpaid'}" data-toggle="${f.id}">${f.paid ? ('pagata' + (f.paidDate ? ' · ' + new Date(f.paidDate).toLocaleDateString('it-IT') : '')) : 'da pagare'}</button></td>
          <td class="actions">${PICK.has(f.id) ? `
            <button data-edit="${f.id}">Modifica</button>
            <button class="danger" data-del="${f.id}">Elimina</button>` : ''}
          </td>
        </tr>`).join('')}</tbody></table></div>`;
    window.SaasResize.makeColsResizable(area.querySelector('table'), 'fatture-fornitore-elenco');
    window.SaasDocPage.bindElenco(area, { elenco, pick: PICK, rerender: renderResults, setSort, openForm,
      onSpecialRow: tr => { if(tr.dataset.nc !== '1') return false; openNCInOwnPage(tr.dataset.num); return true; } });
    area.querySelectorAll('[data-toggle]').forEach(btn => btn.addEventListener('click', () => {
      togglePaid(elenco.find(x => x.id === btn.dataset.toggle));
    }));
    area.querySelectorAll('[data-del]').forEach(btn => btn.addEventListener('click', async () => {
      const f = elenco.find(x => x.id === btn.dataset.del);
      if(!confirm(`Eliminare la fattura ${f.num}? L'operazione non si può annullare.`)) return;
      try{
        await store.removeDoc('fattureFornitore', f.id);
        await renderList();
      }catch(err){
        alert('Errore durante l\'eliminazione: ' + err.message);
      }
    }));
    const docsPerId = Object.fromEntries(elenco.map(f => [f.id, f]));
    const bp = $('bulk-paid'); if(bp) bp.addEventListener('click', () => bulkMarkPaid(true, docsPerId));
    const bu = $('bulk-unpaid'); if(bu) bu.addEventListener('click', () => bulkMarkPaid(false, docsPerId));
    const bd = $('bulk-deselect'); if(bd) bd.addEventListener('click', deselectAll);
  }

  async function init(){
    const ctx = await window.SaasDocPage.initPage(store, 'fatture-fornitore');
    if(!ctx) return;
    companyId = ctx.companyId; company = ctx.company;

    const [fornitori, ordini, ddtFornitore, noteCreditoFornitore] = await Promise.all([
      store.loadCollection('fornitori', companyId),
      store.loadCollection('ordiniFornitore', companyId),
      store.loadCollection('ddtFornitore', companyId),
      store.loadCollection('noteCreditoFornitore', companyId),
    ]);
    fornitoriById = Object.fromEntries(fornitori.map(f => [f.id, f]));
    fornitoriArr = window.SaasDocPage.sortByNome(fornitori);
    ordiniPerFornitore = {};
    ordini.forEach(o => { (ordiniPerFornitore[o.fornitoreId] = ordiniPerFornitore[o.fornitoreId] || []).push(o); });
    allDdtfById = Object.fromEntries(ddtFornitore.map(d => [d.id, d]));
    ddtfPerFornitore = {};
    ddtFornitore.forEach(d => { (ddtfPerFornitore[d.fornitoreId] = ddtfPerFornitore[d.fornitoreId] || []).push(d); });
    noteCreditoFornitoreArr = noteCreditoFornitore;
    // fornitoriArr (già ordinato alfabeticamente qui sopra, come il menu
    // "Tutti i fornitori" della filterbar) — non l'array grezzo: altrimenti
    // il menu del form segue l'ordine di caricamento, non quello alfabetico.
    $('f-fornitore').innerHTML = fornitoriArr.map(f => `<option value="${f.id}">${esc(f.nome)}</option>`).join('');

    // Link "Totale acquisti"/"Da pagare ai fornitori" dalla dashboard
    // (fatture-fornitore.html?anno=2025): apre già filtrato Dal 1° gennaio
    // Al 31 dicembre di quell'anno, invece che su tutti gli anni.
    // L'intervallo iniziale è impostato prima del primo caricamento.

    await renderList();

    // Cascata: apertura diretta da "→ Genera fattura fornitore" in
    // ddt-fornitore.html, con fornitore/ordine già selezionati e le righe
    // precompilate dal DDT (prezzo/sconto/iva già risolti lì, niente da
    // riscrivere qui) — stesso meccanismo di "saas_gen_ft_from_ddt" in
    // fatture.html/ddt.html.
    const genFromDdtf = localStorage.getItem('saas_gen_ftf_from_ddtf');
    if(genFromDdtf){
      localStorage.removeItem('saas_gen_ftf_from_ddtf');
      const ddtf = allDdtfById[genFromDdtf];
      if(ddtf){
        openForm(null);
        $('f-fornitore').value = ddtf.fornitoreId;
        refreshLinkedOptions(ddtf.fornitoreId);
        $('f-ordine').value = ddtf.ofId || '';
        $('f-ddtf').value = ddtf.id;
        $('f-ddtf').dispatchEvent(new Event('change')); // precompila le righe dal DDT fornitore
      }
    }

    // Apertura diretta da un nodo del box "Documenti collegati" cliccato in un altro modulo (app/lineage.js).
    await window.SaasDocPage.openPendingFromLineage(store, companyId, 'fattureFornitore', openForm);
  }
  init();
</script>
</body>
</html>

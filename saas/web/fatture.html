<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fatture cliente — Gestionale</title>
<!--
  Quarto modulo reale: fatture cliente. Aggiunge, rispetto a ddt.html, un
  secondo collegamento a documento (ddtId oltre a ocId) e lo STATO DI
  INCASSO (paid/paidDate/pagamenti) — stessa identica forma di dati usata
  oggi in index.html (bulkPaid/toggle: paid, paidDate, pagamenti:[{data,importo}]).
-->
<script>(function(){try{if(localStorage.getItem('saas_theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<link rel="stylesheet" href="app/theme.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="app-main">
  <div class="page-head">
      <h2>Fatture cliente</h2>
      <p class="sub">Fatture cliente, con stato di incasso.</p>
    </div>

  <div class="card" id="form-card" hidden>
    <h3 id="form-title">Nuova fattura</h3>
    <div class="grid2">
      <div><label for="f-cliente">Cliente</label><select id="f-cliente"></select></div>
      <div><label for="f-data">Data</label><input id="f-data" type="date"></div>
    </div>
    <div class="grid2">
      <div><label for="f-ordine">Ordine collegato (facoltativo)</label>
        <select id="f-ordine"><option value="">— nessuno —</option></select>
      </div>
      <div><label for="f-ddt">DDT collegato (facoltativo)</label>
        <select id="f-ddt"><option value="">— nessuno —</option></select>
      </div>
    </div>
    <div id="f-dest-wrap"><label for="f-dest">Destinazione di consegna</label><select id="f-dest"></select></div>

    <div class="prod-pick"><input id="prodq" autocomplete="off" placeholder="Cerca per codice o descrizione…"><div class="prod-sugg" id="prodsugg"></div></div>
    <label>Righe</label>
    <div class="table-scroll"><table class="righe-table">
      <thead><tr><th>Codice</th><th>Descrizione</th><th>Qtà</th><th>Prezzo</th><th>Sconto %</th><th>IVA %</th><th></th></tr></thead>
      <tbody id="righe-body"></tbody>
    </table></div>
    <button class="linklike" id="add-riga" style="margin-top:8px">+ aggiungi riga</button>
    <p class="righe-total">Totale: <b id="righe-totale">0,00 €</b></p>

    <div class="form-actions">
      <button class="primary" id="f-save">Salva</button>
      <button class="ghost" id="f-cancel">Annulla</button>
    </div>
    <div class="msg" id="form-msg" hidden></div>
  </div>

  <div class="card">
    <div class="toolbar">
      <h3>Elenco</h3>
      <div class="toolbar-right">
        <div class="search-box"><span class="si">⌕</span><input type="text" id="q" placeholder="Cerca per numero o cliente…"></div>
        <button class="primary" id="new-fattura">+ Nuova fattura</button>
      </div>
    </div>
    <div id="list-area"><p class="empty">Carico…</p></div>
  </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
  window.SUPABASE_URL = 'https://rixvgmzedwdzgavjewbm.supabase.co';
  window.SUPABASE_ANON_KEY = 'sb_publishable_DFLcrBd6aiyyNGnCq41RQg_XrP0VR47';
</script>
<script src="app/store.js"></script>
<script src="app/theme-mode.js"></script>
<script src="app/nav.js"></script>
<script src="app/resize.js"></script>
<script src="app/print.js"></script>
<script src="app/prodpicker.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const store = window.SaasStore;
  let companyId = null;
  let company = {}; // dati azienda (companies), per l'intestazione di stampa/PDF
  let editingId = null;
  let clientiById = {};
  let ordiniPerCliente = {};
  let allOrdiniById = {};
  let ddtPerCliente = {};
  let allDdtById = {};
  let SORT = { key: 'num', dir: 'desc' };
  let Q = ''; // ricerca testuale sull'elenco, come Q nel gestionale originale
  let PICK = new Set(); // id selezionati per le azioni collettive (bulkbar), come PICK nell'originale

  function today(){ return new Date().toISOString().slice(0, 10); }
  function esc(s){ return (s == null ? '' : String(s)).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function eur(n){ return (Number(n) || 0).toLocaleString('it-IT', { style:'currency', currency:'EUR' }); }
  // Sottotitolo "📍 destinazione" sotto il nome del cliente in elenco,
  // quando il documento indica una destinazione diversa dalla sede legale.
  function destSub(it){
    const cliente = clientiById[it.clienteId];
    const dest = (it.destId && cliente && cliente.dest) ? cliente.dest.find(d => d.id === it.destId) : null;
    return dest ? `<div style="font-size:11px;color:var(--faint);margin-top:1px">📍 ${esc(dest.nome || dest.citta || 'Sede')}</div>` : '';
  }
  function setMsg(text, kind){
    const el = $('form-msg');
    if(!text){ el.hidden = true; return; }
    el.textContent = text; el.className = 'msg ' + kind; el.hidden = false;
  }

  // ---- ordinamento colonne: come nel gestionale originale — un clic
  // sull'intestazione ordina, un secondo clic inverte la direzione.
  function sortCmp(va, vb, dir){
    const mul = dir === 'asc' ? 1 : -1;
    if(typeof va === 'number' && typeof vb === 'number') return (va - vb) * mul;
    return String(va == null ? '' : va).localeCompare(String(vb == null ? '' : vb), 'it', { numeric:true }) * mul;
  }
  function sortVal(key, f){
    if(key === 'num') return f.num || '';
    if(key === 'data') return f.data || '';
    if(key === 'cliente') return (clientiById[f.clienteId] || {}).nome || '';
    if(key === 'totale') return docTotale(f.righe || []);
    if(key === 'incasso') return f.paid ? 1 : 0;
    return '';
  }
  function th(key, label){
    const on = SORT.key === key, ar = on ? (SORT.dir === 'asc' ? ' ↑' : ' ↓') : '';
    return `<th class="thsort ${on ? 'on' : ''}" data-sort="${key}">${esc(label)}${ar}</th>`;
  }
  function setSort(key){
    if(SORT.key === key) SORT.dir = SORT.dir === 'asc' ? 'desc' : 'asc';
    else { SORT.key = key; SORT.dir = key === 'num' || key === 'data' ? 'desc' : 'asc'; }
    renderList();
  }

  // Ricerca testuale: come Q nel gestionale originale (num + nome cliente).
  function matchesQuery(it){
    if(!Q) return true;
    const party = (clientiById[it.clienteId] || {}).nome || '';
    return (it.num || '').toLowerCase().includes(Q) || party.toLowerCase().includes(Q);
  }
  let searchTimer = null;
  $('q').addEventListener('input', () => {
    Q = $('q').value.trim().toLowerCase();
    clearTimeout(searchTimer);
    searchTimer = setTimeout(renderList, 200);
  });

  function rigaRowHtml(r){
    r = r || { cod:'', descr:'', qty:1, prezzo:0, sconto:'', iva:22 };
    return `<tr>
      <td><div class="prod-pick"><input class="r-cod" value="${esc(r.cod)}" placeholder="cod." autocomplete="off"><div class="prod-sugg"></div></div></td>
      <td><input class="r-descr" value="${esc(r.descr)}" placeholder="descrizione"></td>
      <td style="width:70px"><input class="r-qty" type="number" min="0" step="1" value="${r.qty}"></td>
      <td style="width:90px"><input class="r-prezzo" type="number" min="0" step="0.01" value="${r.prezzo}"></td>
      <td style="width:70px"><input class="r-sconto" type="text" inputmode="decimal" value="${esc(r.sconto || '')}" placeholder="0"></td>
      <td style="width:70px"><input class="r-iva" type="number" min="0" step="1" value="${r.iva}"></td>
      <td class="rm"><button type="button" class="rm-riga" title="rimuovi riga">✕</button></td>
    </tr>`;
  }
  function addRigaRow(r){
    $('righe-body').insertAdjacentHTML('beforeend', rigaRowHtml(r));
    bindRigaRow($('righe-body').lastElementChild);
    updateTotale();
  }
  function bindRigaRow(tr){
    tr.querySelector('.rm-riga').addEventListener('click', () => { tr.remove(); updateTotale(); });
    tr.querySelectorAll('input').forEach(inp => inp.addEventListener('input', updateTotale));
    // Stesso autocompletamento della barra di ricerca sopra la tabella, ma
    // dentro il campo "Codice" della riga stessa: scegliendo un prodotto
    // riempie questa riga invece di aggiungerne una nuova.
    window.SaasProdPicker.attach(tr.querySelector('.r-cod'), tr.querySelector('.prod-sugg'), {
      companyId, priceField: 'listinoVen', clearOnPick: false,
      onPick: p => {
        tr.querySelector('.r-cod').value = p.cod;
        tr.querySelector('.r-descr').value = p.descr;
        tr.querySelector('.r-prezzo').value = p.listinoVen || 0;
        tr.querySelector('.r-iva').value = p.iva || 22;
        const qtyEl = tr.querySelector('.r-qty');
        if (!Number(qtyEl.value)) qtyEl.value = 1;
        updateTotale();
        qtyEl.focus(); qtyEl.select();
      },
    });
  }
  function readRighe(){
    return [...$('righe-body').querySelectorAll('tr')].map(tr => ({
      cod: tr.querySelector('.r-cod').value.trim(),
      descr: tr.querySelector('.r-descr').value.trim(),
      qty: Number(tr.querySelector('.r-qty').value) || 0,
      prezzo: Number(tr.querySelector('.r-prezzo').value) || 0,
      sconto: tr.querySelector('.r-sconto').value.trim(),
      iva: Number(tr.querySelector('.r-iva').value) || 0,
    })).filter(r => r.descr || r.cod);
  }
  // Stessa aritmetica dello sconto del gestionale originale, cascata
  // "N+M" inclusa (es. "50+15" = 50% e poi un altro 15% sul residuo).
  function scParts(s){ return String(s == null ? '' : s).split('+').map(x => parseFloat(String(x).trim()) || 0); }
  function scFactor(s){ return scParts(s).reduce((f, p) => f * (1 - p / 100), 1); }
  function rigaTotale(r){ const imp = r.qty * r.prezzo * scFactor(r.sconto); return imp + imp * r.iva / 100; }
  function docTotale(righe){ return (righe || []).reduce((s, r) => s + rigaTotale(r), 0); }
  function scEff(s){ return +(((1 - scFactor(s)) * 100).toFixed(2)); }
  function lineNet(r){ return (r.qty || 0) * (r.prezzo || 0) * scFactor(r.sconto); }
  function updateTotale(){ $('righe-totale').textContent = eur(docTotale(readRighe())); }
  $('add-riga').addEventListener('click', () => addRigaRow(null));

  function refreshLinkedOptions(clienteId){
    const ordini = ordiniPerCliente[clienteId] || [];
    $('f-ordine').innerHTML = '<option value="">— nessuno —</option>' +
      ordini.map(o => `<option value="${o.id}">${esc(o.num)}</option>`).join('');
    const ddts = ddtPerCliente[clienteId] || [];
    $('f-ddt').innerHTML = '<option value="">— nessuno —</option>' +
      ddts.map(d => `<option value="${d.id}">${esc(d.num)}</option>`).join('');
  }
  // Le destinazioni di consegna sono gestite in clienti.html (CDEST): qui
  // si sceglie solo quale usare per QUESTO documento.
  function refreshDestOptions(clienteId){
    const cliente = clientiById[clienteId];
    const dest = (cliente && cliente.dest) || [];
    $('f-dest-wrap').hidden = dest.length === 0;
    $('f-dest').innerHTML = '<option value="">Sede legale</option>' +
      dest.map(d => `<option value="${d.id}">${esc(d.nome || d.citta || 'Sede')}</option>`).join('');
  }
  $('f-cliente').addEventListener('change', () => { refreshLinkedOptions($('f-cliente').value); refreshDestOptions($('f-cliente').value); });
  $('f-ddt').addEventListener('change', () => {
    const righeVuote = readRighe().length === 0;
    const ddt = allDdtById[$('f-ddt').value];
    if(ddt && righeVuote){
      $('righe-body').innerHTML = '';
      (ddt.righe || []).forEach(r => addRigaRow({ cod:r.cod, descr:r.descr, qty:r.qty, prezzo:0, iva:22 }));
    }
  });

  function openForm(fattura){
    editingId = fattura ? fattura.id : null;
    $('form-title').textContent = fattura ? `Modifica ${fattura.num}` : 'Nuova fattura';
    $('f-cliente').value = fattura ? fattura.clienteId : ($('f-cliente').options[0] ? $('f-cliente').options[0].value : '');
    refreshLinkedOptions($('f-cliente').value);
    refreshDestOptions($('f-cliente').value);
    $('f-ordine').value = fattura ? (fattura.ocId || '') : '';
    $('f-ddt').value = fattura ? (fattura.ddtId || '') : '';
    $('f-dest').value = fattura ? (fattura.destId || '') : '';
    $('f-data').value = fattura ? fattura.data : today();
    $('righe-body').innerHTML = '';
    (fattura ? fattura.righe : [null]).forEach(addRigaRow);
    setMsg('', '');
    $('form-card').hidden = false;
  }
  function closeForm(){ $('form-card').hidden = true; editingId = null; }
  $('new-fattura').addEventListener('click', () => {
    if(Object.keys(clientiById).length === 0){ alert('Crea prima almeno un cliente.'); return; }
    openForm(null);
  });
  $('f-cancel').addEventListener('click', closeForm);

  $('f-save').addEventListener('click', async () => {
    const clienteId = $('f-cliente').value;
    const ocId = $('f-ordine').value || null;
    const ddtId = $('f-ddt').value || null;
    const destId = $('f-dest').value || null;
    const data = $('f-data').value;
    const righe = readRighe();
    if(!clienteId){ setMsg('Seleziona un cliente.', 'error'); return; }
    if(!data){ setMsg('Inserisci una data.', 'error'); return; }
    if(righe.length === 0){ setMsg('Aggiungi almeno una riga con una descrizione.', 'error'); return; }

    $('f-save').disabled = true;
    setMsg('', '');
    try{
      const doc = { clienteId, ocId, ddtId, destId, data, righe };
      if(editingId){
        doc.id = editingId; // numero e stato di incasso restano quelli esistenti
      } else {
        const anno = Number(data.slice(0, 4));
        doc.num = await store.nextNumber(companyId, 'FT', anno);
        doc.paid = false; doc.paidDate = null; doc.pagamenti = [];
      }
      await store.saveDoc('fattureCliente', doc, companyId);
      closeForm();
      await renderList();
    }catch(err){
      setMsg(err.message || 'Errore imprevisto durante il salvataggio.', 'error');
    }finally{
      $('f-save').disabled = false;
    }
  });

  // Stesso identico schema usato oggi dal gestionale per lo stato di incasso
  // (bulkPaid/toggle): paid, paidDate, pagamenti:[{data, importo}].
  async function togglePaid(fattura){
    const paid = !fattura.paid;
    const doc = {
      id: fattura.id,
      paid,
      paidDate: paid ? today() : null,
      pagamenti: paid ? [{ data: today(), importo: docTotale(fattura.righe) }] : [],
    };
    await store.saveDoc('fattureCliente', doc, companyId);
    await renderList();
  }

  // Azione collettiva: segna incassate/da incassare tutte le fatture
  // selezionate in un colpo solo — stesso schema di bulkPaid() nel
  // gestionale originale, ma qui ogni fattura riceve la stessa data di
  // incasso odierna (una data diversa per ognuna richiederebbe un modulo
  // di dettaglio che l'originale non ha in questo passaggio collettivo).
  async function bulkMarkPaid(paid, righePerId){
    const doc = paid
      ? { paid: true, paidDate: today() }
      : { paid: false, paidDate: null, pagamenti: [] };
    await Promise.all([...PICK].map(id => store.saveDoc('fattureCliente', Object.assign({ id }, doc,
      paid ? { pagamenti: [{ data: today(), importo: docTotale(righePerId[id] || []) }] } : {}
    ), companyId)));
    PICK.clear();
    await renderList();
  }
  function deselectAll(){ PICK.clear(); renderList(); }

  // ---- generazione XML FatturaPA -----------------------------------------
  // Porta diretta di buildFatturaPAXml()/downloadFatturaPAXml() in
  // index.html: stesso schema XSD (v1.2), stessi codici (RF01, TP02, MP05...).
  // Nota: i campi del cliente che la fattura elettronica richiede (SDI o
  // PEC, indirizzo completo, codice fiscale, termini di pagamento...) sono
  // già colonne della tabella "clienti" — arrivano popolati per i clienti
  // importati dal gestionale originale, ma il form di clienti.html oggi non
  // li espone ancora tutti in modifica: senza SDI/PEC il pulsante avvisa e
  // non genera un file comunque da caricare, invece di produrne uno incompleto.
  function xmlEsc(s){ return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&apos;'); }
  function dueDate(cliente, inv){
    const days = cliente && cliente.term != null && cliente.term !== '' ? parseInt(cliente.term) : 30;
    const d = new Date((inv.data || today()) + 'T00:00:00');
    d.setDate(d.getDate() + (isNaN(days) ? 30 : days));
    return d.toISOString().slice(0, 10);
  }
  function buildFatturaPAXml(ft, cli, az){
    const ind = az.indirizzo || {}, set = az.settings || {};
    const progressivo = String(ft.num || '').replace(/\D/g, '').slice(-8).padStart(5, '0') || '00001';
    const codDest = (cli.sdi || '').trim().toUpperCase();
    const pecDest = (cli.pec || '').trim();
    const codiceDestinatario = codDest || (pecDest ? '0000000' : 'XXXXXXX');
    const formato = cli.tipo === 'PA' ? 'FPA12' : 'FPR12';
    // Un blocco DatiRiepilogo per aliquota IVA (obbligatorio, una per gruppo).
    const gruppi = {};
    (ft.righe || []).forEach(r => {
      const al = r.iva || 0;
      if(!gruppi[al]) gruppi[al] = { imponibile:0, imposta:0 };
      const netto = lineNet(r);
      gruppi[al].imponibile += netto;
      gruppi[al].imposta += netto * al / 100;
    });
    const esigibilita = cli.split === 'si' ? 'S' : (cli.esig === 'D' ? 'D' : 'I');
    const n2 = v => Number(v || 0).toFixed(2);
    const righeXml = (ft.righe || []).map((r, i) => `<DettaglioLinee>
        <NumeroLinea>${i + 1}</NumeroLinea>
        <Descrizione>${xmlEsc(r.descr || r.cod || 'Prodotto')}</Descrizione>
        <Quantita>${n2(r.qty)}</Quantita>
        <PrezzoUnitario>${(r.prezzo || 0).toFixed(4)}</PrezzoUnitario>
        ${scEff(r.sconto) > 0 ? `<ScontoMaggiorazione><Tipo>SC</Tipo><Percentuale>${scEff(r.sconto)}</Percentuale></ScontoMaggiorazione>` : ''}
        <PrezzoTotale>${n2(lineNet(r))}</PrezzoTotale>
        <AliquotaIVA>${n2(r.iva)}</AliquotaIVA>
      </DettaglioLinee>`).join('\n      ');
    const riepilogoXml = Object.keys(gruppi).map(al => `<DatiRiepilogo>
        <AliquotaIVA>${n2(al)}</AliquotaIVA>
        <ImponibileImporto>${n2(gruppi[al].imponibile)}</ImponibileImporto>
        <Imposta>${n2(gruppi[al].imposta)}</Imposta>
        <EsigibilitaIVA>${esigibilita}</EsigibilitaIVA>
      </DatiRiepilogo>`).join('\n      ');
    const scad = dueDate(cli, ft);
    const mpMap = { Bonifico:'MP05', RiBa:'MP12', Contanti:'MP01' };
    const modPag = mpMap[cli.pag] || 'MP05';
    const cessIdFiscale = cli.piva ? `<IdFiscaleIVA><IdPaese>IT</IdPaese><IdCodice>${xmlEsc(cli.piva)}</IdCodice></IdFiscaleIVA>` : '';
    const cessCF = cli.cf ? `<CodiceFiscale>${xmlEsc(cli.cf)}</CodiceFiscale>` : '';
    return `<?xml version="1.0" encoding="UTF-8"?>
<p:FatturaElettronica xmlns:p="http://ivaservizi.agenziaentrate.gov.it/docs/xsd/fatture/v1.2" versione="${formato}" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
  <FatturaElettronicaHeader>
    <DatiTrasmissione>
      <IdTrasmittente><IdPaese>IT</IdPaese><IdCodice>${xmlEsc(az.piva)}</IdCodice></IdTrasmittente>
      <ProgressivoInvio>${progressivo}</ProgressivoInvio>
      <FormatoTrasmissione>${formato}</FormatoTrasmissione>
      <CodiceDestinatario>${xmlEsc(codiceDestinatario)}</CodiceDestinatario>
      ${!codDest && pecDest ? `<PECDestinatario>${xmlEsc(pecDest)}</PECDestinatario>` : ''}
    </DatiTrasmissione>
    <CedentePrestatore>
      <DatiAnagrafici>
        <IdFiscaleIVA><IdPaese>IT</IdPaese><IdCodice>${xmlEsc(az.piva)}</IdCodice></IdFiscaleIVA>
        ${az.cf ? `<CodiceFiscale>${xmlEsc(az.cf)}</CodiceFiscale>` : ''}
        <Anagrafica><Denominazione>${xmlEsc(az.nome)}</Denominazione></Anagrafica>
        <RegimeFiscale>RF01</RegimeFiscale>
      </DatiAnagrafici>
      <Sede>
        <Indirizzo>${xmlEsc(ind.via)}</Indirizzo>
        <CAP>${xmlEsc(ind.cap)}</CAP>
        <Comune>${xmlEsc(ind.citta)}</Comune>
        <Provincia>${xmlEsc(ind.prov)}</Provincia>
        <Nazione>IT</Nazione>
      </Sede>
    </CedentePrestatore>
    <CessionarioCommittente>
      <DatiAnagrafici>
        ${cessIdFiscale}${cessCF}
        <Anagrafica><Denominazione>${xmlEsc(cli.nome)}</Denominazione></Anagrafica>
      </DatiAnagrafici>
      <Sede>
        <Indirizzo>${xmlEsc(cli.via)}</Indirizzo>
        <CAP>${xmlEsc(cli.cap)}</CAP>
        <Comune>${xmlEsc(cli.citta)}</Comune>
        <Provincia>${xmlEsc(cli.prov)}</Provincia>
        <Nazione>IT</Nazione>
      </Sede>
    </CessionarioCommittente>
  </FatturaElettronicaHeader>
  <FatturaElettronicaBody>
    <DatiGenerali>
      <DatiGeneraliDocumento>
        <TipoDocumento>TD01</TipoDocumento>
        <Divisa>EUR</Divisa>
        <Data>${ft.data}</Data>
        <Numero>${xmlEsc(ft.num)}</Numero>
        <ImportoTotaleDocumento>${n2(docTotale(ft.righe))}</ImportoTotaleDocumento>
      </DatiGeneraliDocumento>
    </DatiGenerali>
    <DatiBeniServizi>
      ${righeXml}
      ${riepilogoXml}
    </DatiBeniServizi>
    <DatiPagamento>
      <CondizioniPagamento>TP02</CondizioniPagamento>
      <DettaglioPagamento>
        <ModalitaPagamento>${modPag}</ModalitaPagamento>
        <DataScadenzaPagamento>${scad}</DataScadenzaPagamento>
        <ImportoPagamento>${n2(docTotale(ft.righe))}</ImportoPagamento>
        ${cli.iban || set.iban ? `<IBAN>${xmlEsc(set.iban)}</IBAN>` : ''}
      </DettaglioPagamento>
    </DatiPagamento>
  </FatturaElettronicaBody>
</p:FatturaElettronica>`;
  }
  function downloadFatturaPAXml(ft){
    const cli = clientiById[ft.clienteId] || {};
    if(!cli.sdi && !cli.pec){
      alert('Manca il Codice Destinatario o la PEC del cliente: aggiungilo alla scheda cliente prima di generare il file.');
      return;
    }
    const xml = buildFatturaPAXml(ft, cli, company);
    const blob = new Blob([xml], { type:'application/xml' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const piva = ((company && company.piva) || 'ITXXXXXXXXXXX').replace(/\D/g, '');
    a.href = url;
    a.download = 'IT' + piva + '_' + String(ft.num || '').replace(/\W/g, '') + '.xml';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }

  async function renderList(){
    const area = $('list-area');
    area.innerHTML = '<p class="empty">Carico…</p>';
    let elenco;
    try{
      elenco = await store.loadCollection('fattureCliente', companyId);
    }catch(err){
      area.innerHTML = `<p class="empty">Errore nel caricamento: ${esc(err.message)}</p>`;
      return;
    }
    if(elenco.length === 0){
      area.innerHTML = '<p class="empty">Nessuna fattura ancora. Crea prima un cliente, poi aggiungi una fattura con "+ Nuova fattura".</p>';
      return;
    }
    elenco = elenco.filter(matchesQuery);
    if(elenco.length === 0){
      area.innerHTML = '<p class="empty">Nessuna fattura trovata per la ricerca.</p>';
      return;
    }
    elenco.sort((a, b) => sortCmp(sortVal(SORT.key, a), sortVal(SORT.key, b), SORT.dir));

    // Barra delle azioni collettive: compare solo se c'è almeno una riga
    // selezionata (tra quelle attualmente visibili, come nell'originale).
    const selRows = elenco.filter(f => PICK.has(f.id));
    let bulkHtml = '';
    if(selRows.length){
      const anyUnpaid = selRows.some(f => !f.paid), anyPaid = selRows.some(f => f.paid);
      const selTot = selRows.reduce((s, f) => s + docTotale(f.righe), 0);
      bulkHtml = `<div class="bulkbar"><span>${selRows.length} selezionat${selRows.length === 1 ? 'a' : 'e'} · Totale ${eur(selTot)}</span><div class="sp"></div>
        ${anyUnpaid ? `<button type="button" class="primary" id="bulk-paid">✓ Segna incassate</button>` : ''}
        ${anyPaid ? `<button type="button" id="bulk-unpaid">↺ Segna da incassare</button>` : ''}
        <button type="button" id="bulk-deselect">✕ Deseleziona</button></div>`;
    }
    const allChecked = elenco.length > 0 && elenco.every(f => PICK.has(f.id));

    area.innerHTML = bulkHtml + `<div class="table-scroll"><table><thead><tr>
        <th class="check-col"><input type="checkbox" id="check-all" ${allChecked ? 'checked' : ''}></th>
        ${th('num','Numero')}${th('data','Data')}${th('cliente','Cliente')}${th('totale','Totale')}${th('incasso','Incasso')}<th></th>
      </tr></thead><tbody>${elenco.map(f => `
        <tr class="row-click" data-id="${f.id}">
          <td class="check-col"><input type="checkbox" class="row-check" data-id="${f.id}" ${PICK.has(f.id) ? 'checked' : ''}></td>
          <td class="num-col">${esc(f.num)}</td>
          <td>${f.data ? new Date(f.data).toLocaleDateString('it-IT') : '—'}</td>
          <td>${esc((clientiById[f.clienteId] || {}).nome) || '(cliente non trovato)'}${destSub(f)}</td>
          <td class="num-col">${eur(docTotale(f.righe))}</td>
          <td><button class="pill ${f.paid ? 'paid' : 'unpaid'}" data-toggle="${f.id}">${f.paid ? ('incassata' + (f.paidDate ? ' · ' + new Date(f.paidDate).toLocaleDateString('it-IT') : '')) : 'da incassare'}</button></td>
          <td class="actions">
            <button data-print="${f.id}" title="Stampa">🖨</button><button data-pdf="${f.id}" title="Scarica PDF">⬇ PDF</button><button data-xml="${f.id}" title="Genera XML FatturaPA">XML</button><button data-edit="${f.id}">Modifica</button>
            <button class="danger" data-del="${f.id}">Elimina</button>
          </td>
        </tr>`).join('')}</tbody></table></div>`;
    window.SaasResize.makeColsResizable(area.querySelector('table'), 'fatture-elenco');
    area.querySelectorAll('[data-sort]').forEach(th => th.addEventListener('click', () => setSort(th.dataset.sort)));
    area.querySelectorAll('[data-edit]').forEach(btn => btn.addEventListener('click', () => {
      openForm(elenco.find(x => x.id === btn.dataset.edit));
    }));
    area.querySelectorAll('tbody tr[data-id]').forEach(tr => tr.addEventListener('click', e => {
      if(e.target.closest('button, input, a, select')) return; // non aprire se il clic è su un pulsante/checkbox della riga
      openForm(elenco.find(x => x.id === tr.dataset.id));
    }));
    area.querySelectorAll('[data-toggle]').forEach(btn => btn.addEventListener('click', () => {
      togglePaid(elenco.find(x => x.id === btn.dataset.toggle));
    }));
    area.querySelectorAll('[data-print]').forEach(btn => btn.addEventListener('click', () => {
      const it = elenco.find(x => x.id === btn.dataset.print);
      window.SaasPrint.openPrintWindow('fattureCliente', it, clientiById[it.clienteId], company);
    }));
    area.querySelectorAll('[data-pdf]').forEach(btn => btn.addEventListener('click', async () => {
      const it = elenco.find(x => x.id === btn.dataset.pdf);
      btn.disabled = true;
      try{
        await window.SaasPrint.downloadPDF('fattureCliente', it, clientiById[it.clienteId], company);
      }catch(err){
        alert('Errore durante la generazione del PDF: ' + (err.message || err));
      }finally{
        btn.disabled = false;
      }
    }));
    area.querySelectorAll('[data-xml]').forEach(btn => btn.addEventListener('click', () => {
      downloadFatturaPAXml(elenco.find(x => x.id === btn.dataset.xml));
    }));
    area.querySelectorAll('[data-del]').forEach(btn => btn.addEventListener('click', async () => {
      const f = elenco.find(x => x.id === btn.dataset.del);
      if(!confirm(`Eliminare la fattura ${f.num}? L'operazione non si può annullare.`)) return;
      try{
        await store.removeDoc('fattureCliente', f.id);
        await renderList();
      }catch(err){
        alert('Errore durante l\'eliminazione: ' + err.message);
      }
    }));
    $('check-all').addEventListener('click', e => {
      e.stopPropagation();
      if(e.target.checked) elenco.forEach(f => PICK.add(f.id));
      else elenco.forEach(f => PICK.delete(f.id));
      renderList();
    });
    area.querySelectorAll('.row-check').forEach(ch => ch.addEventListener('click', e => {
      e.stopPropagation();
      if(e.target.checked) PICK.add(ch.dataset.id); else PICK.delete(ch.dataset.id);
      renderList();
    }));
    const righePerId = Object.fromEntries(elenco.map(f => [f.id, f.righe]));
    const bp = $('bulk-paid'); if(bp) bp.addEventListener('click', () => bulkMarkPaid(true, righePerId));
    const bu = $('bulk-unpaid'); if(bu) bu.addEventListener('click', () => bulkMarkPaid(false, righePerId));
    const bd = $('bulk-deselect'); if(bd) bd.addEventListener('click', deselectAll);
  }

  async function doLogout(){
    await store.signOut();
    localStorage.removeItem('saas_company_id');
    localStorage.removeItem('saas_company_nome');
    location.href = 'index.html';
  }

  async function init(){
    const session = await store.getSession();
    if(!session){ location.href = 'index.html'; return; }
    companyId = localStorage.getItem('saas_company_id');
    if(!companyId){ location.href = 'index.html'; return; }
    try{ company = await store.getCompany(companyId); }catch(e){ company = {}; } // niente PDF/stampa senza dati azienda? non deve comunque bloccare la pagina
    window.SaasNav.render('fatture', {
      companyName: localStorage.getItem('saas_company_nome') || 'Azienda',
      email: session.user.email,
      onLogout: doLogout,
    });

    const [clienti, ordini, ddts] = await Promise.all([
      store.loadCollection('clienti', companyId),
      store.loadCollection('ordiniCliente', companyId),
      store.loadCollection('ddt', companyId),
    ]);
    clientiById = Object.fromEntries(clienti.map(c => [c.id, c]));
    allOrdiniById = Object.fromEntries(ordini.map(o => [o.id, o]));
    allDdtById = Object.fromEntries(ddts.map(d => [d.id, d]));
    ordiniPerCliente = {}; ordini.forEach(o => { (ordiniPerCliente[o.clienteId] = ordiniPerCliente[o.clienteId] || []).push(o); });
    ddtPerCliente = {}; ddts.forEach(d => { (ddtPerCliente[d.clienteId] = ddtPerCliente[d.clienteId] || []).push(d); });
    $('f-cliente').innerHTML = clienti.map(c => `<option value="${c.id}">${esc(c.nome)}</option>`).join('');

    window.SaasProdPicker.attach($('prodq'), $('prodsugg'), {
      companyId, priceField: 'listinoVen',
      onPick: p => addRigaRow({ cod: p.cod, descr: p.descr, qty: 1, prezzo: p.listinoVen || 0, sconto: '', iva: p.iva || 22 }),
    });

    await renderList();
  }
  init();
</script>

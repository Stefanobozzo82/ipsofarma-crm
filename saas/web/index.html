<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accesso — Gestionale</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0ea371">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  /* Stessi colori e stessa tipografia del resto del prodotto (app/theme.css):
     questa pagina resta un file a sé (nessuna sidebar, nessuna azienda
     ancora scelta) ma non deve sembrare un prodotto diverso. */
  :root{
    --txt:#1b2531; --bg:#f4f6f8; --surface:#ffffff; --border:#e5e9ee; --border2:#d6dce3;
    --muted:#5f6b7a; --faint:#9aa5b2; --accent:#0ea371; --accent-d:#0b855d;
    --red:#d85c54; --red-s:#d85c541a;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Inter, sans-serif;
    --sh: 0 1px 2px #1b25310a, 0 1px 3px #1b25310f;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--txt); font:16px/1.5 var(--sans); }
  .wrap{ max-width:420px; margin:0 auto; padding:56px 20px; }
  .brand{ display:flex; align-items:center; gap:10px; margin:0 0 28px; }
  .brand .mark{ width:34px; height:34px; border-radius:8px; background:linear-gradient(135deg,#16c98c,#0c8a5e); display:grid; place-items:center; color:#04231a; font-weight:800; font-size:16px; flex:0 0 auto; }
  .brand .nm{ font-weight:700; font-size:16px; }
  h1{ font-size:20px; margin:0 0 22px; font-weight:700; }
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:11px; padding:22px; box-shadow:var(--sh); }
  .card + .card{ margin-top:16px; }
  label{ display:block; font-size:11.5px; color:var(--muted); margin:14px 0 5px; font-weight:600; text-transform:uppercase; letter-spacing:.3px; }
  label:first-of-type{ margin-top:0; }
  input{ width:100%; padding:10px 12px; border:1px solid var(--border2); border-radius:8px; background:#fff; color:var(--txt); font-size:14px; font-family:inherit; }
  input:focus{ outline:none; border-color:var(--accent); }
  button{ width:100%; margin-top:18px; padding:10px; border:1px solid var(--accent); border-radius:8px; background:var(--accent); color:#fff; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit; }
  button:hover{ background:var(--accent-d); }
  button:disabled{ opacity:.55; cursor:default; }
  button.ghost{ background:#fff; color:var(--txt); border:1px solid var(--border2); margin-top:8px; }
  .switch{ text-align:center; margin-top:16px; font-size:13.5px; color:var(--muted); }
  .switch a{ color:var(--accent-d); cursor:pointer; text-decoration:underline; }
  .msg{ margin-top:14px; padding:10px 12px; border-radius:8px; font-size:13.5px; }
  .msg.error{ background:var(--red-s); color:var(--red); }
  .msg.ok{ background:var(--surface); border:1px solid var(--accent); color:var(--accent-d); }
  .company{ padding:12px 14px; border:1px solid var(--border); border-radius:8px; display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .company-open{ width:auto; margin:0; padding:6px 12px; font-size:12.5px; }
  .company + .company{ margin-top:8px; }
  .role{ font-size:11px; padding:2px 8px; border-radius:99px; background:var(--bg); border:1px solid var(--border); color:var(--muted); text-transform:uppercase; letter-spacing:.04em; font-weight:600; }
  .hint{ font-size:13px; color:var(--muted); margin-top:6px; }
  [hidden]{ display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><div class="mark">G</div><div class="nm">Gestionale</div></div>
  <h1 id="page-title">Accesso</h1>

  <!-- stato: caricamento -->
  <div class="card" id="loading">
    <p class="hint">Verifico la sessione…</p>
  </div>

  <!-- stato: qualcuno ti ha invitato in un'azienda (?invite=<token> nell'URL) -->
  <div class="card" id="invite-box" hidden style="border-color:var(--accent)">
    <p class="hint" style="margin-top:0" id="invite-text"></p>
  </div>

  <!-- stato: non collegato -->
  <div class="card" id="auth-box" hidden>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="email" placeholder="tu@azienda.it">
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="almeno 8 caratteri">
    <button id="auth-submit">Accedi</button>
    <div class="switch">
      <span id="switch-text">Non hai un account?</span> <a id="switch-link">Registrati</a>
    </div>
    <div class="msg" id="auth-msg" hidden></div>
  </div>

  <!-- stato: collegato, nessuna azienda -->
  <div class="card" id="register-box" hidden>
    <p class="hint" style="margin-top:0">Sei collegato. Non appartieni ancora a nessuna azienda: creane una per iniziare.</p>
    <label for="company-nome">Nome azienda</label>
    <input id="company-nome" type="text" placeholder="Farmacia Rossi">
    <label for="company-slug">Indirizzo azienda</label>
    <input id="company-slug" type="text" placeholder="farmacia-rossi">
    <p class="hint">Solo lettere minuscole, numeri e trattini — sarà l'identificatore univoco dell'azienda.</p>
    <button id="register-submit">Crea azienda</button>
    <div class="msg" id="register-msg" hidden></div>
  </div>

  <!-- stato: collegato, con aziende -->
  <div class="card" id="dashboard-box" hidden>
    <p class="hint" style="margin-top:0" id="dashboard-email"></p>
    <div id="company-list"></div>
    <button class="ghost" id="logout">Esci</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="app/pwa.js"></script>
<script>
  // Valori pubblici (protetti dalla Row Level Security, non da tenere segreti):
  const SUPABASE_URL = 'https://rixvgmzedwdzgavjewbm.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_DFLcrBd6aiyyNGnCq41RQg_XrP0VR47';

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const $ = id => document.getElementById(id);
  const show = (...ids) => { ['loading','auth-box','register-box','dashboard-box'].forEach(i => $(i).hidden = !ids.includes(i)); };

  // Se qualcuno ha aperto questo link con ?invite=<token> (condiviso a mano
  // da un admin — niente invio email automatico, vedi 0008_inviti.sql),
  // dopo il login/registrazione va accettato invece del percorso normale
  // "le tue aziende"/"crea la tua azienda". Chi arriva da un invito è quasi
  // sempre una persona nuova senza account: apri direttamente su
  // "Registrazione" invece che su "Accesso" (può comunque passare ad
  // Accedi con lo switch, se ha già un account).
  const inviteToken = new URLSearchParams(location.search).get('invite');
  let mode = inviteToken ? 'signup' : 'signin'; // 'signin' | 'signup'
  if(inviteToken){
    $('page-title').textContent = 'Registrazione';
    $('auth-submit').textContent = 'Crea account';
    $('switch-text').textContent = 'Hai già un account?';
    $('switch-link').textContent = 'Accedi';
  }

  function setMsg(id, text, kind){
    const el = $(id);
    if(!text){ el.hidden = true; return; }
    el.textContent = text; el.className = 'msg ' + kind; el.hidden = false;
  }

  function slugify(s){
    return s.toLowerCase().trim()
      .normalize('NFD').replace(/[̀-ͯ]/g,'')
      .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,50);
  }
  $('company-nome').addEventListener('input', () => { $('company-slug').value = slugify($('company-nome').value); });

  $('switch-link').addEventListener('click', () => {
    mode = mode === 'signin' ? 'signup' : 'signin';
    $('page-title').textContent = mode === 'signin' ? 'Accesso' : 'Registrazione';
    $('auth-submit').textContent = mode === 'signin' ? 'Accedi' : 'Crea account';
    $('switch-text').textContent = mode === 'signin' ? 'Non hai un account?' : 'Hai già un account?';
    $('switch-link').textContent = mode === 'signin' ? 'Registrati' : 'Accedi';
    setMsg('auth-msg', '', '');
  });

  $('auth-submit').addEventListener('click', async () => {
    const email = $('email').value.trim();
    const password = $('password').value;
    if(!email || !password){ setMsg('auth-msg', 'Inserisci email e password.', 'error'); return; }
    $('auth-submit').disabled = true;
    setMsg('auth-msg', '', '');
    try{
      if(mode === 'signup'){
        const { error } = await sb.auth.signUp({ email, password });
        if(error) throw error;
        setMsg('auth-msg', 'Account creato. Se è richiesta la conferma email, controlla la casella di posta prima di accedere.', 'ok');
      } else {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if(error) throw error;
      }
      await refresh();
    } catch(err){
      setMsg('auth-msg', err.message || 'Errore imprevisto.', 'error');
    } finally {
      $('auth-submit').disabled = false;
    }
  });

  $('register-submit').addEventListener('click', async () => {
    const nome = $('company-nome').value.trim();
    const slug = $('company-slug').value.trim();
    if(!nome || !slug){ setMsg('register-msg', 'Inserisci nome e indirizzo azienda.', 'error'); return; }
    $('register-submit').disabled = true;
    setMsg('register-msg', '', '');
    try{
      const { error } = await sb.rpc('register_company', { p_nome: nome, p_slug: slug });
      if(error) throw error;
      await refresh();
    } catch(err){
      setMsg('register-msg', err.message || 'Errore imprevisto.', 'error');
    } finally {
      $('register-submit').disabled = false;
    }
  });

  $('logout').addEventListener('click', async () => {
    await sb.auth.signOut();
    mode = 'signin'; // dopo il logout ci si aspetta di dover accedere, non registrarsi di nuovo
    $('page-title').textContent = 'Accesso';
    $('auth-submit').textContent = 'Accedi';
    $('switch-text').textContent = 'Non hai un account?';
    $('switch-link').textContent = 'Registrati';
    await refresh();
  });

  // Mostra "sei stato invitato da X" PRIMA del login — invite_preview() è
  // concessa anche ad anon apposta, non serve una sessione per vederla.
  // Precompila (e blocca) l'email: evita che finisca per registrarsi/
  // accedere con un indirizzo diverso da quello a cui l'invito è rivolto,
  // scoprendolo solo dopo (accept_invite lo rifiuterebbe comunque).
  async function showInvitePreview(){
    if(!inviteToken) return;
    try{
      const { data, error } = await sb.rpc('invite_preview', { p_token: inviteToken });
      if(error) throw error;
      const preview = data && data[0];
      if(!preview){ $('invite-text').textContent = 'Questo link di invito non è più valido.'; $('invite-box').hidden = false; return; }
      $('invite-text').innerHTML = `Sei stato invitato a entrare in <b>${preview.company_nome.replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))}</b> come ${preview.role}. Accedi o registrati con <b>${preview.email}</b> per accettare.`;
      $('invite-box').hidden = false;
      $('email').value = preview.email;
      $('email').readOnly = true;
    }catch(err){
      $('invite-text').textContent = 'Questo link di invito non è più valido: ' + (err.message || err);
      $('invite-box').hidden = false;
    }
  }

  async function refresh(){
    show('loading');
    const { data: { session } } = await sb.auth.getSession();
    if(!session){
      $('page-title').textContent = mode === 'signin' ? 'Accesso' : 'Registrazione';
      await showInvitePreview();
      show('auth-box');
      return;
    }
    if(inviteToken){
      try{
        const { data, error } = await sb.rpc('accept_invite', { p_token: inviteToken });
        if(error) throw error;
        const row = data && data[0];
        if(row){
          localStorage.setItem('saas_company_id', row.company_id);
          localStorage.setItem('saas_company_nome', row.company_nome);
          location.href = 'dashboard.html';
          return;
        }
      }catch(err){
        // Invito non valido/scaduto/email sbagliata: non bloccare — chi è
        // già collegato può comunque vedere le proprie aziende sotto.
        $('invite-text').textContent = 'Non sono riuscito ad accettare l\'invito: ' + (err.message || err);
        $('invite-box').hidden = false;
      }
    }
    const { data: memberships, error } = await sb.from('my_memberships').select('*');
    if(error){
      $('page-title').textContent = 'Accesso';
      show('auth-box');
      setMsg('auth-msg', 'Sessione presente ma non riesco a leggere le aziende: ' + error.message, 'error');
      return;
    }
    if(!memberships || memberships.length === 0){
      $('page-title').textContent = 'Nuova azienda';
      show('register-box');
      return;
    }
    $('page-title').textContent = 'Le tue aziende';
    $('dashboard-email').textContent = session.user.email;
    $('company-list').innerHTML = memberships.map(m =>
      `<div class="company">
         <span>${m.company_nome} <span class="role">${m.role}</span></span>
         <button class="company-open" data-company-id="${m.company_id}" data-company-nome="${m.company_nome}">Apri gestionale →</button>
       </div>`
    ).join('');
    show('dashboard-box');
  }

  $('company-list').addEventListener('click', (ev) => {
    const btn = ev.target.closest('.company-open');
    if(!btn) return;
    localStorage.setItem('saas_company_id', btn.dataset.companyId);
    localStorage.setItem('saas_company_nome', btn.dataset.companyNome);
    location.href = 'dashboard.html';
  });

  refresh();
</script>
</body>
</html>

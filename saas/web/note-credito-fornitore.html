<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Note di credito fornitori — Gestionale</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0ea371">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<!-- Speculare a note-credito.html: verso un fornitore, collegata a una fattura fornitore. -->
<script>(function(){try{if(localStorage.getItem('saas_theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<link rel="stylesheet" href="app/theme.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="app-main">
  <div class="page-head">
      <h2>Note di credito fornitori</h2>
      <p class="sub">Storni ricevuti dai fornitori, con riferimento alla fattura.</p>
    </div>

  <div class="card" id="form-card" hidden>
    <button type="button" class="linklike back-link" id="f-back">← Torna all'elenco</button>
    <h3 id="form-title">Nuova nota di credito</h3>
    <!-- Stampa/PDF qui, non solo nell'elenco (dove servivano prima spuntare
         la riga) — vedi lo stesso commento in ordini.html. Nascosto per una
         nota di credito nuova non ancora salvata. -->
    <div class="form-actions" id="f-print-actions" hidden style="margin:0 0 14px;justify-content:flex-end">
      <button type="button" class="ghost" id="f-btn-print">🖨 Stampa</button>
      <div class="dl-menu">
        <button type="button" class="ghost" id="f-btn-download">⬇ Scarica</button>
        <div class="dl-list" id="f-download-list" hidden>
          <button type="button" id="f-dl-pdf">📄 PDF</button>
          <button type="button" id="f-dl-excel">📊 Excel</button>
        </div>
      </div>
    </div>
    <div class="grid2">
      <div><label for="f-fornitore">Fornitore</label><select id="f-fornitore"></select></div>
      <div><label for="f-data">Data</label><input id="f-data" type="date"></div>
    </div>
    <!-- Come per fatture-fornitore.html: una nota di credito ricevuta porta
         il numero che il fornitore le ha dato, non uno generato da noi. -->
    <label for="f-num">Numero nota di credito del fornitore</label>
    <input id="f-num" type="text" placeholder="es. 5301021389">
    <label for="f-fattura">Fattura collegata</label>
    <select id="f-fattura"><option value="">— nessuna —</option></select>

    <label>Righe</label>
    <div class="table-scroll"><table class="righe-table">
      <thead><tr><th class="drag-col"></th><th>Codice</th><th>Descrizione</th><th>Lotto</th><th>Scadenza</th><th>Qtà</th><th>Prezzo</th><th>Sconto %</th><th>IVA %</th><th></th></tr></thead>
      <tbody id="righe-body"></tbody>
    </table></div>
    <button class="linklike" id="add-riga" style="margin-top:8px">+ aggiungi riga</button>
    <p class="righe-total">Totale accreditato: <b id="righe-totale">0,00 €</b></p>

    <div class="panel" id="f-lineage-panel" hidden style="margin:16px 0"><div class="panel-h">Documenti collegati</div><div id="f-lineage"></div></div>

    <div class="form-actions">
      <button class="primary" id="f-save">Salva</button>
      <button class="ghost" id="f-cancel">Annulla</button>
    </div>
    <div class="msg" id="form-msg" hidden></div>
  </div>

  <div class="card" id="list-card">
    <div class="toolbar">
      <h3>Elenco</h3>
      <div class="toolbar-right">
        <div class="search-box"><span class="si">⌕</span><input type="text" id="q" placeholder="Cerca per numero o fornitore…"></div>
        <button class="ghost" id="ai-import-btn">Importa</button>
        <input type="file" id="ai-import-file" accept="application/pdf,image/*,.xml,text/xml,application/xml" hidden>
        <button class="primary" id="new-nc">+ Nuova nota di credito</button>
      </div>
    </div>
    <p class="msg" id="ai-import-status" hidden></p>
    <div id="filter-area"></div>
    <div id="list-area"><p class="empty">Carico…</p></div>
  </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<script src="app/store.js"></script>
<script src="app/doc-page.js"></script>

<script>
  const $ = id => document.getElementById(id);
  const store = window.SaasStore;
  let companyId = null;
  let company = {}; // dati azienda (companies), per l'intestazione di stampa/PDF
  let editingId = null;
  let pendingCredit = null;
  let editingNc = null; // la nota di credito in modifica — solo per Stampa/Scarica dal form, vedi f-btn-print/f-btn-download
  let fornitoriById = {};
  let fatturePerFornitore = {};
  let SORT = { key: 'num', dir: 'desc' };
  let Q = ''; // ricerca testuale sull'elenco, come Q nel gestionale originale
  let PICK = new Set(); // id selezionati con la spunta: i pulsanti azione di una riga compaiono solo se è spuntata
  // Ultimo elenco scaricato da renderList() — usato da renderResults() per
  // ridisegnare senza rifare la query di rete quando cambia solo COME viene
  // mostrato (spunta, ordinamento, filtri, ricerca), non cosa contiene.
  let NC_ALL = [];
  // Apertura sull'anno corrente; i link con anno esplicito conservano lo storico.
  const requestedDocumentYear = new URLSearchParams(location.search).get('anno');
  const initialDocumentYear = /^[1-9]\d{3}$/.test(requestedDocumentYear || '')
    ? requestedDocumentYear : String(new Date().getFullYear());
  let FFILT = { fornitore: '', from: `${initialDocumentYear}-01-01`, to: `${initialDocumentYear}-12-31` }; // filtri sopra l'elenco, come FFILT nel gestionale originale

  // Funzioni comuni a tutte le pagine documento — vedi app/doc-page.js.
  const { today, esc, eur, sortCmp, docTotale, impTot, ivaTot } = window.SaasDocPage;
  function sortVal(key, n){
    if(key === 'num') return n.num || '';
    if(key === 'data') return n.data || '';
    if(key === 'fornitore') return (fornitoriById[n.fornitoreId] || {}).nome || '';
    if(key === 'fattura') return n.fatturaId ? fatturaNumById(n.fornitoreId, n.fatturaId) : '';
    if(key === 'imponibile') return impTot(n.righe || []);
    if(key === 'iva') return ivaTot(n.righe || []);
    if(key === 'importo') return docTotale(n.righe || []);
    return '';
  }
  function th(key, label){ return window.SaasDocPage.thHtml(SORT, key, label); }
  function setSort(key){ window.SaasDocPage.toggleSort(SORT, key); renderResults(); }

  // Ricerca testuale: numero + nome fornitore.
  function matchesQuery(it){ return window.SaasDocPage.matchesText(Q, it, (fornitoriById[it.fornitoreId] || {}).nome); }
  window.SaasDocPage.bindSearch($('q'), q => { Q = q; renderResults(); });

  // ---- filtri: fornitore, intervallo date --------------------------------
  function matchesFilter(n){
    if(FFILT.fornitore && n.fornitoreId !== FFILT.fornitore) return false;
    if(FFILT.from && (n.data || '') < FFILT.from) return false;
    if(FFILT.to && (n.data || '') > FFILT.to) return false;
    return true;
  }
  function setFFilt(k, v){ FFILT[k] = v; renderResults(); }
  function clearFFilt(){ FFILT = { fornitore:'', from:'', to:'' }; renderResults(); }
  function renderFilterbar(){
    const active = FFILT.fornitore || FFILT.from || FFILT.to;
    const fornitoriArr = window.SaasDocPage.sortByNome(Object.values(fornitoriById));
    const fopts = '<option value="">Tutti i fornitori</option>' +
      fornitoriArr.map(f => `<option value="${f.id}" ${FFILT.fornitore === f.id ? 'selected' : ''}>${esc(f.nome)}</option>`).join('');
    $('filter-area').innerHTML = `<div class="filterbar">
      <select id="ff-fornitore">${fopts}</select>
      <div class="fdate-group">
        <label class="fdate">Dal <input type="date" id="ff-from" value="${FFILT.from}"></label>
        <label class="fdate">Al <input type="date" id="ff-to" value="${FFILT.to}"></label>
      </div>
      ${active ? '<button type="button" class="ffclear" id="ff-clear">✕ Azzera filtri</button>' : ''}
    </div>`;
    $('ff-fornitore').addEventListener('change', () => setFFilt('fornitore', $('ff-fornitore').value));
    $('ff-from').addEventListener('change', () => setFFilt('from', $('ff-from').value));
    $('ff-to').addEventListener('change', () => setFFilt('to', $('ff-to').value));
    if(active) $('ff-clear').addEventListener('click', clearFFilt);
  }
  function setMsg(text, kind){ window.SaasDocPage.showMsg($('form-msg'), text, kind); }

  function rigaRowHtml(r){
    r = r || { cod:'', descr:'', qty:1, prezzo:0, sconto:'', iva:22, lotto:'', scad:'' };
    return `<tr>
      <td class="drag-col"><span class="drag-handle" draggable="true" title="Trascina per riordinare la riga">⠿</span></td>
      <td><div class="prod-pick"><input class="r-cod" value="${esc(r.cod)}" placeholder="cod." autocomplete="off"><div class="prod-sugg"></div></div>${r.catalogMatch ? window.SaasAiImport.catalogBadgeHtml(r.catalogMatch) : ''}</td>
      <td><input class="r-descr" value="${esc(r.descr)}" placeholder="descrizione"></td>
      <td style="min-width:90px"><input class="r-lotto" type="text" value="${esc(r.lotto || '')}" placeholder="lotto"></td>
      <td style="min-width:130px"><input class="r-scad" type="date" value="${esc(r.scad || '')}"></td>
      <td style="min-width:70px"><input class="r-qty" type="number" min="0" step="1" value="${r.qty}"></td>
      <td style="min-width:90px"><input class="r-prezzo" type="number" min="0" step="0.01" value="${r.prezzo}"></td>
      <td style="min-width:70px"><input class="r-sconto" type="text" inputmode="decimal" value="${esc(r.sconto || '')}" placeholder="0"></td>
      <td style="min-width:70px"><input class="r-iva" type="number" min="0" step="1" value="${r.iva}"></td>
      <td class="rm"><button type="button" class="rm-riga" title="rimuovi riga">✕</button></td>
    </tr>`;
  }
  function addRigaRow(r){
    $('righe-body').insertAdjacentHTML('beforeend', rigaRowHtml(r));
    $('righe-body').lastElementChild._original = {...(r || {})};
    bindRigaRow($('righe-body').lastElementChild);
    updateTotale();
  }
  // Riordino righe per trascinamento: SaasDocPage.bindRowDrag() qui sotto.
  function bindRigaRow(tr){
    tr.querySelector('.rm-riga').addEventListener('click', () => { tr.remove(); updateTotale(); });
    tr.querySelectorAll('input').forEach(inp => inp.addEventListener('input', updateTotale));
    window.SaasDocPage.bindRowDrag(tr);
    // Stesso autocompletamento della barra di ricerca sopra la tabella, ma
    // dentro il campo "Codice" della riga stessa: scegliendo un prodotto
    // riempie questa riga invece di aggiungerne una nuova.
    window.SaasProdPicker.attach(tr.querySelector('.r-cod'), tr.querySelector('.prod-sugg'), {
      companyId, priceField: 'listinoAcq', clearOnPick: false,
      onPick: p => {
        tr.querySelector('.r-cod').value = p.cod;
        tr.querySelector('.r-descr').value = p.descr;
        tr.querySelector('.r-prezzo').value = p.listinoAcq || 0;
        tr.querySelector('.r-iva').value = p.iva ?? 22;
        const qtyEl = tr.querySelector('.r-qty');
        if (!Number(qtyEl.value)) qtyEl.value = 1;
        updateTotale();
        qtyEl.focus(); qtyEl.select();
      },
    });
  }
  function readRighe(){
    return [...$('righe-body').querySelectorAll('tr')].map(tr => ({
      ...tr._original,
      cod: tr.querySelector('.r-cod').value.trim(),
      descr: tr.querySelector('.r-descr').value.trim(),
      lotto: tr.querySelector('.r-lotto').value.trim(),
      scad: tr.querySelector('.r-scad').value,
      qty: Number(tr.querySelector('.r-qty').value) || 0,
      prezzo: Number(tr.querySelector('.r-prezzo').value) || 0,
      sconto: tr.querySelector('.r-sconto').value.trim(),
      iva: Number(tr.querySelector('.r-iva').value) || 0,
    })).filter(r => r.descr || r.cod);
  }
  // Stessa aritmetica dello sconto per tutte le pagine documento: vedi app/doc-page.js.
  function updateTotale(){ $('righe-totale').textContent = eur(docTotale(readRighe())); }
  // Scroll sulla nuova riga al click manuale — vedi lo stesso commento in
  // ordini.html.
  $('add-riga').addEventListener('click', () => {
    addRigaRow(null);
    $('righe-body').lastElementChild.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  });

  function refreshFatturaOptions(fornitoreId){
    const fatture = fatturePerFornitore[fornitoreId] || [];
    $('f-fattura').innerHTML = '<option value="">— nessuna —</option>' +
      fatture.map(f => `<option value="${f.id}">${esc(f.num)}</option>`).join('');
  }
  $('f-fornitore').addEventListener('change', () => refreshFatturaOptions($('f-fornitore').value));
  $('f-fattura').addEventListener('change', () => {
    const righeVuote = readRighe().length === 0;
    const fattura = (fatturePerFornitore[$('f-fornitore').value] || []).find(f => f.id === $('f-fattura').value);
    if(fattura && righeVuote){
      $('righe-body').innerHTML = '';
      (fattura.righe || []).forEach(r => addRigaRow({ cod:r.cod, descr:r.descr, qty:r.qty, prezzo:r.prezzo || 0, sconto:r.sconto || '', iva:r.iva ?? 22 }));
    }
  });

  function openForm(nc){
    pendingCredit = null;
    editingId = nc ? nc.id : null;
    editingNc = nc;
    $('form-title').textContent = nc ? `Modifica ${nc.num}` : 'Nuova nota di credito';
    $('f-fornitore').value = nc ? nc.fornitoreId : ($('f-fornitore').options[0] ? $('f-fornitore').options[0].value : '');
    refreshFatturaOptions($('f-fornitore').value);
    $('f-fattura').value = nc ? (nc.fatturaId || '') : '';
    $('f-num').value = nc ? nc.num : '';
    $('f-data').value = nc ? nc.data : today();
    $('righe-body').innerHTML = '';
    (nc ? nc.righe : [null]).forEach(addRigaRow);
    renderLineage(nc);
    $('f-print-actions').hidden = !nc;
    setMsg('', '');
    $('form-card').hidden = false;
    $('list-card').hidden = true;
    const cancelled = !!(nc && nc.annullato);
    $('form-card').querySelectorAll('input, select, textarea, #f-save, #add-riga, .rm-riga').forEach(el => { el.disabled = cancelled; });
    $('form-card').querySelectorAll('.drag-handle').forEach(el => { el.draggable = !cancelled; });
    if(cancelled){ $('form-title').textContent = 'Nota annullata — ' + nc.num; setMsg('Documento annullato: consultazione e stampa disponibili.', ''); }

  }
  // Box "Documenti collegati" (vedi app/lineage.js).
  function renderLineage(doc){ return window.SaasDocPage.renderLineagePanel(store, companyId, $('f-lineage-panel'), $('f-lineage'), 'noteCreditoFornitore', doc); }
  function closeForm(){ $('form-card').hidden = true; $('list-card').hidden = false; editingId = null; editingNc = null; }
  $('new-nc').addEventListener('click', async () => {
    if(Object.keys(fornitoriById).length === 0){ alert('Crea prima almeno un fornitore.'); return; }
    const lim = await store.checkDocLimit(companyId);
    if(!lim.ok){ alert(`Hai raggiunto il limite di ${lim.limite} documenti/mese del piano "${lim.piano}". Passa a un piano superiore in Impostazioni → Abbonamento per continuare.`); return; }
    openForm(null);
  });
  $('f-cancel').addEventListener('click', closeForm);
  $('f-back').addEventListener('click', closeForm);
  window.SaasDocPage.bindPrintActions($, 'noteCreditoFornitore', () => editingNc, d => fornitoriById[d.fornitoreId], () => company);

  // ---- importa nota di credito fornitore da PDF/foto con l'AI ---------------
  // Stesso meccanismo di fatture-fornitore.html (vedi app/ai-import.js): una
  // nota di credito è comunque un documento ricevuto dal fornitore, non
  // creato da noi. Il collegamento a una fattura specifica (f-fattura)
  // resta manuale di proposito: l'AI non ha modo di sapere a quale fattura
  // già registrata si riferisce, solo l'utente può scegliere quella giusta.
  function aiImportStatus(text, kind){ window.SaasDocPage.showMsg($('ai-import-status'), text, kind || 'info'); }
  const AI_IMPORT_INSTR = "Nel documento allegato c'è una NOTA DI CREDITO ricevuta da un FORNITORE (uno storno o rimborso, non una fattura). Restituisci SOLO un oggetto JSON (nient'altro, niente backtick), con questi campi: fornitore (ragione sociale del fornitore emittente), numero (numero della nota di credito), data (formato AAAA-MM-GG), righe: un array, per ogni riga cod (codice articolo alfanumerico, se presente altrimenti stringa vuota), descr (descrizione), qty (quantità, numero), prezzo (prezzo unitario PIENO prima di eventuali sconti, numero), sconto (percentuali di sconto a cascata unite da '+', es. \"50+15\", stringa vuota se non c'è sconto), iva (aliquota IVA, numero), lotto (numero di lotto/partita se indicato vicino alla riga; stringa vuota se assente), scad (data di scadenza del lotto, formato AAAA-MM-GG; stringa vuota se assente).";
    $('ai-import-file').addEventListener('change', async () => {
    const file = $('ai-import-file').files[0];
    $('ai-import-file').value = '';
    if(!file) return;
    // Un file .xml è una nota di credito elettronica FatturaPA (stesso
    // schema di una fattura, solo TipoDocumento diverso — non serve
    // distinguerli, i campi letti sono gli stessi): i dati sono già
    // strutturati, un parser deterministico (app/fatturapa-xml.js) è più
    // affidabile e gratuito rispetto all'AI — vedi lo stesso commento in
    // fatture-fornitore.html.
    const isXml = window.SaasFatturaPA.looksLikeXmlFile(file);
    const fonte = isXml ? 'XML' : 'AI';
    aiImportStatus('Sto leggendo ' + file.name + (isXml ? '…' : ' con l\'AI…'), 'info');
    try{
      const p = isXml
        ? await window.SaasFatturaPA.parseFatturaPAFile(file)
        : await window.SaasAiImport.extractFromFile(store, file, {
            systemPrompt: "Sei l'assistente di un gestionale per la distribuzione di dispositivi medici. Rispondi sempre e solo con JSON valido, mai testo libero, mai backtick.",
            instr: AI_IMPORT_INSTR,
            companyId,
          });
      if(!p.numero && !(p.righe && p.righe.length)){ throw new Error((isXml ? 'il file XML' : 'l\'AI') + ' non ha riconosciuto una nota di credito fornitore in questo file'); }
      // Solo per l'XML (contiene la P.IVA di chi emette, l'AI su un
      // PDF/foto no): se il CedentePrestatore ha la nostra stessa P.IVA,
      // questa è una NOSTRA nota di credito emessa a un cliente caricata
      // per sbaglio — vedi lo stesso controllo in fatture-fornitore.html.
      if(isXml && p.fornitorePiva && company.piva && p.fornitorePiva.replace(/\D/g, '') === String(company.piva).replace(/\D/g, '')){
        throw new Error('questo XML è una TUA nota di credito (l\'hai emessa tu a un cliente), non una ricevuta da un fornitore: qui si importano solo note di credito fornitore');
      }

      openForm(null);
      const match = window.SaasAiImport.findPartyByNome(Object.values(fornitoriById), p.fornitore);
      if(match){ $('f-fornitore').value = match.id; refreshFatturaOptions(match.id); }
      $('f-num').value = String(p.numero || '').trim();
      $('f-data').value = /^\d{4}-\d{2}-\d{2}$/.test(p.data || '') ? p.data : today();
      $('righe-body').innerHTML = '';
      const righeGrezze = (Array.isArray(p.righe) ? p.righe : []).map(r => ({
        cod: String(r.cod || '').trim(), descr: String(r.descr || '').trim(),
        qty: Math.max(1, parseInt(r.qty) || 1),
        prezzo: r.prezzo != null && r.prezzo !== '' ? parseFloat(r.prezzo) || 0 : 0,
        sconto: String(r.sconto || '').replace(/\s/g, ''),
        iva: r.iva != null && r.iva !== '' ? parseFloat(r.iva) : 22,
        lotto: String(r.lotto || '').trim(),
        scad: /^\d{4}-\d{2}-\d{2}$/.test(r.scad || '') ? r.scad : '',
      }));
      // Punto 5: verifica incrociata col catalogo prima di mostrare le righe.
      const righe = await window.SaasAiImport.crossCheckRighe(store, companyId, righeGrezze);
      (righe.length ? righe : [null]).forEach(addRigaRow);
      const daVerificare = righe.filter(r => r.catalogMatch === 'unmatched').length;
      aiImportStatus(
        (match
          ? `Letto dal ${fonte}: fornitore riconosciuto come "${match.nome}". Controlla i dati (e collega la fattura, se serve) prima di salvare.`
          : `Letto dal ${fonte}, ma nessun fornitore corrisponde a "${p.fornitore || '?'}": scegline uno dall'elenco prima di salvare (o creane uno nuovo in Fornitori).`)
        + (daVerificare ? ` ${daVerificare} riga/e non trovate a catalogo, da controllare.` : ' Righe verificate col catalogo.'),
        match && !daVerificare ? 'ok' : (match ? 'info' : 'error')
      );
    }catch(err){
      aiImportStatus('Lettura non riuscita: ' + (err.message || err), 'error');
    }
  });

  $('f-save').addEventListener('click', async () => {
    if($('f-save').disabled || editingNc?.annullato) return;
    const fornitoreId = $('f-fornitore').value, fatturaId = $('f-fattura').value || null;
    const num = $('f-num').value.trim(), data = $('f-data').value, righe = readRighe();
    if(!fornitoreId || !data || !righe.length || !num){ setMsg('Completa soggetto, data, numero e righe.', 'error'); return; }
    $('f-save').disabled = true;
    setMsg('', '');
    try{
      const doc = {...(editingNc || {}), fornitoreId, fatturaId, num: num || null, data, righe};
      const requestKey = JSON.stringify({expected:editingNc || null,doc});
      if(!pendingCredit || pendingCredit.key !== requestKey) pendingCredit = {key:requestKey,id:crypto.randomUUID()};
      await store.saveCreditNote(companyId, 'supplier', editingNc || null, doc, pendingCredit.id);
      closeForm(); await renderList();
    }catch(err){ setMsg(err.message || 'Errore durante il salvataggio.', 'error'); }
    finally{ $('f-save').disabled = false; }
  });

  // Scarica l'elenco da Supabase — SOLO quando i dati potrebbero davvero
  // essere cambiati (apertura pagina, dopo salvataggio/eliminazione...): fa
  // sempre passare dalla schermata "Carico…", quindi svuota per un istante
  // la tabella già a video. Chi cambia solo COME viene mostrato l'elenco
  // già scaricato (spunta una riga, ordina, filtra, cerca) deve chiamare
  // renderResults() qui sotto, non questa.
  async function renderList(){
    const rows = await window.SaasDocPage.loadList(store, 'noteCreditoFornitore', companyId, $('list-area'));
    if(!rows) return;
    NC_ALL = rows;
    renderResults();
  }
  // Ridisegna l'elenco dai dati già in NC_ALL, senza rifare la query di
  // rete — vedi il commento in ordini.html (stessa correzione): prima
  // bastava spuntare una riga per far ripartire l'intera lista da capo
  // (svuotata in "Carico…", riscaricata, ridisegnata).
  function renderResults(){
    renderFilterbar();
    const area = $('list-area');
    if(NC_ALL.length === 0){
      area.innerHTML = '<p class="empty">Nessuna nota di credito ancora. Crea prima un fornitore, poi aggiungine una con "+ Nuova nota di credito".</p>';
      return;
    }
    let elenco = NC_ALL.filter(matchesQuery).filter(matchesFilter);
    if(elenco.length === 0){
      area.innerHTML = '<p class="empty">Nessuna nota di credito trovata con questi criteri.</p>';
      return;
    }
    elenco.sort((a, b) => sortCmp(sortVal(SORT.key, a), sortVal(SORT.key, b), SORT.dir));
    const allChecked = elenco.length > 0 && elenco.every(n => PICK.has(n.id));
    area.innerHTML = `<div class="table-scroll"><table class="elenco-table"><thead><tr>
        <th class="check-col"><input type="checkbox" id="check-all" ${allChecked ? 'checked' : ''}></th>
        ${th('num','Numero')}${th('data','Data')}${th('fornitore','Fornitore')}${th('fattura','Fattura')}${th('imponibile','Imponibile')}${th('iva','IVA')}${th('importo','Importo')}<th></th>
      </tr></thead><tbody>${elenco.map(n => `
        <tr class="row-click" data-id="${n.id}">
          <td class="check-col"><input type="checkbox" class="row-check" data-id="${n.id}" ${PICK.has(n.id) ? 'checked' : ''}></td>
          <td class="num-col">${esc(n.num)}${n.annullato ? ' — Annullata' : ''}</td>
          <td>${n.data ? new Date(n.data).toLocaleDateString('it-IT') : '—'}</td>
          <td>${esc((fornitoriById[n.fornitoreId] || {}).nome) || '(fornitore non trovato)'}</td>
          <td>${n.fatturaId ? esc(fatturaNumById(n.fornitoreId, n.fatturaId)) : '—'}</td>
          <td class="num-col">${eur(impTot(n.righe))}</td>
          <td class="num-col">${eur(ivaTot(n.righe))}</td>
          <td class="num-col">${eur(docTotale(n.righe))}</td>
          <td class="actions">${PICK.has(n.id) ? `
            <button data-edit="${n.id}">${n.annullato ? 'Visualizza' : 'Modifica'}</button>
            ${!n.annullato ? `<button class="danger" data-del="${n.id}">Annulla nota</button>` : ''}` : ''}
          </td>
        </tr>`).join('')}</tbody></table></div>`;
    window.SaasResize.makeColsResizable(area.querySelector('table'), 'note-credito-fornitore-elenco');
    window.SaasDocPage.bindElenco(area, { elenco, pick: PICK, rerender: renderResults, setSort, openForm });
    area.querySelectorAll('[data-del]').forEach(btn => btn.addEventListener('click', async () => {
      const n = elenco.find(x => x.id === btn.dataset.del);
      if(n.annullato) return;
      const reason = prompt('Motivo annullamento della nota ' + n.num + ':');
      if(!reason || !reason.trim()) return;
      btn.disabled = true;
      try{
        await store.cancelCreditNote(companyId, 'supplier', n, reason.trim());
        await renderList();
      }catch(err){
        alert('Errore durante annullamento: ' + err.message);
        btn.disabled = false;
      }
    }));
  }
  function fatturaNumById(fornitoreId, fatturaId){
    const f = (fatturePerFornitore[fornitoreId] || []).find(x => x.id === fatturaId);
    return f ? f.num : '?';
  }

  async function init(){
    const ctx = await window.SaasDocPage.initPage(store, 'note-credito-fornitore');
    if(!ctx) return;
    companyId = ctx.companyId; company = ctx.company;

    const [fornitori, fatture] = await Promise.all([
      store.loadCollection('fornitori', companyId),
      store.loadCollection('fattureFornitore', companyId),
    ]);
    fornitoriById = Object.fromEntries(fornitori.map(f => [f.id, f]));
    fatturePerFornitore = {};
    fatture.forEach(f => { (fatturePerFornitore[f.fornitoreId] = fatturePerFornitore[f.fornitoreId] || []).push(f); });
    // Ordine alfabetico, non quello di caricamento — come il menu "Tutti i
    // fornitori" della filterbar qui sopra (fornitoriArr).
    $('f-fornitore').innerHTML = window.SaasDocPage.partyOptionsHtml(fornitori);

    await renderList();

    // Apertura diretta da un nodo del box "Documenti collegati" cliccato in un altro modulo (app/lineage.js).
    await window.SaasDocPage.openPendingFromLineage(store, companyId, 'noteCreditoFornitore', openForm);
  }
  init();
</script>
</body>
</html>

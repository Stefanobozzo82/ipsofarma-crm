<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Note di credito fornitori — banco di prova Fase 2</title>
<!-- Speculare a note-credito.html: verso un fornitore, collegata a una fattura fornitore. -->
<style>
  :root{
    --ink:#16212c; --paper:#f3f4f1; --card:#ffffff; --line:#d7dad2;
    --muted:#5c6670; --accent:#2f6b66; --accent-ink:#ffffff; --danger:#b3402a; --danger-soft:#f7e3de;
  }
  @media (prefers-color-scheme: dark){
    :root{ --ink:#e7eaee; --paper:#12161d; --card:#1a2029; --line:#2a313c; --muted:#94a0ab; --accent:#5caba4; --accent-ink:#0d1512; --danger:#e08a72; --danger-soft:#3a201a; }
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--paper); color:var(--ink); font:16px/1.5 ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif; }
  .wrap{ max-width:860px; margin:0 auto; padding:32px 20px 60px; }
  header{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:22px; gap:10px; flex-wrap:wrap; }
  .eyebrow{ font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); margin:0 0 4px; }
  h1{ font-size:20px; margin:0; }
  .nav{ display:flex; gap:14px; align-items:center; font-size:13px; flex-wrap:wrap; row-gap:6px; }
  .nav a, .nav button{ color:var(--muted); background:none; border:none; cursor:pointer; font-size:13px; padding:0; text-decoration:underline; }
  .nav a.on{ color:var(--ink); font-weight:600; text-decoration:none; }
  .nav .sep{ color:var(--line); }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; }
  .card + .card{ margin-top:16px; }
  .toolbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .toolbar h2{ font-size:15px; margin:0; }
  button.primary{ padding:8px 14px; border:none; border-radius:8px; background:var(--accent); color:var(--accent-ink); font-size:14px; font-weight:600; cursor:pointer; }
  button.primary:disabled{ opacity:.55; cursor:default; }
  button.ghost{ background:transparent; color:var(--accent); border:1px solid var(--line); border-radius:8px; padding:8px 14px; font-size:14px; cursor:pointer; }
  button.linklike{ background:none; border:none; color:var(--accent); cursor:pointer; font-size:13px; text-decoration:underline; padding:0; }
  table{ width:100%; border-collapse:collapse; font-size:14px; }
  th{ text-align:left; font-size:12px; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); padding:8px 6px; border-bottom:1px solid var(--line); }
  td{ padding:10px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
  tr:last-child td{ border-bottom:none; }
  td.num-col{ font-variant-numeric:tabular-nums; }
  td.actions{ text-align:right; white-space:nowrap; }
  td.actions button{ background:none; border:none; color:var(--accent); cursor:pointer; font-size:13px; text-decoration:underline; margin-left:10px; padding:0; }
  td.actions button.danger{ color:var(--danger); }
  .empty{ color:var(--muted); font-size:14px; padding:20px 0; text-align:center; }
  label{ display:block; font-size:13px; color:var(--muted); margin:12px 0 4px; }
  label:first-of-type{ margin-top:0; }
  input, select{ width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px; background:var(--paper); color:var(--ink); font-size:14px; font-family:inherit; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:0 12px; }
  .righe-table th, .righe-table td{ padding:6px 4px; }
  .righe-table input{ padding:6px 8px; font-size:13px; }
  .righe-table td.rm{ text-align:center; }
  .righe-table td.rm button{ background:none; border:none; color:var(--danger); cursor:pointer; font-size:16px; line-height:1; padding:2px 6px; }
  .righe-total{ text-align:right; font-size:14px; margin-top:8px; }
  .righe-total b{ font-variant-numeric:tabular-nums; }
  .form-actions{ display:flex; gap:10px; margin-top:16px; }
  .msg{ margin-top:12px; padding:10px 12px; border-radius:8px; font-size:14px; }
  .msg.error{ background:var(--danger-soft); color:var(--danger); }
  .msg.ok{ background:var(--card); border:1px solid var(--accent); color:var(--accent); }
  [hidden]{ display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <p class="eyebrow" id="company-eyebrow">Azienda</p>
      <h1>Note di credito fornitori</h1>
    </div>
    <div class="nav">
      <a href="clienti.html">Clienti</a>
      <a href="ordini.html">Ordini</a>
      <a href="ddt.html">DDT</a>
      <a href="fatture.html">Fatture</a>
      <a href="note-credito.html">NC</a>
      <span class="sep">·</span>
      <a href="fornitori.html">Fornitori</a>
      <a href="ordini-fornitore.html">Ordini forn.</a>
      <a href="fatture-fornitore.html">Fatture forn.</a>
      <a class="on" href="note-credito-fornitore.html">NC forn.</a>
      <span class="sep">·</span>
      <a href="abbonamento.html">Abbonamento</a>
      <a href="index.html">← cambia azienda</a>
      <button id="logout">Esci</button>
    </div>
  </header>

  <div class="card" id="form-card" hidden>
    <h2 id="form-title" style="font-size:15px;margin:0 0 4px">Nuova nota di credito</h2>
    <div class="grid2">
      <div><label for="f-fornitore">Fornitore</label><select id="f-fornitore"></select></div>
      <div><label for="f-data">Data</label><input id="f-data" type="date"></div>
    </div>
    <label for="f-fattura">Fattura collegata (facoltativo)</label>
    <select id="f-fattura"><option value="">— nessuna —</option></select>

    <label>Righe</label>
    <table class="righe-table">
      <thead><tr><th>Codice</th><th>Descrizione</th><th>Qtà</th><th>Prezzo</th><th>IVA %</th><th></th></tr></thead>
      <tbody id="righe-body"></tbody>
    </table>
    <button class="linklike" id="add-riga" style="margin-top:8px">+ aggiungi riga</button>
    <p class="righe-total">Totale accreditato: <b id="righe-totale">0,00 €</b></p>

    <div class="form-actions">
      <button class="primary" id="f-save">Salva</button>
      <button class="ghost" id="f-cancel">Annulla</button>
    </div>
    <div class="msg" id="form-msg" hidden></div>
  </div>

  <div class="card">
    <div class="toolbar">
      <h2>Elenco</h2>
      <button class="primary" id="new-nc">+ Nuova nota di credito</button>
    </div>
    <div id="list-area"><p class="empty">Carico…</p></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
  window.SUPABASE_URL = 'https://rixvgmzedwdzgavjewbm.supabase.co';
  window.SUPABASE_ANON_KEY = 'sb_publishable_DFLcrBd6aiyyNGnCq41RQg_XrP0VR47';
</script>
<script src="app/store.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const store = window.SaasStore;
  let companyId = null;
  let editingId = null;
  let fornitoriById = {};
  let fatturePerFornitore = {};

  function today(){ return new Date().toISOString().slice(0, 10); }
  function esc(s){ return (s == null ? '' : String(s)).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function eur(n){ return (Number(n) || 0).toLocaleString('it-IT', { style:'currency', currency:'EUR' }); }
  function setMsg(text, kind){
    const el = $('form-msg');
    if(!text){ el.hidden = true; return; }
    el.textContent = text; el.className = 'msg ' + kind; el.hidden = false;
  }

  function rigaRowHtml(r){
    r = r || { cod:'', descr:'', qty:1, prezzo:0, iva:22 };
    return `<tr>
      <td><input class="r-cod" value="${esc(r.cod)}" placeholder="cod."></td>
      <td><input class="r-descr" value="${esc(r.descr)}" placeholder="descrizione"></td>
      <td style="width:70px"><input class="r-qty" type="number" min="0" step="1" value="${r.qty}"></td>
      <td style="width:90px"><input class="r-prezzo" type="number" min="0" step="0.01" value="${r.prezzo}"></td>
      <td style="width:70px"><input class="r-iva" type="number" min="0" step="1" value="${r.iva}"></td>
      <td class="rm"><button type="button" class="rm-riga" title="rimuovi riga">✕</button></td>
    </tr>`;
  }
  function addRigaRow(r){
    $('righe-body').insertAdjacentHTML('beforeend', rigaRowHtml(r));
    bindRigaRow($('righe-body').lastElementChild);
    updateTotale();
  }
  function bindRigaRow(tr){
    tr.querySelector('.rm-riga').addEventListener('click', () => { tr.remove(); updateTotale(); });
    tr.querySelectorAll('input').forEach(inp => inp.addEventListener('input', updateTotale));
  }
  function readRighe(){
    return [...$('righe-body').querySelectorAll('tr')].map(tr => ({
      cod: tr.querySelector('.r-cod').value.trim(),
      descr: tr.querySelector('.r-descr').value.trim(),
      qty: Number(tr.querySelector('.r-qty').value) || 0,
      prezzo: Number(tr.querySelector('.r-prezzo').value) || 0,
      iva: Number(tr.querySelector('.r-iva').value) || 0,
    })).filter(r => r.descr || r.cod);
  }
  function rigaTotale(r){ const imp = r.qty * r.prezzo; return imp + imp * r.iva / 100; }
  function docTotale(righe){ return (righe || []).reduce((s, r) => s + rigaTotale(r), 0); }
  function updateTotale(){ $('righe-totale').textContent = eur(docTotale(readRighe())); }
  $('add-riga').addEventListener('click', () => addRigaRow(null));

  function refreshFatturaOptions(fornitoreId){
    const fatture = fatturePerFornitore[fornitoreId] || [];
    $('f-fattura').innerHTML = '<option value="">— nessuna —</option>' +
      fatture.map(f => `<option value="${f.id}">${esc(f.num)}</option>`).join('');
  }
  $('f-fornitore').addEventListener('change', () => refreshFatturaOptions($('f-fornitore').value));
  $('f-fattura').addEventListener('change', () => {
    const righeVuote = readRighe().length === 0;
    const fattura = (fatturePerFornitore[$('f-fornitore').value] || []).find(f => f.id === $('f-fattura').value);
    if(fattura && righeVuote){
      $('righe-body').innerHTML = '';
      (fattura.righe || []).forEach(r => addRigaRow({ cod:r.cod, descr:r.descr, qty:r.qty, prezzo:r.prezzo || 0, iva:r.iva || 22 }));
    }
  });

  function openForm(nc){
    editingId = nc ? nc.id : null;
    $('form-title').textContent = nc ? `Modifica ${nc.num}` : 'Nuova nota di credito';
    $('f-fornitore').value = nc ? nc.fornitoreId : ($('f-fornitore').options[0] ? $('f-fornitore').options[0].value : '');
    refreshFatturaOptions($('f-fornitore').value);
    $('f-fattura').value = nc ? (nc.fatturaId || '') : '';
    $('f-data').value = nc ? nc.data : today();
    $('righe-body').innerHTML = '';
    (nc ? nc.righe : [null]).forEach(addRigaRow);
    setMsg('', '');
    $('form-card').hidden = false;
  }
  function closeForm(){ $('form-card').hidden = true; editingId = null; }
  $('new-nc').addEventListener('click', () => {
    if(Object.keys(fornitoriById).length === 0){ alert('Crea prima almeno un fornitore.'); return; }
    openForm(null);
  });
  $('f-cancel').addEventListener('click', closeForm);

  $('f-save').addEventListener('click', async () => {
    const fornitoreId = $('f-fornitore').value;
    const fatturaId = $('f-fattura').value || null;
    const data = $('f-data').value;
    const righe = readRighe();
    if(!fornitoreId){ setMsg('Seleziona un fornitore.', 'error'); return; }
    if(!data){ setMsg('Inserisci una data.', 'error'); return; }
    if(righe.length === 0){ setMsg('Aggiungi almeno una riga con una descrizione.', 'error'); return; }

    $('f-save').disabled = true;
    setMsg('', '');
    try{
      const doc = { fornitoreId, fatturaId, data, righe };
      if(editingId){
        doc.id = editingId;
      } else {
        const anno = Number(data.slice(0, 4));
        doc.num = await store.nextNumber(companyId, 'NCF', anno);
      }
      await store.saveDoc('noteCreditoFornitore', doc, companyId);
      closeForm();
      await renderList();
    }catch(err){
      setMsg(err.message || 'Errore imprevisto durante il salvataggio.', 'error');
    }finally{
      $('f-save').disabled = false;
    }
  });

  async function renderList(){
    const area = $('list-area');
    area.innerHTML = '<p class="empty">Carico…</p>';
    let elenco;
    try{
      elenco = await store.loadCollection('noteCreditoFornitore', companyId);
    }catch(err){
      area.innerHTML = `<p class="empty">Errore nel caricamento: ${esc(err.message)}</p>`;
      return;
    }
    if(elenco.length === 0){
      area.innerHTML = '<p class="empty">Nessuna nota di credito ancora. Crea prima un fornitore, poi aggiungine una con "+ Nuova nota di credito".</p>';
      return;
    }
    elenco.sort((a, b) => (b.num || '').localeCompare(a.num || '', 'it', { numeric:true }));
    area.innerHTML = `<table><thead><tr>
        <th>Numero</th><th>Data</th><th>Fornitore</th><th>Fattura</th><th>Importo</th><th></th>
      </tr></thead><tbody>${elenco.map(n => `
        <tr>
          <td class="num-col">${esc(n.num)}</td>
          <td>${n.data ? new Date(n.data).toLocaleDateString('it-IT') : '—'}</td>
          <td>${esc((fornitoriById[n.fornitoreId] || {}).nome) || '(fornitore non trovato)'}</td>
          <td>${n.fatturaId ? esc(fatturaNumById(n.fornitoreId, n.fatturaId)) : '—'}</td>
          <td class="num-col">${eur(docTotale(n.righe))}</td>
          <td class="actions">
            <button data-edit="${n.id}">Modifica</button>
            <button class="danger" data-del="${n.id}">Elimina</button>
          </td>
        </tr>`).join('')}</tbody></table>`;
    area.querySelectorAll('[data-edit]').forEach(btn => btn.addEventListener('click', () => {
      openForm(elenco.find(x => x.id === btn.dataset.edit));
    }));
    area.querySelectorAll('[data-del]').forEach(btn => btn.addEventListener('click', async () => {
      const n = elenco.find(x => x.id === btn.dataset.del);
      if(!confirm(`Eliminare la nota di credito ${n.num}? L'operazione non si può annullare.`)) return;
      try{
        await store.removeDoc('noteCreditoFornitore', n.id);
        await renderList();
      }catch(err){
        alert('Errore durante l\'eliminazione: ' + err.message);
      }
    }));
  }
  function fatturaNumById(fornitoreId, fatturaId){
    const f = (fatturePerFornitore[fornitoreId] || []).find(x => x.id === fatturaId);
    return f ? f.num : '?';
  }

  $('logout').addEventListener('click', async () => {
    await store.signOut();
    localStorage.removeItem('saas_company_id');
    localStorage.removeItem('saas_company_nome');
    location.href = 'index.html';
  });

  async function init(){
    const session = await store.getSession();
    if(!session){ location.href = 'index.html'; return; }
    companyId = localStorage.getItem('saas_company_id');
    if(!companyId){ location.href = 'index.html'; return; }
    $('company-eyebrow').textContent = localStorage.getItem('saas_company_nome') || 'Azienda';

    const [fornitori, fatture] = await Promise.all([
      store.loadCollection('fornitori', companyId),
      store.loadCollection('fattureFornitore', companyId),
    ]);
    fornitoriById = Object.fromEntries(fornitori.map(f => [f.id, f]));
    fatturePerFornitore = {};
    fatture.forEach(f => { (fatturePerFornitore[f.fornitoreId] = fatturePerFornitore[f.fornitoreId] || []).push(f); });
    $('f-fornitore').innerHTML = fornitori.map(f => `<option value="${f.id}">${esc(f.nome)}</option>`).join('');

    await renderList();
  }
  init();
</script>
</body>
</html>

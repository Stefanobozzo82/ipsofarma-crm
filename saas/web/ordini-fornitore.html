<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ordini fornitore — Gestionale</title>
<!-- Speculare a ordini.html, ma verso un fornitore invece che un cliente. -->
<script>(function(){try{if(localStorage.getItem('saas_theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<link rel="stylesheet" href="app/theme.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="app-main">
  <div class="page-head">
      <h2>Ordini fornitore</h2>
      <p class="sub">Ordini fornitore, con numerazione automatica.</p>
    </div>

  <div class="card" id="form-card" hidden>
    <button type="button" class="linklike back-link" id="f-back">← Torna all'elenco</button>
    <h3 id="form-title">Nuovo ordine</h3>
    <div class="grid2">
      <div><label for="f-fornitore">Fornitore</label><select id="f-fornitore"></select></div>
      <div><label for="f-data">Data</label><input id="f-data" type="date"></div>
    </div>

    <div class="prod-pick"><input id="prodq" autocomplete="off" placeholder="Cerca per codice o descrizione…"><div class="prod-sugg" id="prodsugg"></div></div>
    <label>Righe</label>
    <div class="table-scroll"><table class="righe-table">
      <thead><tr><th>Codice</th><th>Descrizione</th><th>Qtà</th><th>Prezzo</th><th>Sconto %</th><th>IVA %</th><th></th></tr></thead>
      <tbody id="righe-body"></tbody>
    </table></div>
    <button class="linklike" id="add-riga" style="margin-top:8px">+ aggiungi riga</button>
    <p class="righe-total">Totale: <b id="righe-totale">0,00 €</b></p>

    <div class="form-actions">
      <button class="primary" id="f-save">Salva</button>
      <button class="ghost" id="f-cancel">Annulla</button>
    </div>
    <div class="msg" id="form-msg" hidden></div>
  </div>

  <div class="card" id="email-card" hidden>
    <button type="button" class="linklike back-link" id="em-back">← Torna all'elenco</button>
    <h3 id="email-title">Invia ordine per email</h3>
    <div><label for="em-to">Destinatario (email fornitore)</label><input id="em-to" placeholder="email@fornitore.it"></div>
    <div><label for="em-su">Oggetto</label><input id="em-su"></div>
    <div><label for="em-body">Messaggio</label><textarea id="em-body" rows="10" style="width:100%;resize:vertical"></textarea></div>
    <p>L'email parte con il PDF dell'ordine già allegato.</p>
    <div class="form-actions">
      <button class="primary" id="em-send">✉ Invia ora</button>
      <button class="ghost" id="em-cancel">Annulla</button>
    </div>
    <div class="msg" id="email-msg" hidden></div>
  </div>

  <div class="card" id="list-card">
    <div class="toolbar">
      <h3>Elenco</h3>
      <div class="toolbar-right">
        <div class="search-box"><span class="si">⌕</span><input type="text" id="q" placeholder="Cerca per numero o fornitore…"></div>
        <button class="ghost" id="ai-import-btn">📎 Importa da PDF/foto (AI)</button>
        <input type="file" id="ai-import-file" accept="application/pdf,image/*" hidden>
        <button class="primary" id="new-ordine">+ Nuovo ordine</button>
      </div>
    </div>
    <p class="msg" id="ai-import-status" hidden></p>
    <div id="filter-area"></div>
    <div id="list-area"><p class="empty">Carico…</p></div>
  </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
  window.SUPABASE_URL = 'https://rixvgmzedwdzgavjewbm.supabase.co';
  window.SUPABASE_ANON_KEY = 'sb_publishable_DFLcrBd6aiyyNGnCq41RQg_XrP0VR47';
</script>
<script src="app/store.js"></script>
<script src="app/theme-mode.js"></script>
<script src="app/nav.js"></script>
<script src="app/resize.js"></script>
<script src="app/print.js"></script>
<script src="app/prodpicker.js"></script>
<script src="app/cascade.js"></script>
<script src="app/ai-import.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const store = window.SaasStore;
  let companyId = null;
  let company = {}; // dati azienda (companies), per l'intestazione di stampa/PDF
  let editingId = null;
  let editingOrder = null; // l'ordine in modifica, per non perdere qtyEv/emailSent al salvataggio (vedi f-save)

  function today(){ return new Date().toISOString().slice(0, 10); }
  function esc(s){ return (s == null ? '' : String(s)).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function eur(n){ return (Number(n) || 0).toLocaleString('it-IT', { style:'currency', currency:'EUR' }); }
  function setMsg(text, kind){
    const el = $('form-msg');
    if(!text){ el.hidden = true; return; }
    el.textContent = text; el.className = 'msg ' + kind; el.hidden = false;
  }
  // Stato di ricezione (qtyEv, aggiornato da fatture-fornitore.html quando
  // una fattura viene collegata a questo ordine) — calcolo condiviso con
  // ordini.html/"Consegnato" in app/cascade.js (SaasCascade.statoEvasione).
  function statoRicezione(o){ return window.SaasCascade.statoEvasione(o.righe, 'Ricevuto'); }

  // ---- ordinamento colonne: come nel gestionale originale — un clic
  // sull'intestazione ordina, un secondo clic inverte la direzione.
  let SORT = { key: 'num', dir: 'desc' };
  let Q = ''; // ricerca testuale sull'elenco, come Q nel gestionale originale
  let PICK = new Set(); // id selezionati con la spunta: i pulsanti azione di una riga compaiono solo se è spuntata
  let FFILT = { fornitore: '', from: '', to: '' }; // filtri sopra l'elenco, come FFILT nel gestionale originale
  function sortCmp(va, vb, dir){
    const mul = dir === 'asc' ? 1 : -1;
    if(typeof va === 'number' && typeof vb === 'number') return (va - vb) * mul;
    return String(va == null ? '' : va).localeCompare(String(vb == null ? '' : vb), 'it', { numeric:true }) * mul;
  }
  function sortVal(key, o){
    if(key === 'num') return o.num || '';
    if(key === 'data') return o.data || '';
    if(key === 'fornitore') return (fornitoriById[o.fornitoreId] || {}).nome || '';
    if(key === 'imponibile') return impTot(o.righe || []);
    if(key === 'iva') return ivaTot(o.righe || []);
    if(key === 'totale') return docTotale(o.righe || []);
    return '';
  }
  function th(key, label){
    const on = SORT.key === key, ar = on ? (SORT.dir === 'asc' ? ' ↑' : ' ↓') : '';
    return `<th class="thsort ${on ? 'on' : ''}" data-sort="${key}">${esc(label)}${ar}</th>`;
  }
  function setSort(key){
    if(SORT.key === key) SORT.dir = SORT.dir === 'asc' ? 'desc' : 'asc';
    else { SORT.key = key; SORT.dir = key === 'num' || key === 'data' ? 'desc' : 'asc'; }
    renderList();
  }

  // Ricerca testuale: come Q nel gestionale originale (num + nome fornitore).
  function matchesQuery(it){
    if(!Q) return true;
    const party = (fornitoriById[it.fornitoreId] || {}).nome || '';
    return (it.num || '').toLowerCase().includes(Q) || party.toLowerCase().includes(Q);
  }
  let searchTimer = null;
  $('q').addEventListener('input', () => {
    Q = $('q').value.trim().toLowerCase();
    clearTimeout(searchTimer);
    searchTimer = setTimeout(renderList, 200);
  });

  // ---- filtri: fornitore, intervallo date --------------------------------
  function matchesFilter(o){
    if(FFILT.fornitore && o.fornitoreId !== FFILT.fornitore) return false;
    if(FFILT.from && (o.data || '') < FFILT.from) return false;
    if(FFILT.to && (o.data || '') > FFILT.to) return false;
    return true;
  }
  function setFFilt(k, v){ FFILT[k] = v; renderList(); }
  function clearFFilt(){ FFILT = { fornitore:'', from:'', to:'' }; renderList(); }
  function renderFilterbar(){
    const active = FFILT.fornitore || FFILT.from || FFILT.to;
    const fornitoriArr = Object.values(fornitoriById).sort((a, b) => (a.nome || '').localeCompare(b.nome || '', 'it', { sensitivity:'base' }));
    const fopts = '<option value="">Tutti i fornitori</option>' +
      fornitoriArr.map(f => `<option value="${f.id}" ${FFILT.fornitore === f.id ? 'selected' : ''}>${esc(f.nome)}</option>`).join('');
    $('filter-area').innerHTML = `<div class="filterbar">
      <select id="ff-fornitore">${fopts}</select>
      <div class="fdate-group">
        <label class="fdate">Dal <input type="date" id="ff-from" value="${FFILT.from}"></label>
        <label class="fdate">Al <input type="date" id="ff-to" value="${FFILT.to}"></label>
      </div>
      ${active ? '<button type="button" class="ffclear" id="ff-clear">✕ Azzera filtri</button>' : ''}
    </div>`;
    $('ff-fornitore').addEventListener('change', () => setFFilt('fornitore', $('ff-fornitore').value));
    $('ff-from').addEventListener('change', () => setFFilt('from', $('ff-from').value));
    $('ff-to').addEventListener('change', () => setFFilt('to', $('ff-to').value));
    if(active) $('ff-clear').addEventListener('click', clearFFilt);
  }

  function rigaRowHtml(r){
    r = r || { cod:'', descr:'', qty:1, prezzo:0, sconto:'', iva:22 };
    return `<tr>
      <td><div class="prod-pick"><input class="r-cod" value="${esc(r.cod)}" placeholder="cod." autocomplete="off"><div class="prod-sugg"></div></div>${r.catalogMatch ? window.SaasAiImport.catalogBadgeHtml(r.catalogMatch) : ''}</td>
      <td><input class="r-descr" value="${esc(r.descr)}" placeholder="descrizione"></td>
      <td style="width:70px"><input class="r-qty" type="number" min="0" step="1" value="${r.qty}"></td>
      <td style="width:90px"><input class="r-prezzo" type="number" min="0" step="0.01" value="${r.prezzo}"></td>
      <td style="width:70px"><input class="r-sconto" type="text" inputmode="decimal" value="${esc(r.sconto || '')}" placeholder="0"></td>
      <td style="width:70px"><input class="r-iva" type="number" min="0" step="1" value="${r.iva}"></td>
      <td class="rm"><button type="button" class="rm-riga" title="rimuovi riga">✕</button></td>
    </tr>`;
  }
  function addRigaRow(r){
    $('righe-body').insertAdjacentHTML('beforeend', rigaRowHtml(r));
    bindRigaRow($('righe-body').lastElementChild);
    updateTotale();
  }
  function bindRigaRow(tr){
    tr.querySelector('.rm-riga').addEventListener('click', () => { tr.remove(); updateTotale(); });
    tr.querySelectorAll('input').forEach(inp => inp.addEventListener('input', updateTotale));
    // Stesso autocompletamento della barra di ricerca sopra la tabella, ma
    // dentro il campo "Codice" della riga stessa: scegliendo un prodotto
    // riempie questa riga invece di aggiungerne una nuova.
    window.SaasProdPicker.attach(tr.querySelector('.r-cod'), tr.querySelector('.prod-sugg'), {
      companyId, priceField: 'listinoAcq', clearOnPick: false,
      onPick: p => {
        tr.querySelector('.r-cod').value = p.cod;
        tr.querySelector('.r-descr').value = p.descr;
        tr.querySelector('.r-prezzo').value = p.listinoAcq || 0;
        tr.querySelector('.r-iva').value = p.iva || 22;
        const qtyEl = tr.querySelector('.r-qty');
        if (!Number(qtyEl.value)) qtyEl.value = 1;
        updateTotale();
        qtyEl.focus(); qtyEl.select();
      },
    });
  }
  function readRighe(){
    return [...$('righe-body').querySelectorAll('tr')].map(tr => ({
      cod: tr.querySelector('.r-cod').value.trim(),
      descr: tr.querySelector('.r-descr').value.trim(),
      qty: Number(tr.querySelector('.r-qty').value) || 0,
      prezzo: Number(tr.querySelector('.r-prezzo').value) || 0,
      sconto: tr.querySelector('.r-sconto').value.trim(),
      iva: Number(tr.querySelector('.r-iva').value) || 0,
    })).filter(r => r.descr || r.cod);
  }
  // Stessa aritmetica dello sconto del gestionale originale, cascata
  // "N+M" inclusa (es. "50+15" = 50% e poi un altro 15% sul residuo).
  function scParts(s){ return String(s == null ? '' : s).split('+').map(x => parseFloat(String(x).trim()) || 0); }
  function scFactor(s){ return scParts(s).reduce((f, p) => f * (1 - p / 100), 1); }
  function rigaTotale(r){ const imp = r.qty * r.prezzo * scFactor(r.sconto); return imp + imp * r.iva / 100; }
  function docTotale(righe){ return (righe || []).reduce((s, r) => s + rigaTotale(r), 0); }
  // Imponibile e IVA come colonne a sé nell'elenco, come nel gestionale
  // originale (non solo il Totale già scontato/con IVA inclusa).
  function impTot(righe){ return (righe || []).reduce((s, r) => s + r.qty * r.prezzo * scFactor(r.sconto), 0); }
  function ivaTot(righe){ return (righe || []).reduce((s, r) => s + r.qty * r.prezzo * scFactor(r.sconto) * (r.iva || 0) / 100, 0); }
  function updateTotale(){ $('righe-totale').textContent = eur(docTotale(readRighe())); }
  $('add-riga').addEventListener('click', () => addRigaRow(null));

  function openForm(ordine){
    editingId = ordine ? ordine.id : null;
    editingOrder = ordine;
    $('form-title').textContent = ordine ? `Modifica ${ordine.num}` : 'Nuovo ordine';
    $('f-fornitore').value = ordine ? ordine.fornitoreId : ($('f-fornitore').options[0] ? $('f-fornitore').options[0].value : '');
    $('f-data').value = ordine ? ordine.data : today();
    $('righe-body').innerHTML = '';
    (ordine ? ordine.righe : [null]).forEach(addRigaRow);
    setMsg('', '');
    $('form-card').hidden = false;
    $('list-card').hidden = true;
  }
  function closeForm(){ $('form-card').hidden = true; $('list-card').hidden = false; editingId = null; editingOrder = null; }

  // ---- invio ordine per email al fornitore -------------------------------
  // Stesso schema di openOFEmail/ofEmailSend in index.html, ma con la
  // chiave Resend lato server (send-email, Fase 6 ter) invece dello script
  // Google Apps Script per-azienda dell'originale.
  let emailingItem = null;
  function ofEmailBody(o, forn, az){
    const set = az.settings || {};
    const lines = (o.righe || []).map(r => `- ${r.descr}  —  ${eur(r.prezzo)}`).join('\n');
    return `Spett.le ${forn.nome || ''},\n\ncon la presente trasmettiamo il nostro ordine n. ${o.num} del ${o.data ? new Date(o.data).toLocaleDateString('it-IT') : ''}:\n\n${lines}\n\nTotale ordine (IVA inclusa): ${eur(docTotale(o.righe))}\n\nCordiali saluti,\n${az.nome || ''}${set.tel ? '\nTel ' + set.tel : ''}${set.email ? '\n' + set.email : ''}`;
  }
  function openEmailForm(o){
    emailingItem = o;
    const forn = fornitoriById[o.fornitoreId] || {};
    $('email-title').textContent = `Invia ordine ${o.num} per email`;
    $('em-to').value = forn.email || '';
    $('em-su').value = `Ordine ${o.num} - ${company.nome || ''}`;
    $('em-body').value = ofEmailBody(o, forn, company);
    $('email-msg').hidden = true;
    $('email-card').hidden = false;
    $('list-card').hidden = true;
  }
  function closeEmailForm(){ $('email-card').hidden = true; $('list-card').hidden = false; emailingItem = null; }
  $('em-back').addEventListener('click', closeEmailForm);
  $('em-cancel').addEventListener('click', closeEmailForm);
  function setEmailMsg(text, kind){
    const el = $('email-msg');
    if(!text){ el.hidden = true; return; }
    el.textContent = text; el.className = 'msg ' + kind; el.hidden = false;
  }
  $('em-send').addEventListener('click', async () => {
    if(!emailingItem) return;
    const to = $('em-to').value.trim();
    const su = $('em-su').value || '';
    const bodyText = $('em-body').value || '';
    if(!to || to.indexOf('@') < 0){ setEmailMsg('Inserisci un\'email valida.', 'error'); return; }
    $('em-send').disabled = true;
    setEmailMsg('', '');
    try{
      const pdfB64 = await window.SaasPrint.pdfBase64('ordiniFornitore', emailingItem, fornitoriById[emailingItem.fornitoreId], company);
      const filename = 'Ordine_' + String(emailingItem.num).replace(/\//g, '-') + '.pdf';
      // fromName/replyTo: il mittente resta unico per tutto il SaaS (un
      // solo account Resend), ma il destinatario vede il nome di QUESTA
      // azienda come mittente e, se risponde, la mail arriva a lei — non
      // alla piattaforma. Vedi la nota in send-email/index.ts.
      await store.sendEmail({ to, subject: su, html: '<pre style="font:inherit;white-space:pre-wrap">' + esc(bodyText) + '</pre>', attachmentBase64: pdfB64, attachmentFilename: filename, fromName: company.nome, replyTo: (company.settings || {}).email });
      // Traccia l'invio in "extra" (ordiniFornitore ha hasExtra:true, non
      // serve nessuna nuova colonna) — così l'elenco può mostrare "inviato",
      // come emailSent nel gestionale originale.
      const saved = await store.saveDoc('ordiniFornitore', Object.assign({}, emailingItem, { emailSent: new Date().toISOString() }), companyId);
      emailingItem = saved;
      setEmailMsg('Ordine inviato a ' + to + '.', 'ok');
    }catch(err){
      setEmailMsg(err.message || 'Invio non riuscito.', 'error');
    }finally{
      $('em-send').disabled = false;
    }
  });
  $('new-ordine').addEventListener('click', async () => {
    if($('f-fornitore').options.length === 0){ alert('Crea prima almeno un fornitore.'); return; }
    const lim = await store.checkDocLimit(companyId);
    if(!lim.ok){ alert(`Hai raggiunto il limite di ${lim.limite} documenti/mese del piano "${lim.piano}". Passa a un piano superiore in Impostazioni → Abbonamento per continuare.`); return; }
    openForm(null);
  });
  $('f-cancel').addEventListener('click', closeForm);
  $('f-back').addEventListener('click', closeForm);

  // ---- importa ordine fornitore da PDF/foto con l'AI ------------------------
  // Utile per digitalizzare una lista di riordino scritta a mano o un
  // preventivo ricevuto dal fornitore, invece di ricopiare riga per riga —
  // stesso meccanismo di fatture-fornitore.html (vedi app/ai-import.js).
  function aiImportStatus(text, kind){
    const el = $('ai-import-status');
    if(!text){ el.hidden = true; return; }
    el.textContent = text; el.className = 'msg ' + (kind || 'info'); el.hidden = false;
  }
  const AI_IMPORT_INSTR = "Nel documento allegato c'è un ORDINE da inviare (o già inviato) a un FORNITORE — una lista di prodotti da ordinare, oppure un preventivo del fornitore da cui creare l'ordine. Restituisci SOLO un oggetto JSON (nient'altro, niente backtick), con questi campi: fornitore (ragione sociale del fornitore a cui è indirizzato l'ordine), data (formato AAAA-MM-GG, oggi se non indicata), righe: un array, per ogni riga cod (codice articolo alfanumerico, se presente altrimenti stringa vuota), descr (descrizione), qty (quantità, numero), prezzo (prezzo unitario, numero, 0 se non indicato), sconto (percentuali di sconto a cascata unite da '+', es. \"50+15\", stringa vuota se non c'è sconto), iva (aliquota IVA, numero, 22 se non indicata).";
  $('ai-import-btn').addEventListener('click', () => $('ai-import-file').click());
  $('ai-import-file').addEventListener('change', async () => {
    const file = $('ai-import-file').files[0];
    $('ai-import-file').value = '';
    if(!file) return;
    aiImportStatus('Sto leggendo ' + file.name + ' con l\'AI…', 'info');
    try{
      const p = await window.SaasAiImport.extractFromFile(store, file, {
        systemPrompt: "Sei l'assistente di un gestionale per la distribuzione di dispositivi medici. Rispondi sempre e solo con JSON valido, mai testo libero, mai backtick.",
        instr: AI_IMPORT_INSTR,
      });
      if(!p.righe){ throw new Error('l\'AI non ha riconosciuto un ordine fornitore in questo file'); }

      openForm(null);
      const match = window.SaasAiImport.findPartyByNome(Object.values(fornitoriById), p.fornitore);
      if(match) $('f-fornitore').value = match.id;
      $('f-data').value = /^\d{4}-\d{2}-\d{2}$/.test(p.data || '') ? p.data : today();
      $('righe-body').innerHTML = '';
      const righeGrezze = (Array.isArray(p.righe) ? p.righe : []).map(r => ({
        cod: String(r.cod || '').trim(), descr: String(r.descr || '').trim(),
        qty: Math.max(1, parseInt(r.qty) || 1),
        prezzo: r.prezzo != null && r.prezzo !== '' ? parseFloat(r.prezzo) || 0 : 0,
        sconto: String(r.sconto || '').replace(/\s/g, ''),
        iva: r.iva != null && r.iva !== '' ? parseFloat(r.iva) : 22,
      }));
      // Punto 5: verifica incrociata col catalogo prima di mostrare le righe.
      const righe = await window.SaasAiImport.crossCheckRighe(store, companyId, righeGrezze);
      (righe.length ? righe : [null]).forEach(addRigaRow);
      const daVerificare = righe.filter(r => r.catalogMatch === 'unmatched').length;
      aiImportStatus(
        (match
          ? `Letto con l'AI: fornitore riconosciuto come "${match.nome}".`
          : `Letto con l'AI, ma nessun fornitore corrisponde a "${p.fornitore || '?'}": scegline uno dall'elenco prima di salvare (o creane uno nuovo in Fornitori).`)
        + (daVerificare ? ` ${daVerificare} riga/e non trovate a catalogo, da controllare.` : ' Righe verificate col catalogo.'),
        match && !daVerificare ? 'ok' : (match ? 'info' : 'error')
      );
    }catch(err){
      aiImportStatus('Lettura non riuscita: ' + (err.message || err), 'error');
    }
  });

  $('f-save').addEventListener('click', async () => {
    const fornitoreId = $('f-fornitore').value;
    const data = $('f-data').value;
    const righe = readRighe();
    if(!fornitoreId){ setMsg('Seleziona un fornitore.', 'error'); return; }
    if(!data){ setMsg('Inserisci una data.', 'error'); return; }
    if(righe.length === 0){ setMsg('Aggiungi almeno una riga con una descrizione.', 'error'); return; }
    if(!editingId){
      const lim = await store.checkDocLimit(companyId);
      if(!lim.ok){ setMsg(`Hai raggiunto il limite di ${lim.limite} documenti/mese del piano "${lim.piano}". Passa a un piano superiore in Impostazioni → Abbonamento per continuare.`, 'error'); return; }
    }

    $('f-save').disabled = true;
    setMsg('', '');
    try{
      // Stessa cautela di ordini.html/generaOF(): l'editor delle righe non
      // conosce qtyEv (quanto già ricevuto, aggiornato da
      // fatture-fornitore.html) — senza questo passaggio, salvare una
      // modifica lo resetterebbe silenziosamente a "niente ricevuto".
      let righeFinal = righe;
      if(editingOrder){
        const qtyEvByCod = {};
        (editingOrder.righe || []).forEach(r => { if(r.qtyEv) (qtyEvByCod[r.cod] = qtyEvByCod[r.cod] || []).push(r.qtyEv); });
        righeFinal = righe.map(r => {
          const queue = qtyEvByCod[r.cod];
          return (queue && queue.length) ? Object.assign({}, r, { qtyEv: Math.min(r.qty, queue.shift()) }) : r;
        });
      }
      // Idem per ocId/emailSent (extra, non nel form): si parte
      // dall'ordine esistente invece che da un oggetto vuoto.
      const doc = editingOrder ? Object.assign({}, editingOrder, { fornitoreId, data, righe: righeFinal }) : { fornitoreId, data, righe: righeFinal };
      if(editingId){
        doc.id = editingId;
      } else {
        const anno = Number(data.slice(0, 4));
        doc.num = await store.nextNumber(companyId, 'OF', anno);
      }
      await store.saveDoc('ordiniFornitore', doc, companyId);
      closeForm();
      await renderList();
    }catch(err){
      setMsg(err.message || 'Errore imprevisto durante il salvataggio.', 'error');
    }finally{
      $('f-save').disabled = false;
    }
  });

  let fornitoriById = {};

  async function renderList(){
    renderFilterbar();
    const area = $('list-area');
    area.innerHTML = '<p class="empty">Carico…</p>';
    let ordini;
    try{
      ordini = await store.loadCollection('ordiniFornitore', companyId);
    }catch(err){
      area.innerHTML = `<p class="empty">Errore nel caricamento: ${esc(err.message)}</p>`;
      return;
    }
    if(ordini.length === 0){
      area.innerHTML = '<p class="empty">Nessun ordine ancora. Crea prima un fornitore, poi aggiungi un ordine con "+ Nuovo ordine".</p>';
      return;
    }
    ordini = ordini.filter(matchesQuery).filter(matchesFilter);
    if(ordini.length === 0){
      area.innerHTML = '<p class="empty">Nessun ordine trovato con questi criteri.</p>';
      return;
    }
    ordini.sort((a, b) => sortCmp(sortVal(SORT.key, a), sortVal(SORT.key, b), SORT.dir));
    const allChecked = ordini.length > 0 && ordini.every(o => PICK.has(o.id));
    area.innerHTML = `<div class="table-scroll"><table><thead><tr>
        <th class="check-col"><input type="checkbox" id="check-all" ${allChecked ? 'checked' : ''}></th>
        ${th('num','Numero')}${th('data','Data')}${th('fornitore','Fornitore')}${th('imponibile','Imponibile')}${th('iva','IVA')}${th('totale','Totale')}<th></th>
      </tr></thead><tbody>${ordini.map(o => `
        <tr class="row-click" data-id="${o.id}">
          <td class="check-col"><input type="checkbox" class="row-check" data-id="${o.id}" ${PICK.has(o.id) ? 'checked' : ''}></td>
          <td class="num-col">${esc(o.num)}${statoRicezione(o) ? ` <span class="badge ${statoRicezione(o).cls}">${statoRicezione(o).label}</span>` : ''}</td>
          <td>${o.data ? new Date(o.data).toLocaleDateString('it-IT') : '—'}</td>
          <td>${esc((fornitoriById[o.fornitoreId] || {}).nome) || '(fornitore non trovato)'}</td>
          <td class="num-col">${eur(impTot(o.righe || []))}</td>
          <td class="num-col">${eur(ivaTot(o.righe || []))}</td>
          <td class="num-col">${eur(docTotale(o.righe || []))}</td>
          <td class="actions">${PICK.has(o.id) ? `
            <button data-print="${o.id}" title="Stampa">🖨</button><button data-pdf="${o.id}" title="Scarica PDF">⬇ PDF</button>
            <button data-email="${o.id}" title="${o.emailSent ? 'Già inviato il ' + new Date(o.emailSent).toLocaleDateString('it-IT') : 'Invia per email'}">${o.emailSent ? '✓ Inviato' : '✉ Email'}</button>
            <button data-edit="${o.id}">Modifica</button>
            <button class="danger" data-del="${o.id}">Elimina</button>` : ''}
          </td>
        </tr>`).join('')}</tbody></table></div>`;
    window.SaasResize.makeColsResizable(area.querySelector('table'), 'ordini-fornitore-elenco');
    $('check-all').addEventListener('click', e => {
      e.stopPropagation();
      if(e.target.checked) ordini.forEach(o => PICK.add(o.id));
      else ordini.forEach(o => PICK.delete(o.id));
      renderList();
    });
    area.querySelectorAll('.row-check').forEach(ch => ch.addEventListener('click', e => {
      e.stopPropagation();
      if(e.target.checked) PICK.add(ch.dataset.id); else PICK.delete(ch.dataset.id);
      renderList();
    }));
    area.querySelectorAll('[data-sort]').forEach(th => th.addEventListener('click', () => setSort(th.dataset.sort)));
    area.querySelectorAll('[data-edit]').forEach(btn => btn.addEventListener('click', () => {
      openForm(ordini.find(x => x.id === btn.dataset.edit));
    }));
    area.querySelectorAll('tbody tr[data-id]').forEach(tr => tr.addEventListener('click', e => {
      if(e.target.closest('button, input, a, select')) return; // non aprire se il clic è su un pulsante/checkbox della riga
      openForm(ordini.find(x => x.id === tr.dataset.id));
    }));
    area.querySelectorAll('[data-print]').forEach(btn => btn.addEventListener('click', () => {
      const it = ordini.find(x => x.id === btn.dataset.print);
      window.SaasPrint.openPrintWindow('ordiniFornitore', it, fornitoriById[it.fornitoreId], company);
    }));
    area.querySelectorAll('[data-pdf]').forEach(btn => btn.addEventListener('click', async () => {
      const it = ordini.find(x => x.id === btn.dataset.pdf);
      btn.disabled = true;
      try{
        await window.SaasPrint.downloadPDF('ordiniFornitore', it, fornitoriById[it.fornitoreId], company);
      }catch(err){
        alert('Errore durante la generazione del PDF: ' + (err.message || err));
      }finally{
        btn.disabled = false;
      }
    }));
    area.querySelectorAll('[data-email]').forEach(btn => btn.addEventListener('click', () => {
      openEmailForm(ordini.find(x => x.id === btn.dataset.email));
    }));
    area.querySelectorAll('[data-del]').forEach(btn => btn.addEventListener('click', async () => {
      const o = ordini.find(x => x.id === btn.dataset.del);
      if(!confirm(`Eliminare l'ordine ${o.num}? L'operazione non si può annullare.`)) return;
      try{
        await store.removeDoc('ordiniFornitore', o.id);
        await renderList();
      }catch(err){
        alert('Errore durante l\'eliminazione: ' + err.message);
      }
    }));
  }

  async function doLogout(){
    await store.signOut();
    localStorage.removeItem('saas_company_id');
    localStorage.removeItem('saas_company_nome');
    location.href = 'index.html';
  }

  async function init(){
    const session = await store.getSession();
    if(!session){ location.href = 'index.html'; return; }
    companyId = localStorage.getItem('saas_company_id');
    if(!companyId){ location.href = 'index.html'; return; }
    try{ company = await store.getCompany(companyId); }catch(e){ company = {}; } // niente PDF/stampa senza dati azienda? non deve comunque bloccare la pagina
    window.SaasNav.render('ordini-fornitore', {
      companyName: localStorage.getItem('saas_company_nome') || 'Azienda',
      email: session.user.email,
      onLogout: doLogout,
    });

    const fornitori = await store.loadCollection('fornitori', companyId);
    fornitoriById = Object.fromEntries(fornitori.map(f => [f.id, f]));
    $('f-fornitore').innerHTML = fornitori.map(f => `<option value="${f.id}">${esc(f.nome)}</option>`).join('');

    window.SaasProdPicker.attach($('prodq'), $('prodsugg'), {
      companyId, priceField: 'listinoAcq',
      onPick: p => addRigaRow({ cod: p.cod, descr: p.descr, qty: 1, prezzo: p.listinoAcq || 0, sconto: '', iva: p.iva || 22 }),
    });

    await renderList();
  }
  init();
</script>
</body>
</html>

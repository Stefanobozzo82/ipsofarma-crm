<!--
  Secondo modulo reale del gestionale collegato a Supabase, dopo clienti.html.
  A differenza delle anagrafiche, un ordine è un DOCUMENTO NUMERATO: qui la
  numerazione passa per store.nextNumber(), che a differenza di nextNum() nel
  gestionale attuale è una vera chiamata di rete (asincrona) — è la parte
  nuova che questo modulo prova, non solo lettura/scrittura come clienti.html.

  Il form delle righe è volutamente un sottoinsieme di quello vero (manca
  sconto, lotto, scadenza...): l'obiettivo di questo passaggio è provare il
  meccanismo (numerazione + righe + collegamento a un cliente), non ancora
  arrivare alla parità completa dei campi con il gestionale attuale.
-->
<script>(function(){try{if(localStorage.getItem('saas_theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<link rel="stylesheet" href="app/theme.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="app-main">
  <div class="page-head">
      <h2>Ordini cliente</h2>
      <p class="sub">Ordini cliente, con numerazione automatica (modificabile a mano).</p>
    </div>

  <div class="card" id="form-card" hidden>
    <button type="button" class="linklike back-link" id="f-back">← Torna all'elenco</button>
    <h3 id="form-title">Nuovo ordine</h3>
    <label for="f-cliente">Cliente</label>
    <select id="f-cliente"></select>
    <div id="f-dest-wrap"><label for="f-dest">Destinazione di consegna</label><select id="f-dest"></select></div>
    <div class="grid2">
      <div><label for="f-num">Numero ordine</label><input id="f-num" type="text" placeholder="es. OC/2026/0001"></div>
      <div><label for="f-data">Data</label><input id="f-data" type="date"></div>
    </div>
    <div class="form-actions" id="oc-cascade-actions" hidden style="margin:0 0 14px">
      <button type="button" class="primary" id="oc-btn-ddt">→ Genera DDT</button>
      <button type="button" class="primary" id="oc-btn-of">→ Genera ordine fornitore</button>
    </div>

    <div class="prod-pick"><input id="prodq" autocomplete="off" placeholder="Cerca per codice o descrizione…"><div class="prod-sugg" id="prodsugg"></div></div>
    <label>Righe</label>
    <div class="table-scroll"><table class="righe-table">
      <thead><tr><th class="drag-col"></th><th>Codice</th><th>Descrizione</th><th>Qtà</th><th>Prezzo</th><th>Sconto %</th><th>IVA %</th><th></th></tr></thead>
      <tbody id="righe-body"></tbody>
    </table></div>
    <button class="linklike" id="add-riga" style="margin-top:8px">+ aggiungi riga</button>
    <p class="righe-total">Totale: <b id="righe-totale">0,00 €</b></p>

    <div class="panel" id="f-lineage-panel" hidden style="margin:16px 0"><div class="panel-h">Documenti collegati</div><div id="f-lineage"></div></div>

    <div class="form-actions">
      <button class="primary" id="f-save">Salva</button>
      <button class="ghost" id="f-cancel">Annulla</button>
    </div>
    <div class="msg" id="form-msg" hidden></div>
  </div>

  <div class="card" id="list-card">
    <div class="toolbar">
      <h3>Elenco</h3>
      <div class="toolbar-right">
        <div class="search-box"><span class="si">⌕</span><input type="text" id="q" placeholder="Cerca per numero o cliente…"></div>
        <button class="ghost" id="ai-import-btn">📎 Importa da PDF/foto (AI)</button>
        <input type="file" id="ai-import-file" accept="application/pdf,image/*" hidden>
        <button class="primary" id="new-ordine">+ Nuovo ordine</button>
      </div>
    </div>
    <p class="msg" id="ai-import-status" hidden></p>
    <div id="filter-area"></div>
    <div id="list-area"><p class="empty">Carico…</p></div>
  </div>
  </main>
</div>

<script>
  const $ = id => document.getElementById(id);
  const store = window.SaasStore;
  let companyId = null;
  let company = {}; // dati azienda (companies), per l'intestazione di stampa/PDF
  let editingId = null;
  let editingOrder = null; // l'ordine in modifica, per non perdere qtyEv al salvataggio (vedi f-save)
  let clientiById = {};
  // Storico prezzi per lastClientPrice() qui sotto — caricato una volta
  // all'apertura della pagina (init), non ad ogni ricerca prodotto.
  let STORICO_PREZZI = { fattureCliente: [], ddt: [], ordiniCliente: [] };
  let SORT = { key: 'num', dir: 'desc' };
  let Q = ''; // ricerca testuale sull'elenco, come Q nel gestionale originale
  let PICK = new Set(); // id selezionati con la spunta: i pulsanti azione di una riga compaiono solo se è spuntata
  // Ultimo elenco scaricato da renderList() — usato da renderResults() per
  // ridisegnare senza rifare la query di rete quando cambia solo COME viene
  // mostrato (spunta, ordinamento, filtri, ricerca), non cosa contiene: vedi
  // il commento sopra renderResults() più sotto.
  let ORDINI_ALL = [];
  // FFILT.stato viene precompilato da ?stato=aperti nell'URL (link "Prodotti
  // da evadere" della dashboard, vedi dashboard.html): senza, l'elenco apriva
  // sempre su TUTTI gli ordini invece che solo quelli ancora da evadere.
  let FFILT = { cliente: '', stato: '', from: '', to: '' }; // filtri sopra l'elenco, come FFILT nel gestionale originale

  function today(){ return new Date().toISOString().slice(0, 10); }
  function esc(s){ return (s == null ? '' : String(s)).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function eur(n){ return (Number(n) || 0).toLocaleString('it-IT', { style:'currency', currency:'EUR' }); }
  // Sottotitolo "📍 destinazione" sotto il nome del cliente in elenco —
  // stessa funzione di ddt.html/fatture.html.
  function destSub(it){
    const cliente = clientiById[it.clienteId];
    const dest = (it.destId && cliente && cliente.dest) ? cliente.dest.find(d => d.id === it.destId) : null;
    return dest ? `<div style="font-size:11px;color:var(--faint);margin-top:1px">📍 ${esc(dest.nome || dest.citta || 'Sede')}</div>` : '';
  }
  // Le destinazioni di consegna sono gestite in clienti.html (CDEST): qui
  // si sceglie solo quale usare per QUESTO ordine, tra quelle già
  // registrate per il cliente selezionato — richiesta reale: "nel vecchio
  // gestionale quando inserivo un ordine potevo scegliere anche la sede di
  // destinazione [...] come era fatto nel vecchio gestionale" (ddt.html/
  // fatture.html avevano già questo campo, ordini.html no — la stessa
  // funzione, portata qui). "Sede legale" resta il default se il cliente
  // non ne ha di aggiuntive.
  function refreshDestOptions(clienteId){
    const cliente = clientiById[clienteId];
    const dest = (cliente && cliente.dest) || [];
    $('f-dest-wrap').hidden = dest.length === 0;
    // Ordine alfabetico sull'etichetta mostrata (nome, o città se manca) —
    // richiesto di seguito diretto dopo il fix dei menu cliente/fornitore:
    // qui il vecchio gestionale non ordinava (le destinazioni restavano
    // nell'ordine in cui erano state registrate sul cliente), ma per
    // questo menu è stato chiesto esplicitamente l'ordine alfabetico.
    const destSorted = [...dest].sort((a, b) => (a.nome || a.citta || '').localeCompare(b.nome || b.citta || '', 'it', { sensitivity:'base' }));
    $('f-dest').innerHTML = '<option value="">Sede legale</option>' +
      destSorted.map(d => `<option value="${d.id}">${esc(d.nome || d.citta || 'Sede')}</option>`).join('');
  }
  // Ultimo prezzo VENDUTO A QUESTO CLIENTE per un prodotto — porta diretta
  // di lastLinePrice()/lastClientPrice() nel vecchio gestionale: cerca
  // nelle fatture cliente, nei DDT e negli altri ordini DI QUEL CLIENTE la
  // riga più recente con lo stesso codice (per data documento, non per
  // ordine di caricamento) e ne riusa prezzo/sconto. Richiesta reale: "nel
  // vecchio gestionale c'era una bella funzione [...] quando inserivo un
  // ordine cliente metteva in automatico l'ultimo prezzo venduto a quel
  // cliente" — STORICO_PREZZI è caricato una volta in init(), non ad ogni
  // ricerca prodotto.
  function lastClientPrice(clienteId, cod){
    if(!clienteId || !cod) return null;
    let best = null;
    ['fattureCliente', 'ddt', 'ordiniCliente'].forEach(coll => {
      (STORICO_PREZZI[coll] || []).forEach(d => {
        if(d.clienteId !== clienteId) return;
        const r = (d.righe || []).find(x => x.cod === cod);
        if(r && r.prezzo != null && (!best || String(d.data) > String(best.data))){
          best = { data: d.data, prezzo: r.prezzo, sconto: r.sconto || '' };
        }
      });
    });
    return best;
  }
  // Storico degli ultimi prezzi (fino a 5) venduti a QUESTO cliente per un
  // prodotto — porta di priceHistory()/clientPriceHistory() nel vecchio
  // gestionale: stessa fonte di lastClientPrice() qui sopra, ma l'elenco
  // intero invece di solo il più recente — per il tooltip al passaggio del
  // mouse sul codice (vedi app/prodpicker.js).
  function clientPriceHistory(clienteId, cod, limit){
    if(!clienteId || !cod) return [];
    const out = [];
    ['fattureCliente', 'ddt', 'ordiniCliente'].forEach(coll => {
      (STORICO_PREZZI[coll] || []).forEach(d => {
        if(d.clienteId !== clienteId) return;
        const r = (d.righe || []).find(x => x.cod === cod);
        if(r && r.prezzo != null) out.push({ data: d.data, prezzo: r.prezzo, sconto: r.sconto || '', num: d.num });
      });
    });
    out.sort((a, b) => String(b.data).localeCompare(String(a.data)));
    return out.slice(0, limit || 5);
  }
  // priceHistory(cod) per SaasProdPicker.attach() qui sotto e in
  // bindRigaRow() — legge il cliente selezionato AL MOMENTO del passaggio
  // del mouse, non quando la pagina si è aperta (può essere cambiato nel
  // frattempo).
  function priceHistoryForForm(cod){
    const cliId = $('f-cliente').value;
    const cli = clientiById[cliId];
    return {
      title: cli && cli.nome ? 'Ultimi prezzi a ' + cli.nome : 'Ultimi prezzi al cliente',
      rows: cliId ? clientPriceHistory(cliId, cod, 5) : [],
    };
  }
  // Il badge "ultimo prezzo" (vedi rigaRowHtml()) sparisce se l'utente
  // tocca prezzo o sconto a mano — segno che sta scegliendo un prezzo
  // diverso da quello ripreso in automatico, stesso comportamento di
  // updR() nel vecchio gestionale ("_man=true; _last=false" quando si
  // modifica prezzo/sconto a mano).
  function clearLastBadge(tr){
    delete tr.dataset.last;
    const badge = tr.querySelector('.lastp');
    if(badge) badge.remove();
  }
  // Cambiare cliente A FORM GIÀ APERTO riprezza le righe ancora col badge
  // "ultimo prezzo" (non toccate a mano) per il nuovo cliente — porta di
  // repriceForClient()/onClientePick() nel vecchio gestionale. Senza uno
  // storico per il nuovo cliente torna al prezzo di listino (una ricerca
  // per codice esatto, come l'originale: mai lasciare il prezzo pensato
  // per un ALTRO cliente).
  async function repriceForClient(clienteId){
    const rows = [...$('righe-body').querySelectorAll('tr')].filter(tr => tr.dataset.last === '1' && tr.querySelector('.r-cod').value.trim());
    for(const tr of rows){
      const cod = tr.querySelector('.r-cod').value.trim();
      const last = lastClientPrice(clienteId, cod);
      if(last){
        tr.querySelector('.r-prezzo').value = last.prezzo;
        tr.querySelector('.r-sconto').value = last.sconto || '';
        continue;
      }
      let listino = 0;
      try{
        const found = await store.searchProdotti(companyId, cod, 5);
        const p = found.find(x => x.cod === cod);
        if(p) listino = p.listinoVen || 0;
      }catch(e){ /* silenzioso: al più resta il prezzo già in campo */ }
      tr.querySelector('.r-prezzo').value = listino;
      tr.querySelector('.r-sconto').value = '';
      clearLastBadge(tr);
    }
    updateTotale();
  }
  $('f-cliente').addEventListener('change', () => {
    refreshDestOptions($('f-cliente').value);
    repriceForClient($('f-cliente').value);
  });
  function setMsg(text, kind){
    const el = $('form-msg');
    if(!text){ el.hidden = true; return; }
    el.textContent = text; el.className = 'msg ' + kind; el.hidden = false;
  }

  // ---------------------------------------------------------------------------
  // Cascata ordine → DDT/fattura/ordine fornitore — logica condivisa in
  // app/cascade.js (SaasCascade), usata sia dai bottoni qui sotto sia
  // dall'azione IA equivalente in assistente-ai.html: una sola versione di
  // ogni pezzo, per evitare che i due percorsi divergano silenziosamente
  // (vedi il bug qtyEv trovato e corretto — la ragione stessa per cui
  // questa logica non è rimasta duplicata inline in ogni pagina).
  // ---------------------------------------------------------------------------
  // Colonna "Stato" separata (stessa richiesta già fatta per Pagata/Non
  // pagata in fatture.html: "fai la stessa cosa per gli ordini") — prima
  // il badge Consegnato/Parziale stava appiccicato al numero ordine nella
  // stessa cella, ora è una colonna a sé, sempre valorizzata (anche "Da
  // evadere" quando non è stato ancora consegnato nulla, invece di
  // restare vuota: statoEvasione() ritorna null in quel caso, pensato per
  // essere omesso — qui invece serve sempre un badge da mostrare).
  function statoConsegnaBadge(o){
    const s = window.SaasCascade.statoEvasione(o.righe, 'Consegnato');
    return s ? `<span class="badge ${s.cls}">${s.label}</span>` : `<span class="badge">Da evadere</span>`;
  }
  // Box "Documenti collegati" (vedi app/lineage.js): un diagramma a nodi
  // cliccabili con l'intera filiera dell'ordine, come nel vecchio
  // gestionale — sostituisce la vecchia riga di testo piatta "DDT: ...
  // Fatture: ... Ordini fornitore: ...".
  async function renderLineage(ordine){
    const panel = $('f-lineage-panel');
    if(!ordine){ panel.hidden = true; return; }
    try{
      const docs = await window.SaasLineage.loadAll(store, companyId);
      const shown = window.SaasLineage.renderInto($('f-lineage'), 'ordiniCliente', ordine, docs);
      panel.hidden = !shown;
    }catch(e){ panel.hidden = true; /* pannello non essenziale: il resto del form resta usabile */ }
  }

  // Genera un DDT dal residuo dell'ordine (tutto quanto non ancora
  // consegnato, in un colpo solo — il caso più comune): apre ddt.html con
  // l'ordine già selezionato e le righe precompilate, pronte da rivedere
  // (quantità, lotto, scadenza) prima di salvare — niente editor
  // interattivo per-riga qui, per restare semplice. (L'azione IA
  // equivalente, generate_ddt, non naviga da nessuna parte: crea il DDT
  // direttamente, l'anteprima del piano fa la funzione della revisione.)
  async function generaDDT(o){
    const residuo = window.SaasCascade.residuoRighe(o).filter(r => r.residuo > 0);
    if(!residuo.length){ alert('Tutto già consegnato per questo ordine.'); return; }
    if(!confirm(`Genera un DDT con ${residuo.length} riga/e (il residuo non ancora consegnato dell'ordine ${o.num})? Potrai comunque modificare quantità e lotti prima di salvare.`)) return;
    localStorage.setItem('saas_gen_ddt_from_oc', o.id);
    location.href = 'ddt.html';
  }

  async function generaOF(o){
    const { created, updated, senzaFornitore, ordine: nuovoOrdine } = await window.SaasCascade.generaOrdiniFornitore(store, companyId, o);
    if(!created.length && !updated.length && !senzaFornitore.length){ alert('Tutti gli articoli dell\'ordine sono già su un ordine fornitore collegato.'); return; }
    const parts = [];
    if(created.length) parts.push(created.length + ' ordine/i fornitore creato/i: ' + created.map(x => x.num).join(', '));
    if(updated.length) parts.push(updated.length + ' aggiornato/i con i nuovi articoli: ' + updated.map(x => x.num).join(', '));
    if(senzaFornitore.length) parts.push(created.length || updated.length ? 'senza fornitore a catalogo (non ordinati): ' + senzaFornitore.join(', ') : 'Nessuno dei prodotti mancanti ha un fornitore assegnato nel catalogo: assegnalo in Prodotti, poi riprova.');
    alert(parts.join(' · '));
    // Chiamata dal form (vedi oc-btn-of sotto): riapre il form con l'ordine
    // aggiornato invece di tornare all'elenco, che qui resterebbe comunque
    // nascosto dietro il form aperto. Chiamata dalla riga dell'elenco
    // (editingOrder è null, il form non è aperto): aggiorna l'elenco come
    // prima.
    if(editingOrder && editingOrder.id === o.id) await openForm(nuovoOrdine);
    else await renderList();
  }

  // Bottoni "→ Genera DDT" / "→ Genera ordine fornitore" dentro il form di
  // modifica — lo stesso passo successivo dei bottoni per-riga
  // nell'elenco (sotto, visibili solo con la spunta), ma qui sempre a
  // vista quando si apre un ordine esistente: la richiesta era proprio
  // "non ho trovato il pulsante", e in un elenco che richiede prima di
  // selezionare la riga il pulsante è facile da perdere.
  async function refreshCascadeActions(o){
    const box = $('oc-cascade-actions');
    if(!o){ box.hidden = true; return; }
    box.hidden = false;
    const shipped = (o.righe || []).length > 0 && window.SaasCascade.residuoRighe(o).every(r => r.residuo <= 0);
    const ddtBtn = $('oc-btn-ddt');
    ddtBtn.textContent = shipped ? '✓ Consegnato' : '→ Genera DDT';
    ddtBtn.disabled = shipped;
    ddtBtn.className = shipped ? 'ghost' : 'primary';

    const ofBtn = $('oc-btn-of');
    ofBtn.disabled = true; ofBtn.className = 'ghost'; ofBtn.textContent = '…';
    const st = await window.SaasCascade.statoOrdineFornitore(store, companyId, o);
    if(editingOrder !== o) return; // il form è stato chiuso/riaperto su un altro ordine nel frattempo: non toccare bottoni non più suoi
    ofBtn.textContent = st.label;
    ofBtn.disabled = st.done;
    ofBtn.className = st.done ? 'ghost' : 'primary';
  }
  $('oc-btn-ddt').addEventListener('click', () => { if(editingOrder) generaDDT(editingOrder); });
  $('oc-btn-of').addEventListener('click', async () => {
    if(!editingOrder) return;
    const btn = $('oc-btn-of');
    btn.disabled = true;
    try{ await generaOF(editingOrder); }
    catch(err){ alert('Errore durante la generazione dell\'ordine fornitore: ' + (err.message || err)); btn.disabled = false; }
  });

  // ---- ordinamento colonne: come nel gestionale originale — un clic
  // sull'intestazione ordina, un secondo clic inverte la direzione.
  function sortCmp(va, vb, dir){
    const mul = dir === 'asc' ? 1 : -1;
    if(typeof va === 'number' && typeof vb === 'number') return (va - vb) * mul;
    return String(va == null ? '' : va).localeCompare(String(vb == null ? '' : vb), 'it', { numeric:true }) * mul;
  }
  function sortVal(key, o){
    if(key === 'num') return o.num || '';
    if(key === 'data') return o.data || '';
    if(key === 'cliente') return (clientiById[o.clienteId] || {}).nome || '';
    if(key === 'imponibile') return impTot(o.righe || []);
    if(key === 'iva') return ivaTot(o.righe || []);
    if(key === 'totale') return docTotale(o.righe || []);
    if(key === 'stato'){
      const totQ = (o.righe || []).reduce((s, r) => s + (r.qty || 0), 0);
      const fatto = (o.righe || []).reduce((s, r) => s + (r.qtyEv || 0), 0);
      return totQ ? fatto / totQ : 0;
    }
    return '';
  }
  function th(key, label){
    const on = SORT.key === key, ar = on ? (SORT.dir === 'asc' ? ' ↑' : ' ↓') : '';
    return `<th class="thsort ${on ? 'on' : ''}" data-sort="${key}">${esc(label)}${ar}</th>`;
  }
  function setSort(key){
    if(SORT.key === key) SORT.dir = SORT.dir === 'asc' ? 'desc' : 'asc';
    else { SORT.key = key; SORT.dir = key === 'num' || key === 'data' ? 'desc' : 'asc'; }
    renderResults();
  }

  // Ricerca testuale: come Q nel gestionale originale (num + nome cliente).
  function matchesQuery(it){
    if(!Q) return true;
    const party = (clientiById[it.clienteId] || {}).nome || '';
    return (it.num || '').toLowerCase().includes(Q) || party.toLowerCase().includes(Q);
  }
  let searchTimer = null;
  $('q').addEventListener('input', () => {
    Q = $('q').value.trim().toLowerCase();
    clearTimeout(searchTimer);
    searchTimer = setTimeout(renderResults, 200);
  });

  // Completo = ogni riga interamente consegnata (qtyEv >= qty) — stessa
  // definizione di evasione() in dashboard.html, così "aperti o parziali"
  // qui seleziona esattamente gli stessi ordini che la dashboard conta.
  function ordineCompleto(o){
    const righe = o.righe || [];
    return righe.length > 0 && righe.every(r => (r.qtyEv || 0) >= (r.qty || 0));
  }

  // ---- filtri: cliente, stato evasione, intervallo date ------------------
  function matchesFilter(o){
    if(FFILT.cliente && o.clienteId !== FFILT.cliente) return false;
    if(FFILT.stato === 'aperti' && ordineCompleto(o)) return false;
    if(FFILT.stato === 'evasi' && !ordineCompleto(o)) return false;
    if(FFILT.from && (o.data || '') < FFILT.from) return false;
    if(FFILT.to && (o.data || '') > FFILT.to) return false;
    return true;
  }
  function setFFilt(k, v){ FFILT[k] = v; renderResults(); }
  function clearFFilt(){ FFILT = { cliente:'', stato:'', from:'', to:'' }; renderResults(); }
  function renderFilterbar(){

        <label class="fdate">Al <input type="date" id="ff-to" value="${FFILT.to}"></label>

    $('ff-to').addEventListener('change', () => setFFilt('to', $('ff-to').value));

  // ---- righe: editor dinamico -------------------------------------------
  function rigaRowHtml(r){
    r = r || { cod:'', descr:'', qty:1, prezzo:0, sconto:'', iva:22 };
    return `<tr ${r._last ? 'data-last="1"' : ''}>
      <td class="drag-col"><span class="drag-handle" draggable="true" title="Trascina per riordinare la riga">⠿</span></td>
      <td><div class="prod-pick"><input class="r-cod" value="${esc(r.cod)}" placeholder="cod." autocomplete="off"><div class="prod-sugg"></div></div>${r.catalogMatch ? window.SaasAiImport.catalogBadgeHtml(r.catalogMatch) : ''}${r._last ? '<span class="lastp">ultimo prezzo</span>' : ''}</td>
      <td><input class="r-descr" value="${esc(r.descr)}" placeholder="descrizione"></td>
      <td style="min-width:70px"><input class="r-qty" type="number" min="0" step="1" value="${r.qty}"></td>
      <td style="min-width:90px"><input class="r-prezzo" type="number" min="0" step="0.01" value="${r.prezzo}"></td>
      <td style="min-width:70px"><input class="r-sconto" type="text" inputmode="decimal" value="${esc(r.sconto || '')}" placeholder="0"></td>
      <td style="min-width:70px"><input class="r-iva" type="number" min="0" step="1" value="${r.iva}"></td>

    </tr>`;

  function addRigaRow(r){
    $('righe-body').insertAdjacentHTML('beforeend', rigaRowHtml(r));
    bindRigaRow($('righe-body').lastElementChild);
    updateTotale();
  }
  // Riordino righe per trascinamento (come nel vecchio gestionale): solo
  // la manetta ⠿ è draggable, non l'intera riga — altrimenti trascinare
  // per selezionare del testo in un campo della riga (es. la descrizione)
  // verrebbe scambiato per un trascinamento della riga stessa. L'ordine
  // finale è quello del DOM: readRighe() lo legge già così, nessun indice
  // esplicito da tenere in sincrono altrove.
  let dragSrcRow = null;
  function bindRigaRow(tr){
    tr.querySelector('.rm-riga').addEventListener('click', () => { tr.remove(); updateTotale(); });
    tr.querySelectorAll('input').forEach(inp => inp.addEventListener('input', updateTotale));
    // Modificare prezzo o sconto a mano toglie il badge "ultimo prezzo" —
    // vedi clearLastBadge() più sopra.
    tr.querySelector('.r-prezzo').addEventListener('input', () => clearLastBadge(tr));
    tr.querySelector('.r-sconto').addEventListener('input', () => clearLastBadge(tr));
    const handle = tr.querySelector('.drag-handle');
    handle.addEventListener('dragstart', e => {
      dragSrcRow = tr;
      tr.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', ''); // alcuni browser esigono un dato qualunque perché il drag parta davvero
    });
    handle.addEventListener('dragend', () => {
      tr.classList.remove('dragging');
      dragSrcRow = null;
    });
    tr.addEventListener('dragover', e => {
      if(!dragSrcRow || dragSrcRow === tr) return;
      e.preventDefault(); // di norma un drop non è permesso: va abilitato esplicitamente qui
      const rect = tr.getBoundingClientRect();
      const before = (e.clientY - rect.top) < rect.height / 2;
      tr.parentNode.insertBefore(dragSrcRow, before ? tr : tr.nextSibling);
    });
    tr.addEventListener('drop', e => e.preventDefault());
    // Stesso autocompletamento della barra di ricerca sopra la tabella, ma
    // dentro il campo "Codice" della riga stessa: scegliendo un prodotto
    // riempie questa riga invece di aggiungerne una nuova.
    window.SaasProdPicker.attach(tr.querySelector('.r-cod'), tr.querySelector('.prod-sugg'), {
      companyId, priceField: 'listinoVen', clearOnPick: false, priceHistory: priceHistoryForForm,
      onPick: p => {
        const last = lastClientPrice($('f-cliente').value, p.cod);
        tr.querySelector('.r-cod').value = p.cod;
        tr.querySelector('.r-descr').value = p.descr;
        tr.querySelector('.r-prezzo').value = last ? last.prezzo : (p.listinoVen || 0);
        tr.querySelector('.r-sconto').value = last ? (last.sconto || '') : '';
        tr.querySelector('.r-iva').value = p.iva || 22;
        const qtyEl = tr.querySelector('.r-qty');
        if (!Number(qtyEl.value)) qtyEl.value = 1;
        // Badge "ultimo prezzo" (vedi rigaRowHtml()) — qui la riga esiste
        // già nel DOM, quindi si inserisce a mano invece di ripassare da
        // rigaRowHtml().
        clearLastBadge(tr);
        if(last){
          tr.dataset.last = '1';
          tr.querySelector('.r-cod').closest('td').insertAdjacentHTML('beforeend', '<span class="lastp">ultimo prezzo</span>');
        }
        updateTotale();
        qtyEl.focus(); qtyEl.select();
      },
    });
  }
  function readRighe(){
    return [...$('righe-body').querySelectorAll('tr')].map(tr => ({
      cod: tr.querySelector('.r-cod').value.trim(),
      descr: tr.querySelector('.r-descr').value.trim(),
      qty: Number(tr.querySelector('.r-qty').value) || 0,
      prezzo: Number(tr.querySelector('.r-prezzo').value) || 0,
      sconto: tr.querySelector('.r-sconto').value.trim(),
      iva: Number(tr.querySelector('.r-iva').value) || 0,
    })).filter(r => r.descr || r.cod);
  }
  // Stessa aritmetica dello sconto del gestionale originale, cascata
  // "N+M" inclusa (es. "50+15" = 50% e poi un altro 15% sul residuo).
  function scParts(s){ return String(s == null ? '' : s).split('+').map(x => parseFloat(String(x).trim()) || 0); }
  function scFactor(s){ return scParts(s).reduce((f, p) => f * (1 - p / 100), 1); }
  function rigaTotale(r){ const imp = r.qty * r.prezzo * scFactor(r.sconto); return imp + imp * r.iva / 100; }
  function docTotale(righe){ return righe.reduce((s, r) => s + rigaTotale(r), 0); }
  // Imponibile e IVA come colonne a sé nell'elenco, come nel gestionale
  // originale (non solo il Totale già scontato/con IVA inclusa).
  function impTot(righe){ return (righe || []).reduce((s, r) => s + r.qty * r.prezzo * scFactor(r.sconto), 0); }
  function ivaTot(righe){ return (righe || []).reduce((s, r) => s + r.qty * r.prezzo * scFactor(r.sconto) * (r.iva || 0) / 100, 0); }
  function updateTotale(){ $('righe-totale').textContent = eur(docTotale(readRighe())); }

  $('add-riga').addEventListener('click', () => addRigaRow(null));

  // ---- form apri/chiudi ---------------------------------------------------
  async function openForm(ordine){

    editingOrder = ordine;
    $('form-title').textContent = ordine ? `Modifica ${ordine.num}` : 'Nuovo ordine';
    $('f-cliente').value = ordine ? ordine.clienteId : ($('f-cliente').options[0] ? $('f-cliente').options[0].value : '');
    refreshDestOptions($('f-cliente').value);

    $('f-data').value = ordine ? ordine.data : today();

      // un campo modificabile, chi vuole un numero diverso (o sta
      // recuperando la numerazione del vecchio gestionale) lo sovrascrive
      // prima di salvare — vedi f-save più sotto.
      $('f-num').value = '';
      try{ $('f-num').value = await store.peekNumber(companyId, 'OC', Number($('f-data').value.slice(0, 4))); }
      catch(e){ /* l'anteprima non è essenziale: il campo resta vuoto, comunque modificabile a mano */ }
    }
    $('righe-body').innerHTML = '';
    (ordine ? ordine.righe : [null]).forEach(addRigaRow);
    renderLineage(ordine);

  function closeForm(){ $('form-card').hidden = true; $('list-card').hidden = false; editingId = null; editingOrder = null; }
  $('new-ordine').addEventListener('click', async () => {

    const lim = await store.checkDocLimit(companyId);

  // ---- importa ordine cliente da PDF/foto con l'AI --------------------------
  // Un cliente (farmacia) manda spesso il proprio ordine per email/WhatsApp
  // come foto o PDF invece che a voce — stesso meccanismo di
  // fatture-fornitore.html (vedi app/ai-import.js), qui per riconoscere il
  // CLIENTE che ordina invece del fornitore che fattura. Niente lotto/scad
  // richiesti: questo modulo non li ha (vedi rigaRowHtml sopra).
  function aiImportStatus(text, kind){
    const el = $('ai-import-status');
    if(!text){ el.hidden = true; return; }
    el.textContent = text; el.className = 'msg ' + (kind || 'info'); el.hidden = false;
  }
  const AI_IMPORT_INSTR = "Nel documento allegato c'è un ORDINE ricevuto da un CLIENTE (farmacia o struttura sanitaria che sta ordinando prodotti). Restituisci SOLO un oggetto JSON (nient'altro, niente backtick), con questi campi: cliente (nome del cliente che ordina), data (formato AAAA-MM-GG, oggi se non indicata), righe: un array, per ogni riga cod (codice articolo alfanumerico, se presente altrimenti stringa vuota), descr (descrizione), qty (quantità ordinata, numero), prezzo (prezzo unitario, numero, 0 se non indicato), sconto (percentuali di sconto a cascata unite da '+', es. \"50+15\", stringa vuota se non c'è sconto), iva (aliquota IVA, numero, 22 se non indicata).";
  $('ai-import-btn').addEventListener('click', () => $('ai-import-file').click());
  $('ai-import-file').addEventListener('change', async () => {
    const file = $('ai-import-file').files[0];
    $('ai-import-file').value = '';
    if(!file) return;
    aiImportStatus('Sto leggendo ' + file.name + ' con l\'AI…', 'info');
    try{
      const p = await window.SaasAiImport.extractFromFile(store, file, {
        systemPrompt: "Sei l'assistente di un gestionale per la distribuzione di dispositivi medici. Rispondi sempre e solo con JSON valido, mai testo libero, mai backtick.",
        instr: AI_IMPORT_INSTR,
        companyId,
      });
      if(!p.righe){ throw new Error('l\'AI non ha riconosciuto un ordine cliente in questo file'); }

      await openForm(null);
      const match = window.SaasAiImport.findPartyByNome(Object.values(clientiById), p.cliente);
      if(match){ $('f-cliente').value = match.id; refreshDestOptions(match.id); }
      $('f-data').value = /^\d{4}-\d{2}-\d{2}$/.test(p.data || '') ? p.data : today();
      $('righe-body').innerHTML = '';
      const righeGrezze = (Array.isArray(p.righe) ? p.righe : []).map(r => ({
        cod: String(r.cod || '').trim(), descr: String(r.descr || '').trim(),
        qty: Math.max(1, parseInt(r.qty) || 1),
        prezzo: r.prezzo != null && r.prezzo !== '' ? parseFloat(r.prezzo) || 0 : 0,
        sconto: String(r.sconto || '').replace(/\s/g, ''),
        iva: r.iva != null && r.iva !== '' ? parseFloat(r.iva) : 22,
      }));
      // Punto 5: verifica incrociata col catalogo prima di mostrare le righe.
      const righe = await window.SaasAiImport.crossCheckRighe(store, companyId, righeGrezze);
      (righe.length ? righe : [null]).forEach(addRigaRow);
      const daVerificare = righe.filter(r => r.catalogMatch === 'unmatched').length;
      aiImportStatus(
        (match
          ? `Letto con l'AI: cliente riconosciuto come "${match.nome}".`
          : `Letto con l'AI, ma nessun cliente corrisponde a "${p.cliente || '?'}": scegline uno dall'elenco prima di salvare (o creane uno nuovo in Clienti).`)
        + (daVerificare ? ` ${daVerificare} riga/e non trovate a catalogo, da controllare.` : ' Righe verificate col catalogo.'),
        match && !daVerificare ? 'ok' : (match ? 'info' : 'error')
      );
    }catch(err){
      aiImportStatus('Lettura non riuscita: ' + (err.message || err), 'error');
    }
  });

  $('f-save').addEventListener('click', async () => {
    const clienteId = $('f-cliente').value;
    const destId = $('f-dest').value || null;
    const data = $('f-data').value;
    const righe = readRighe();
    if(!clienteId){ setMsg('Seleziona un cliente.', 'error'); return; }
    if(!data){ setMsg('Inserisci una data.', 'error'); return; }
    if(righe.length === 0){ setMsg('Aggiungi almeno una riga con una descrizione.', 'error'); return; }
    // Rete di sicurezza: il limite è già controllato aprendo il form con
    // "+ Nuovo ordine", ma tra l'apertura e il salvataggio può essere
    // cambiato qualcosa (un altro documento creato in un'altra scheda).
    if(!editingId){
      const lim = await store.checkDocLimit(companyId);
      if(!lim.ok){ setMsg(`Hai raggiunto il limite di ${lim.limite} documenti/mese del piano "${lim.piano}". Passa a un piano superiore in Impostazioni → Abbonamento per continuare.`, 'error'); return; }
    }

    $('f-save').disabled = true;
    setMsg('', '');
    try{
      // L'editor delle righe non conosce qtyEv (quanto già consegnato via
      // la cascata, vedi residuoRighe() sopra): senza questo passaggio,
      // salvare una modifica a un ordine parzialmente evaso lo
      // resetterebbe silenziosamente a "niente consegnato", con il
      // rischio concreto di generare un DDT doppio sulla stessa merce.
      // Abbinamento per codice (in coda, se un codice compare più volte)
      // invece che per indice: resiste a righe riordinate o aggiunte.
      let righeFinal = righe;
      if(editingOrder){
        const qtyEvByCod = {};
        (editingOrder.righe || []).forEach(r => { if(r.qtyEv) (qtyEvByCod[r.cod] = qtyEvByCod[r.cod] || []).push(r.qtyEv); });
        righeFinal = righe.map(r => {
          const queue = qtyEvByCod[r.cod];
          return (queue && queue.length) ? Object.assign({}, r, { qtyEv: Math.min(r.qty, queue.shift()) }) : r;
        });
      }
      // Idem per ddtIds/ftIds/ofIds/ddtId/ftId/ofId (extra, non nel form):
      // si parte dall'ordine esistente invece che da un oggetto vuoto, o
      // il salvataggio li azzererebbe allo stesso modo.
      const doc = editingOrder ? Object.assign({}, editingOrder, { clienteId, destId, data, righe: righeFinal }) : { clienteId, destId, data, righe: righeFinal };
      const numInput = $('f-num').value.trim();
      if(editingId){
        doc.id = editingId;
        if(!numInput){ setMsg('Il numero ordine non può essere vuoto.', 'error'); $('f-save').disabled = false; return; }
        if(numInput !== editingOrder.num){
          // Numero cambiato a mano: se rispetta il formato OC/ANNO/NNNN
          // sposta in avanti (mai indietro) il contatore, così i futuri
          // numeri automatici non lo ripetano — un testo libero (es.
          // importato dal vecchio gestionale) viene comunque accettato
          // così com'è, senza toccare il contatore.
          await store.bumpCounterPast(companyId, 'OC', numInput);
          doc.num = numInput;
        } // altrimenti resta il numero già ereditato da editingOrder più sopra
      } else if(numInput){
        // L'utente ha lasciato o modificato il numero proposto nel form
        // (openForm() lo precompila con un'ANTEPRIMA, non una vera
        // riserva — vedi store.peekNumber()): usato direttamente, non
        // tramite nextNumber(). Stesso compromesso del vecchio gestionale
        // (consumeNum()): un altro dispositivo potrebbe salvare lo stesso
        // numero nel frattempo, ma è raro, e un doppio viene comunque
        // intercettato sotto (vincolo unique lato database) con un
        // messaggio chiaro invece di un duplicato silenzioso.
        await store.bumpCounterPast(companyId, 'OC', numInput);
        doc.num = numInput;
      } else {
        // Campo lasciato vuoto (l'anteprima non è riuscita a caricarsi):
        // numerazione atomica come prima, l'unica che garantisce che due
        // dispositivi non ricevano mai lo stesso numero (vedi
        // supabase/migrations/0004_numerazione.sql).
        const anno = Number(data.slice(0, 4));
        doc.num = await store.nextNumber(companyId, 'OC', anno);
      }
      await store.saveDoc('ordiniCliente', doc, companyId);
      closeForm();
      await renderList();
    }catch(err){
      const dup = err && err.code === '23505';
      setMsg(dup ? 'Esiste già un ordine con questo numero: scegline un altro.' : (err.message || 'Errore imprevisto durante il salvataggio.'), 'error');
    }finally{
      $('f-save').disabled = false;
    }
  });

  // ---- elenco ---------------------------------------------------------------
  // Scarica l'elenco da Supabase — SOLO quando i dati potrebbero davvero
  // essere cambiati (apertura pagina, dopo salvataggio/eliminazione...): fa
  // sempre passare dalla schermata "Carico…", quindi svuota per un istante
  // la tabella già a video. Chi cambia solo COME viene mostrato l'elenco
  // già scaricato (spunta una riga, ordina, filtra, cerca) deve chiamare
  // renderResults() qui sotto, non questa — vedi il suo commento.
  async function renderList(){
    const area = $('list-area');
    area.innerHTML = '<p class="empty">Carico…</p>';
    try{
      ORDINI_ALL = await store.loadCollection('ordiniCliente', companyId);
    }catch(err){
      area.innerHTML = `<p class="empty">Errore nel caricamento: ${esc(err.message)}</p>`;
      return;
    }
    renderResults();
  }
  // Ridisegna l'elenco dai dati già in ORDINI_ALL, senza rifare la query di
  // rete. Prima c'era una sola funzione (renderList) che faceva sempre
  // entrambe le cose: bastava spuntare una riga per farla ripartire da capo
  // (svuotare la tabella in "Carico…", riscaricare tutto, ridisegnare) —
  // "quando seleziono un documento per un attimo scompare tutto e poi
  // ricompare". Selezione, ordinamento, filtri e ricerca cambiano solo la
  // vista su dati che sono già in memoria: non hanno alcun bisogno di una
  // nuova richiesta di rete.
  function renderResults(){
    renderFilterbar();
    const area = $('list-area');
    if(ORDINI_ALL.length === 0){
      area.innerHTML = '<p class="empty">Nessun ordine ancora. Crea prima un cliente, poi aggiungi un ordine con "+ Nuovo ordine".</p>';
      return;
    }
    let ordini = ORDINI_ALL.filter(matchesQuery).filter(matchesFilter);
    if(ordini.length === 0){
      area.innerHTML = '<p class="empty">Nessun ordine trovato con questi criteri.</p>';
      return;
    }
    ordini.sort((a, b) => sortCmp(sortVal(SORT.key, a), sortVal(SORT.key, b), SORT.dir));
    const allChecked = ordini.length > 0 && ordini.every(o => PICK.has(o.id));
    area.innerHTML = `<div class="table-scroll"><table class="elenco-table"><thead><tr>
        <th class="check-col"><input type="checkbox" id="check-all" ${allChecked ? 'checked' : ''}></th>
        ${th('num','Numero')}${th('data','Data')}${th('cliente','Cliente')}${th('stato','Stato')}${th('imponibile','Imponibile')}${th('iva','IVA')}${th('totale','Totale')}<th></th>
      </tr></thead><tbody>${ordini.map(o => `
        <tr class="row-click" data-id="${o.id}">
          <td class="check-col"><input type="checkbox" class="row-check" data-id="${o.id}" ${PICK.has(o.id) ? 'checked' : ''}></td>
          <td class="num-col">${esc(o.num)}</td>
          <td>${o.data ? new Date(o.data).toLocaleDateString('it-IT') : '—'}</td>
          <td>${esc((clientiById[o.clienteId] || {}).nome) || '(cliente non trovato)'}${destSub(o)}</td>
          <td>${statoConsegnaBadge(o)}</td>
          <td class="num-col">${eur(impTot(o.righe || []))}</td>
          <td class="num-col">${eur(ivaTot(o.righe || []))}</td>
          <td class="num-col">${eur(docTotale(o.righe || []))}</td>
          <td class="actions">${PICK.has(o.id) ? `
            <button data-print="${o.id}" title="Stampa">🖨</button><button data-pdf="${o.id}" title="Scarica PDF">⬇ PDF</button>
            <button data-gen-ddt="${o.id}" title="Genera un DDT dal residuo non ancora consegnato">📦 DDT</button>
            <button data-gen-of="${o.id}" title="Genera un ordine fornitore per procurarsi la merce">🏭 Ord.forn.</button>
            <button data-edit="${o.id}">Modifica</button>
            <button class="danger" data-del="${o.id}">Elimina</button>` : ''}
          </td>
        </tr>`).join('')}</tbody></table></div>`;
    window.SaasResize.makeColsResizable(area.querySelector('table'), 'ordini-elenco');
    area.querySelectorAll('[data-sort]').forEach(th => th.addEventListener('click', () => setSort(th.dataset.sort)));
    $('check-all').addEventListener('click', e => {
      e.stopPropagation();
      if(e.target.checked) ordini.forEach(o => PICK.add(o.id));
      else ordini.forEach(o => PICK.delete(o.id));
      renderResults();
    });
    area.querySelectorAll('.row-check').forEach(ch => ch.addEventListener('click', e => {
      e.stopPropagation();
      if(e.target.checked) PICK.add(ch.dataset.id); else PICK.delete(ch.dataset.id);
      renderResults();
    }));
    area.querySelectorAll('[data-edit]').forEach(btn => btn.addEventListener('click', () => {
      openForm(ordini.find(x => x.id === btn.dataset.edit));
    }));
    area.querySelectorAll('tbody tr[data-id]').forEach(tr => tr.addEventListener('click', e => {
      if(e.target.closest('button, input, a, select')) return; // non aprire se il clic è su un pulsante/checkbox della riga
      openForm(ordini.find(x => x.id === tr.dataset.id));
    }));
    area.querySelectorAll('[data-print]').forEach(btn => btn.addEventListener('click', () => {
      const it = ordini.find(x => x.id === btn.dataset.print);
      window.SaasPrint.openPrintWindow('ordiniCliente', it, clientiById[it.clienteId], company);
    }));
    area.querySelectorAll('[data-pdf]').forEach(btn => btn.addEventListener('click', async () => {
      const it = ordini.find(x => x.id === btn.dataset.pdf);
      btn.disabled = true;
      try{
        await window.SaasPrint.downloadPDF('ordiniCliente', it, clientiById[it.clienteId], company);
      }catch(err){
        alert('Errore durante la generazione del PDF: ' + (err.message || err));
      }finally{
        btn.disabled = false;
      }
    }));
    area.querySelectorAll('[data-gen-ddt]').forEach(btn => btn.addEventListener('click', () => {
      generaDDT(ordini.find(x => x.id === btn.dataset.genDdt));
    }));
    area.querySelectorAll('[data-gen-of]').forEach(btn => btn.addEventListener('click', async () => {
      btn.disabled = true;
      try{ await generaOF(ordini.find(x => x.id === btn.dataset.genOf)); }
      catch(err){ alert('Errore durante la generazione dell\'ordine fornitore: ' + (err.message || err)); }
      finally{ btn.disabled = false; }
    }));
    area.querySelectorAll('[data-del]').forEach(btn => btn.addEventListener('click', async () => {
      const o = ordini.find(x => x.id === btn.dataset.del);
      if(!confirm(`Eliminare l'ordine ${o.num}? L'operazione non si può annullare.`)) return;
      try{
        await store.removeDoc('ordiniCliente', o.id);
        await renderList();
      }catch(err){
        alert('Errore durante l\'eliminazione: ' + err.message);
      }
    }));
  }

  async function doLogout(){
    await store.signOut();
    localStorage.removeItem('saas_company_id');
    localStorage.removeItem('saas_company_nome');
    location.href = 'index.html';
  }

  async function init(){
    const session = await store.getSession();
    if(!session){ location.href = 'index.html'; return; }
    companyId = localStorage.getItem('saas_company_id');
    if(!companyId){ location.href = 'index.html'; return; }
    // Link "Prodotti da evadere" dalla dashboard (ordini.html?stato=aperti):
    // apre già filtrato sui soli ordini aperti/parziali, non su tutti.
    const urlStato = new URLSearchParams(location.search).get('stato');
    if(urlStato === 'aperti' || urlStato === 'evasi') FFILT.stato = urlStato;
    try{ company = await store.getCompany(companyId); }catch(e){ company = {}; } // niente PDF/stampa senza dati azienda? non deve comunque bloccare la pagina
    window.SaasNav.render('ordini', {
      companyName: localStorage.getItem('saas_company_nome') || 'Azienda',
      email: session.user.email,
      onLogout: doLogout,
    });

    const clienti = await store.loadCollection('clienti', companyId);
    clientiById = Object.fromEntries(clienti.map(c => [c.id, c]));
    // Ordine alfabetico, non quello di caricamento — come il menu "Tutti i
    // clienti" della filterbar qui sopra (clientiArr).
    $('f-cliente').innerHTML = [...clienti].sort((a, b) => (a.nome || '').localeCompare(b.nome || '', 'it', { sensitivity:'base' }))
      .map(c => `<option value="${c.id}">${esc(c.nome)}</option>`).join('');

    // Per lastClientPrice() qui sopra — caricate una volta, non ad ogni
    // ricerca prodotto. ordiniCliente qui è un elenco a sé apposta (non lo
    // stesso di renderList()): serve solo a leggere le righe già fatturate/
    // ordinate, non a popolare l'elenco documenti sotto.
    const [fattureCliente, ddtTutti, ordiniTutti] = await Promise.all([
      store.loadCollection('fattureCliente', companyId),
      store.loadCollection('ddt', companyId),
      store.loadCollection('ordiniCliente', companyId),
    ]);
    STORICO_PREZZI = { fattureCliente, ddt: ddtTutti, ordiniCliente: ordiniTutti };

    window.SaasProdPicker.attach($('prodq'), $('prodsugg'), {
      companyId, priceField: 'listinoVen', priceHistory: priceHistoryForForm,
      onPick: p => {
        const last = lastClientPrice($('f-cliente').value, p.cod);
        addRigaRow({ cod: p.cod, descr: p.descr, qty: 1, prezzo: last ? last.prezzo : (p.listinoVen || 0), sconto: last ? (last.sconto || '') : '', iva: p.iva || 22, _last: !!last });
      },
    });

    await renderList();

    // Apertura diretta da un nodo del box "Documenti collegati" cliccato
    // in un altro modulo (vedi app/lineage.js) — stesso meccanismo già
    // usato per "Genera DDT"/"Genera fattura" qui sotto.
    const pendingNum = window.SaasLineage.consumePendingOpenNum('ordiniCliente');
    if(pendingNum){
      const all = await store.loadCollection('ordiniCliente', companyId);
      const found = all.find(x => x.num === pendingNum);
      if(found) await openForm(found);
    }
  }
  init();
</script>
</body>
</html>

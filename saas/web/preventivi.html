<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preventivi — Gestionale</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0ea371">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<!--
  Speculare a ordini.html — stessa forma di dati (cliente, righe con
  sconto, numerazione PREV), con un'aggiunta: "Trasforma in ordine" crea
  un vero ordini_cliente a partire dalle stesse righe (l'utente può
  ancora modificarle prima di salvare) e marca il preventivo come
  convertito (oc_id), esattamente come nel gestionale originale.
-->
<script>(function(){try{if(localStorage.getItem('saas_theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<link rel="stylesheet" href="app/theme.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="app-main">
  <div class="page-head">
      <h2>Preventivi</h2>
      <p class="sub">Crea preventivi e trasformali in ordini cliente con un clic.</p>
    </div>

  <div class="card" id="form-card" hidden>
    <button type="button" class="linklike back-link" id="f-back">← Torna all'elenco</button>
    <h3 id="form-title">Nuovo preventivo</h3>
    <label for="f-cliente">Cliente</label>
    <select id="f-cliente"></select>
    <div id="f-dest-wrap"><label for="f-dest">Destinazione di consegna</label><select id="f-dest"></select></div>
    <div class="grid2">
      <div><label for="f-num">Numero preventivo</label><input id="f-num" type="text" placeholder="es. PREV/2026/0001"></div>
      <div><label for="f-data">Data</label><input id="f-data" type="date"></div>
    </div>

    <div class="prod-pick"><input id="prodq" autocomplete="off" placeholder="Cerca per codice o descrizione…"><div class="prod-sugg" id="prodsugg"></div></div>
    <label>Righe</label>
    <div class="table-scroll"><table class="righe-table">
      <thead><tr><th class="drag-col"></th><th>Codice</th><th>Descrizione</th><th>Qtà</th><th>Prezzo</th><th>Sconto %</th><th>IVA %</th><th></th></tr></thead>
      <tbody id="righe-body"></tbody>
    </table></div>
    <button class="linklike" id="add-riga" style="margin-top:8px">+ aggiungi riga</button>
    <p class="righe-total">Totale: <b id="righe-totale">0,00 €</b></p>

    <label for="f-note">Note (facoltativo)</label>
    <textarea id="f-note" rows="2"></textarea>

    <div class="form-actions">
      <button class="primary" id="f-save">Salva</button>
      <button class="ghost" id="f-cancel">Annulla</button>
    </div>
    <div class="msg" id="form-msg" hidden></div>
  </div>

  <div class="card" id="list-card">
    <div class="toolbar">
      <h3>Elenco</h3>
      <div class="toolbar-right">
        <div class="search-box"><span class="si">⌕</span><input type="text" id="q" placeholder="Cerca per numero o cliente…"></div>
        <button class="primary" id="new-preventivo">+ Nuovo preventivo</button>
      </div>
    </div>
    <div id="filter-area"></div>
    <div id="list-area"><p class="empty">Carico…</p></div>
  </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
  window.SUPABASE_URL = 'https://rixvgmzedwdzgavjewbm.supabase.co';
  window.SUPABASE_ANON_KEY = 'sb_publishable_DFLcrBd6aiyyNGnCq41RQg_XrP0VR47';
</script>
<script src="app/store.js"></script>
<script src="app/theme-mode.js"></script>
<script src="app/nav.js"></script>
<script src="app/biometric-lock.js"></script>
<script src="app/tour.js"></script>
<script src="app/pwa.js"></script>
<script src="app/resize.js"></script>
<script src="app/elenco-cards.js"></script>
<script src="app/print.js"></script>
<script src="app/prodpicker.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const store = window.SaasStore;
  let companyId = null;
  let company = {}; // dati azienda (companies), per l'intestazione di stampa/PDF
  let editingId = null;
  let editingPreventivo = null; // il preventivo in modifica — vedi f-save
  let clientiById = {};
  let SORT = { key: 'num', dir: 'desc' };
  let Q = ''; // ricerca testuale sull'elenco, come Q nel gestionale originale
  let PICK = new Set(); // id selezionati con la spunta: i pulsanti azione di una riga compaiono solo se è spuntata
  let FFILT = { cliente: '', stato: '', from: '', to: '' }; // filtri sopra l'elenco, come FFILT nel gestionale originale

  function today(){ return new Date().toISOString().slice(0, 10); }
  function esc(s){ return (s == null ? '' : String(s)).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function eur(n){ return (Number(n) || 0).toLocaleString('it-IT', { style:'currency', currency:'EUR' }); }
  // Sottotitolo "📍 destinazione" sotto il nome del cliente in elenco —
  // stessa funzione di ordini.html/ddt.html/fatture.html.
  function destSub(it){
    const cliente = clientiById[it.clienteId];
    const dest = (it.destId && cliente && cliente.dest) ? cliente.dest.find(d => d.id === it.destId) : null;
    return dest ? `<div style="font-size:11px;color:var(--faint);margin-top:1px">📍 ${esc(dest.nome || dest.citta || 'Sede')}</div>` : '';
  }
  // Le destinazioni di consegna sono gestite in clienti.html (CDEST): qui
  // si sceglie solo quale usare per QUESTO preventivo, tra quelle già
  // registrate per il cliente selezionato — stessa funzione già portata
  // in ordini.html: "verifica anche i preventivi" (nel vecchio gestionale
  // la destinazione si sceglie già al preventivo e si propaga da sola
  // fino all'ordine, "trasformaInOrdine()" qui sotto). "Sede legale"
  // resta il default se il cliente non ne ha di aggiuntive.
  function refreshDestOptions(clienteId){
    const cliente = clientiById[clienteId];
    const dest = (cliente && cliente.dest) || [];
    $('f-dest-wrap').hidden = dest.length === 0;
    $('f-dest').innerHTML = '<option value="">Sede legale</option>' +
      dest.map(d => `<option value="${d.id}">${esc(d.nome || d.citta || 'Sede')}</option>`).join('');
  }
  $('f-cliente').addEventListener('change', () => refreshDestOptions($('f-cliente').value));
  function setMsg(text, kind){
    const el = $('form-msg');
    if(!text){ el.hidden = true; return; }
    el.textContent = text; el.className = 'msg ' + kind; el.hidden = false;
  }

  function rigaRowHtml(r){
    r = r || { cod:'', descr:'', qty:1, prezzo:0, sconto:'', iva:22 };
    return `<tr>
      <td class="drag-col"><span class="drag-handle" draggable="true" title="Trascina per riordinare la riga">⠿</span></td>
      <td><div class="prod-pick"><input class="r-cod" value="${esc(r.cod)}" placeholder="cod." autocomplete="off"><div class="prod-sugg"></div></div></td>
      <td><input class="r-descr" value="${esc(r.descr)}" placeholder="descrizione"></td>
      <td style="min-width:70px"><input class="r-qty" type="number" min="0" step="1" value="${r.qty}"></td>
      <td style="min-width:90px"><input class="r-prezzo" type="number" min="0" step="0.01" value="${r.prezzo}"></td>
      <td style="min-width:70px"><input class="r-sconto" type="text" inputmode="decimal" value="${esc(r.sconto || '')}" placeholder="0"></td>
      <td style="min-width:70px"><input class="r-iva" type="number" min="0" step="1" value="${r.iva}"></td>
      <td class="rm"><button type="button" class="rm-riga" title="rimuovi riga">✕</button></td>
    </tr>`;
  }
  function addRigaRow(r){
    $('righe-body').insertAdjacentHTML('beforeend', rigaRowHtml(r));
    bindRigaRow($('righe-body').lastElementChild);
    updateTotale();
  }
  // Riordino righe per trascinamento (vedi la stessa idea in ordini.html):
  // solo la manetta ⠿ è draggable, non l'intera riga.
  let dragSrcRow = null;
  function bindRigaRow(tr){
    tr.querySelector('.rm-riga').addEventListener('click', () => { tr.remove(); updateTotale(); });
    tr.querySelectorAll('input').forEach(inp => inp.addEventListener('input', updateTotale));
    const handle = tr.querySelector('.drag-handle');
    handle.addEventListener('dragstart', e => {
      dragSrcRow = tr;
      tr.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', '');
    });
    handle.addEventListener('dragend', () => { tr.classList.remove('dragging'); dragSrcRow = null; });
    tr.addEventListener('dragover', e => {
      if(!dragSrcRow || dragSrcRow === tr) return;
      e.preventDefault();
      const rect = tr.getBoundingClientRect();
      const before = (e.clientY - rect.top) < rect.height / 2;
      tr.parentNode.insertBefore(dragSrcRow, before ? tr : tr.nextSibling);
    });
    tr.addEventListener('drop', e => e.preventDefault());
    // Stesso autocompletamento della barra di ricerca sopra la tabella, ma
    // dentro il campo "Codice" della riga stessa: scegliendo un prodotto
    // riempie questa riga invece di aggiungerne una nuova.
    window.SaasProdPicker.attach(tr.querySelector('.r-cod'), tr.querySelector('.prod-sugg'), {
      companyId, priceField: 'listinoVen', clearOnPick: false,
      onPick: p => {
        tr.querySelector('.r-cod').value = p.cod;
        tr.querySelector('.r-descr').value = p.descr;
        tr.querySelector('.r-prezzo').value = p.listinoVen || 0;
        tr.querySelector('.r-iva').value = p.iva || 22;
        const qtyEl = tr.querySelector('.r-qty');
        if (!Number(qtyEl.value)) qtyEl.value = 1;
        updateTotale();
        qtyEl.focus(); qtyEl.select();
      },
    });
  }
  function readRighe(){
    return [...$('righe-body').querySelectorAll('tr')].map(tr => ({
      cod: tr.querySelector('.r-cod').value.trim(),
      descr: tr.querySelector('.r-descr').value.trim(),
      qty: Number(tr.querySelector('.r-qty').value) || 0,
      prezzo: Number(tr.querySelector('.r-prezzo').value) || 0,
      sconto: tr.querySelector('.r-sconto').value.trim(),
      iva: Number(tr.querySelector('.r-iva').value) || 0,
    })).filter(r => r.descr || r.cod);
  }
  // Stessa aritmetica dello sconto del gestionale originale, cascata
  // "N+M" inclusa (es. "50+15" = 50% e poi un altro 15% sul residuo).
  function scParts(s){ return String(s == null ? '' : s).split('+').map(x => parseFloat(String(x).trim()) || 0); }
  function scFactor(s){ return scParts(s).reduce((f, p) => f * (1 - p / 100), 1); }
  function rigaTotale(r){ const imp = r.qty * r.prezzo * scFactor(r.sconto); return imp + imp * r.iva / 100; }
  function docTotale(righe){ return (righe || []).reduce((s, r) => s + rigaTotale(r), 0); }
  // Imponibile e IVA come colonne a sé nell'elenco, come nel gestionale
  // originale (non solo il Totale già scontato/con IVA inclusa).
  function impTot(righe){ return (righe || []).reduce((s, r) => s + r.qty * r.prezzo * scFactor(r.sconto), 0); }
  function ivaTot(righe){ return (righe || []).reduce((s, r) => s + r.qty * r.prezzo * scFactor(r.sconto) * (r.iva || 0) / 100, 0); }
  function updateTotale(){ $('righe-totale').textContent = eur(docTotale(readRighe())); }
  $('add-riga').addEventListener('click', () => addRigaRow(null));

  // ---- ordinamento colonne
  function sortCmp(va, vb, dir){
    const mul = dir === 'asc' ? 1 : -1;
    if(typeof va === 'number' && typeof vb === 'number') return (va - vb) * mul;
    return String(va == null ? '' : va).localeCompare(String(vb == null ? '' : vb), 'it', { numeric:true }) * mul;
  }
  function sortVal(key, p){
    if(key === 'num') return p.num || '';
    if(key === 'data') return p.data || '';
    if(key === 'cliente') return (clientiById[p.clienteId] || {}).nome || '';
    if(key === 'imponibile') return impTot(p.righe || []);
    if(key === 'iva') return ivaTot(p.righe || []);
    if(key === 'totale') return docTotale(p.righe || []);
    if(key === 'stato') return p.ocId ? 1 : 0;
    return '';
  }
  function th(key, label){
    const on = SORT.key === key, ar = on ? (SORT.dir === 'asc' ? ' ↑' : ' ↓') : '';
    return `<th class="thsort ${on ? 'on' : ''}" data-sort="${key}">${esc(label)}${ar}</th>`;
  }
  function setSort(key){
    if(SORT.key === key) SORT.dir = SORT.dir === 'asc' ? 'desc' : 'asc';
    else { SORT.key = key; SORT.dir = key === 'num' || key === 'data' ? 'desc' : 'asc'; }
    renderList();
  }

  // Ricerca testuale: come Q nel gestionale originale (num + nome del cliente).
  function matchesQuery(p){
    if(!Q) return true;
    const cliente = (clientiById[p.clienteId] || {}).nome || '';
    return (p.num || '').toLowerCase().includes(Q) || cliente.toLowerCase().includes(Q);
  }
  let searchTimer = null;
  $('q').addEventListener('input', () => {
    Q = $('q').value.trim().toLowerCase();
    clearTimeout(searchTimer);
    searchTimer = setTimeout(renderList, 200);
  });

  // ---- filtri: cliente, stato (convertito o aperto), intervallo date -----
  function matchesFilter(p){
    if(FFILT.cliente && p.clienteId !== FFILT.cliente) return false;
    if(FFILT.stato === 'convertito' && !p.ocId) return false;
    if(FFILT.stato === 'aperto' && p.ocId) return false;
    if(FFILT.from && (p.data || '') < FFILT.from) return false;
    if(FFILT.to && (p.data || '') > FFILT.to) return false;
    return true;
  }
  function setFFilt(k, v){ FFILT[k] = v; renderList(); }
  function clearFFilt(){ FFILT = { cliente:'', stato:'', from:'', to:'' }; renderList(); }
  function renderFilterbar(){
    const active = FFILT.cliente || FFILT.stato || FFILT.from || FFILT.to;
    const clientiArr = Object.values(clientiById).sort((a, b) => (a.nome || '').localeCompare(b.nome || '', 'it', { sensitivity:'base' }));
    const copts = '<option value="">Tutti i clienti</option>' +
      clientiArr.map(c => `<option value="${c.id}" ${FFILT.cliente === c.id ? 'selected' : ''}>${esc(c.nome)}</option>`).join('');
    $('filter-area').innerHTML = `<div class="filterbar">
      <select id="ff-cliente">${copts}</select>
      <select id="ff-stato">
        <option value="">Tutti gli stati</option>
        <option value="convertito" ${FFILT.stato === 'convertito' ? 'selected' : ''}>Convertiti</option>
        <option value="aperto" ${FFILT.stato === 'aperto' ? 'selected' : ''}>Aperti</option>
      </select>
      <div class="fdate-group">
        <label class="fdate">Dal <input type="date" id="ff-from" value="${FFILT.from}"></label>
        <label class="fdate">Al <input type="date" id="ff-to" value="${FFILT.to}"></label>
      </div>
      ${active ? '<button type="button" class="ffclear" id="ff-clear">✕ Azzera filtri</button>' : ''}
    </div>`;
    $('ff-cliente').addEventListener('change', () => setFFilt('cliente', $('ff-cliente').value));
    $('ff-stato').addEventListener('change', () => setFFilt('stato', $('ff-stato').value));
    $('ff-from').addEventListener('change', () => setFFilt('from', $('ff-from').value));
    $('ff-to').addEventListener('change', () => setFFilt('to', $('ff-to').value));
    if(active) $('ff-clear').addEventListener('click', clearFFilt);
  }

  async function openForm(preventivo){
    editingId = preventivo ? preventivo.id : null;
    editingPreventivo = preventivo;
    $('form-title').textContent = preventivo ? `Modifica ${preventivo.num}` : 'Nuovo preventivo';
    $('f-cliente').value = preventivo ? preventivo.clienteId : ($('f-cliente').options[0] ? $('f-cliente').options[0].value : '');
    refreshDestOptions($('f-cliente').value);
    $('f-dest').value = preventivo ? (preventivo.destId || '') : '';
    $('f-data').value = preventivo ? preventivo.data : today();
    $('f-note').value = preventivo ? (preventivo.note || '') : '';
    if(preventivo){
      $('f-num').value = preventivo.num;
    }else{
      $('f-num').value = '';
      try{ $('f-num').value = await store.peekNumber(companyId, 'PREV', Number($('f-data').value.slice(0, 4))); }
      catch(e){ /* l'anteprima non è essenziale: il campo resta vuoto, comunque modificabile a mano */ }
    }
    $('righe-body').innerHTML = '';
    (preventivo ? preventivo.righe : [null]).forEach(addRigaRow);
    setMsg('', '');
    $('form-card').hidden = false;
    $('list-card').hidden = true;
  }
  function closeForm(){ $('form-card').hidden = true; $('list-card').hidden = false; editingId = null; editingPreventivo = null; }
  $('new-preventivo').addEventListener('click', async () => {
    if($('f-cliente').options.length === 0){ alert('Crea prima almeno un cliente.'); return; }
    const lim = await store.checkDocLimit(companyId);
    if(!lim.ok){ alert(`Hai raggiunto il limite di ${lim.limite} documenti/mese del piano "${lim.piano}". Passa a un piano superiore in Impostazioni → Abbonamento per continuare.`); return; }
    await openForm(null);
  });
  $('f-cancel').addEventListener('click', closeForm);
  $('f-back').addEventListener('click', closeForm);

  $('f-save').addEventListener('click', async () => {
    const clienteId = $('f-cliente').value;
    const destId = $('f-dest').value || null;
    const data = $('f-data').value;
    const note = $('f-note').value.trim() || null;
    const righe = readRighe();
    if(!clienteId){ setMsg('Seleziona un cliente.', 'error'); return; }
    if(!data){ setMsg('Inserisci una data.', 'error'); return; }
    if(righe.length === 0){ setMsg('Aggiungi almeno una riga con una descrizione.', 'error'); return; }
    if(!editingId){
      const lim = await store.checkDocLimit(companyId);
      if(!lim.ok){ setMsg(`Hai raggiunto il limite di ${lim.limite} documenti/mese del piano "${lim.piano}". Passa a un piano superiore in Impostazioni → Abbonamento per continuare.`, 'error'); return; }
    }

    $('f-save').disabled = true;
    setMsg('', '');
    try{
      const doc = editingPreventivo ? Object.assign({}, editingPreventivo, { clienteId, destId, data, righe, note }) : { clienteId, destId, data, righe, note };
      const numInput = $('f-num').value.trim();
      if(editingId){
        doc.id = editingId;
        if(!numInput){ setMsg('Il numero non può essere vuoto.', 'error'); $('f-save').disabled = false; return; }
        if(numInput !== editingPreventivo.num){
          await store.bumpCounterPast(companyId, 'PREV', numInput);
          doc.num = numInput;
        }
      } else if(numInput){
        await store.bumpCounterPast(companyId, 'PREV', numInput);
        doc.num = numInput;
      } else {
        const anno = Number(data.slice(0, 4));
        doc.num = await store.nextNumber(companyId, 'PREV', anno);
      }
      await store.saveDoc('preventivi', doc, companyId);
      closeForm();
      await renderList();
    }catch(err){
      const dup = err && err.code === '23505';
      setMsg(dup ? 'Esiste già un preventivo con questo numero: scegline un altro.' : (err.message || 'Errore imprevisto durante il salvataggio.'), 'error');
    }finally{
      $('f-save').disabled = false;
    }
  });

  // "Trasforma in ordine": crea un vero ordine cliente con le stesse righe,
  // collegato al preventivo (prev_id), e marca il preventivo come
  // convertito (oc_id) — non tocca gli altri campi del preventivo: si passa
  // sempre l'oggetto completo già in memoria, altrimenti un salvataggio
  // parziale svuoterebbe silenziosamente i campi meno comuni (finiscono
  // nella colonna "extra", ricalcolata da zero ad ogni saveDoc).
  async function trasformaInOrdine(preventivo){
    if(!confirm(`Trasformare il preventivo ${preventivo.num} in un ordine cliente?`)) return;
    try{
      const anno = Number((preventivo.data || today()).slice(0, 4));
      const num = await store.nextNumber(companyId, 'OC', anno);
      // destId: la destinazione scelta sul preventivo si propaga da sola
      // all'ordine — come nel vecchio gestionale ("destId: pv.destId||null"),
      // stessa idea già portata in cascade.js per ordine → DDT.
      const ordine = await store.saveDoc('ordiniCliente', {
        clienteId: preventivo.clienteId, destId: preventivo.destId || null, data: today(), righe: preventivo.righe,
        prevId: preventivo.id, num,
      }, companyId);
      await store.saveDoc('preventivi', Object.assign({}, preventivo, { ocId: ordine.id }), companyId);
      await renderList();
    }catch(err){
      alert('Errore durante la trasformazione in ordine: ' + err.message);
    }
  }

  async function renderList(){
    renderFilterbar();
    const area = $('list-area');
    area.innerHTML = '<p class="empty">Carico…</p>';
    let elenco;
    try{
      elenco = await store.loadCollection('preventivi', companyId);
    }catch(err){
      area.innerHTML = `<p class="empty">Errore nel caricamento: ${esc(err.message)}</p>`;
      return;
    }
    if(elenco.length === 0){
      area.innerHTML = '<p class="empty">Nessun preventivo ancora. Crea prima un cliente, poi aggiungine uno con "+ Nuovo preventivo".</p>';
      return;
    }
    elenco = elenco.filter(matchesQuery).filter(matchesFilter);
    if(elenco.length === 0){
      area.innerHTML = '<p class="empty">Nessun preventivo trovato con questi criteri.</p>';
      return;
    }
    elenco.sort((a, b) => sortCmp(sortVal(SORT.key, a), sortVal(SORT.key, b), SORT.dir));
    const allChecked = elenco.length > 0 && elenco.every(p => PICK.has(p.id));
    area.innerHTML = `<div class="table-scroll"><table class="elenco-table"><thead><tr>
        <th class="check-col"><input type="checkbox" id="check-all" ${allChecked ? 'checked' : ''}></th>
        ${th('num','Numero')}${th('data','Data')}${th('cliente','Cliente')}${th('imponibile','Imponibile')}${th('iva','IVA')}${th('totale','Totale')}${th('stato','Stato')}<th></th>
      </tr></thead><tbody>${elenco.map(p => `
        <tr class="row-click" data-id="${p.id}">
          <td class="check-col"><input type="checkbox" class="row-check" data-id="${p.id}" ${PICK.has(p.id) ? 'checked' : ''}></td>
          <td class="num-col">${esc(p.num)}</td>
          <td>${p.data ? new Date(p.data).toLocaleDateString('it-IT') : '—'}</td>
          <td>${esc((clientiById[p.clienteId] || {}).nome) || '(cliente non trovato)'}${destSub(p)}</td>
          <td class="num-col">${eur(impTot(p.righe || []))}</td>
          <td class="num-col">${eur(ivaTot(p.righe || []))}</td>
          <td class="num-col">${eur(docTotale(p.righe || []))}</td>
          <td>${p.ocId ? '<span class="pill paid">convertito</span>' : '<span class="pill unpaid">aperto</span>'}</td>
          <td class="actions">${PICK.has(p.id) ? `
            ${p.ocId ? '' : `<button data-trasforma="${p.id}">Trasforma in ordine</button>`}
            <button data-print="${p.id}" title="Stampa">🖨</button><button data-pdf="${p.id}" title="Scarica PDF">⬇ PDF</button><button data-edit="${p.id}">Modifica</button>
            <button class="danger" data-del="${p.id}">Elimina</button>` : ''}
          </td>
        </tr>`).join('')}</tbody></table></div>`;
    window.SaasResize.makeColsResizable(area.querySelector('table'), 'preventivi-elenco');
    area.querySelectorAll('[data-sort]').forEach(th => th.addEventListener('click', () => setSort(th.dataset.sort)));
    $('check-all').addEventListener('click', e => {
      e.stopPropagation();
      if(e.target.checked) elenco.forEach(p => PICK.add(p.id));
      else elenco.forEach(p => PICK.delete(p.id));
      renderList();
    });
    area.querySelectorAll('.row-check').forEach(ch => ch.addEventListener('click', e => {
      e.stopPropagation();
      if(e.target.checked) PICK.add(ch.dataset.id); else PICK.delete(ch.dataset.id);
      renderList();
    }));
    area.querySelectorAll('[data-trasforma]').forEach(btn => btn.addEventListener('click', () => {
      trasformaInOrdine(elenco.find(x => x.id === btn.dataset.trasforma));
    }));
    area.querySelectorAll('[data-edit]').forEach(btn => btn.addEventListener('click', () => {
      openForm(elenco.find(x => x.id === btn.dataset.edit));
    }));
    area.querySelectorAll('tbody tr[data-id]').forEach(tr => tr.addEventListener('click', e => {
      if(e.target.closest('button, input, a, select')) return; // non aprire se il clic è su un pulsante/checkbox della riga
      openForm(elenco.find(x => x.id === tr.dataset.id));
    }));
    area.querySelectorAll('[data-print]').forEach(btn => btn.addEventListener('click', () => {
      const it = elenco.find(x => x.id === btn.dataset.print);
      window.SaasPrint.openPrintWindow('preventivi', it, clientiById[it.clienteId], company);
    }));
    area.querySelectorAll('[data-pdf]').forEach(btn => btn.addEventListener('click', async () => {
      const it = elenco.find(x => x.id === btn.dataset.pdf);
      btn.disabled = true;
      try{
        await window.SaasPrint.downloadPDF('preventivi', it, clientiById[it.clienteId], company);
      }catch(err){
        alert('Errore durante la generazione del PDF: ' + (err.message || err));
      }finally{
        btn.disabled = false;
      }
    }));
    area.querySelectorAll('[data-del]').forEach(btn => btn.addEventListener('click', async () => {
      const p = elenco.find(x => x.id === btn.dataset.del);
      if(!confirm(`Eliminare il preventivo ${p.num}? L'operazione non si può annullare.`)) return;
      try{
        await store.removeDoc('preventivi', p.id);
        await renderList();
      }catch(err){
        alert('Errore durante l\'eliminazione: ' + err.message);
      }
    }));
  }

  async function doLogout(){
    await store.signOut();
    localStorage.removeItem('saas_company_id');
    localStorage.removeItem('saas_company_nome');
    location.href = 'index.html';
  }

  async function init(){
    const session = await store.getSession();
    if(!session){ location.href = 'index.html'; return; }
    companyId = localStorage.getItem('saas_company_id');
    if(!companyId){ location.href = 'index.html'; return; }
    try{ company = await store.getCompany(companyId); }catch(e){ company = {}; } // niente PDF/stampa senza dati azienda? non deve comunque bloccare la pagina
    window.SaasNav.render('preventivi', {
      companyName: localStorage.getItem('saas_company_nome') || 'Azienda',
      email: session.user.email,
      onLogout: doLogout,
    });

    const clienti = await store.loadCollection('clienti', companyId);
    clientiById = Object.fromEntries(clienti.map(c => [c.id, c]));
    $('f-cliente').innerHTML = clienti.map(c => `<option value="${c.id}">${esc(c.nome)}</option>`).join('');

    window.SaasProdPicker.attach($('prodq'), $('prodsugg'), {
      companyId, priceField: 'listinoVen',
      onPick: p => addRigaRow({ cod: p.cod, descr: p.descr, qty: 1, prezzo: p.listinoVen || 0, sconto: '', iva: p.iva || 22 }),
    });

    await renderList();
  }
  init();
</script>
</body>
</html>

# Limiti di rischio per asset class.
#
# Compilato dal proprietario del progetto (profilo "Moderato", tutte e tre
# le asset class abilitate). Da questo momento il modulo di risk management
# (3) può autorizzare operazioni (anche in paper trading) nel rispetto dei
# limiti sotto. Per tornare allo stato "non operativo" basta rimettere
# `enabled: false` a livello globale o per la singola asset class.
#
# Nota vincolante: i limiti su "crypto" restano più stringenti di quelli su
# "equity" ed "etf" (max_portfolio_pct più basso, stop_loss_pct più stretto,
# volatilità massima più bassa) — è un vincolo di prodotto, non solo un
# default. Il modulo 3 valida questa relazione a runtime e si rifiuta di
# partire se violata.

version: 1
enabled: true   # deve restare true perché qualunque operazione, anche paper, sia autorizzata

equity:
  enabled: true
  max_portfolio_pct: 60.0        # % massima di portafoglio investibile in azioni singole
  max_position_pct: 10.0         # % massima di portafoglio su un singolo titolo
  stop_loss_pct: 8.0              # stop-loss percentuale di default per posizione
  max_volatility_annualized: 0.40 # soglia di volatilità oltre la quale un titolo è escluso

etf:
  enabled: true
  max_portfolio_pct: 70.0
  max_position_pct: 15.0
  stop_loss_pct: 6.0
  max_volatility_annualized: 0.35

crypto:
  enabled: true
  max_portfolio_pct: 10.0        # <= equity.max_portfolio_pct ed etf.max_portfolio_pct
  max_position_pct: 3.0
  stop_loss_pct: 5.0              # <= equity.stop_loss_pct ed etf.stop_loss_pct (più stretto)
  max_volatility_annualized: 0.30 # <= soglie equity/etf (filtro più severo)

# Limiti aggregati sull'intero portafoglio (tutte le asset class insieme).
portfolio:
  max_drawdown_pct: 15.0          # drawdown massimo tollerato prima di sospendere l'operatività
  max_daily_loss_pct: 3.0         # perdita massima giornaliera prima di fermare il sistema

# Configurazione dello scheduler autonomo (modulo 8 — orchestrazione).
#
# Fa girare da solo l'intera pipeline (dati -> segnali -> rischio ->
# allocazione -> esecuzione) alla cadenza scelta qui sotto. Non introduce
# alcun rischio nuovo di per sé: l'esecuzione resta sempre e comunque
# quella decisa da `config/execution.yaml` (`mode: paper` = unico default
# sicuro) — questo file controlla solo QUANDO il ciclo gira, mai CON CHE
# soldi. Per fermare lo scheduler senza toccare execution.yaml, basta
# mettere `enabled: false` qui.

enabled: true

# 'daily'          -> un run al giorno, all'ora UTC in run_at_utc
# 'interval_hours' -> un run ogni interval_hours ore, a partire dall'avvio
cadence: daily

run_at_utc: "06:00"    # usato solo se cadence: daily — formato "HH:MM", 24h, UTC
interval_hours: 4        # usato solo se cadence: interval_hours

# Ampiezza (in giorni) della finestra di dati storici ri-scaricata ad ogni
# ciclo, per tenere aggiornate le barre usate da segnali/rischio.
data_lookback_days: 30

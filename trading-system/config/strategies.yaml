# Regole configurabili dello strategy engine (modulo 2), per asset class.
#
# Ogni strategia legge la propria sezione da qui: puoi attivarla/disattivarla
# (`enabled`) e cambiarne i parametri senza toccare il codice. Questo file
# NON sostituisce config/risk_limits.yaml: uno strategy engine con
# `enabled: true` può generare segnali BUY/SELL, ma nessun ordine reale può
# partire finché il modulo di risk management (3) non li ha validati contro
# i limiti di rischio.

etf:
  moving_average:
    enabled: true
    short_window: 20      # barre (default: giorni, se timeframe=1d)
    long_window: 50
    # oltre questa % di scostamento tra le due medie la confidenza satura a 1.0
    confidence_scale_pct: 5.0

equity:
  moving_average:
    enabled: true
    short_window: 20
    long_window: 50
    confidence_scale_pct: 5.0
  fundamentals:
    enabled: true
    max_pe_ratio: 30.0
    min_return_on_equity: 0.10
    max_debt_to_equity: 200.0   # yfinance esprime debtToEquity in %, es. 150 = 150%
    min_revenue_growth: 0.0
    # se il punteggio fondamentale scende sotto questa soglia, un segnale
    # BUY tecnico viene declassato a HOLD (veto), indipendentemente dal trend
    veto_below_score: 0.5

crypto:
  rsi_volatility:
    enabled: true
    rsi_period: 14
    rsi_oversold: 30.0
    rsi_overbought: 70.0
    volatility_window: 20
    # soglia di volatilità annualizzata oltre la quale il segnale è
    # forzato a HOLD: per le crypto questo filtro è sempre più severo di
    # quello equivalente su azioni/ETF, in linea con il vincolo di prodotto
    # "crypto = rischio più alto a prescindere".
    max_volatility_annualized: 0.80
